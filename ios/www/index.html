<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fusion Academy</title>
<style>
  :root{--gold:#C9A24C;--cream:#EAE3D5;--muted:#8a8272;--bg:#141210;--card:#1b1916;--border:#2e2a20}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,'Manrope',system-ui,sans-serif;background:var(--bg);color:var(--cream);
    min-height:100vh;display:grid;place-items:center;padding:28px env(safe-area-inset-right) 28px env(safe-area-inset-left);text-align:center}
  .box{max-width:360px}
  img{width:86px;height:86px;border-radius:22px;margin-bottom:22px}
  h1{font-size:1.35rem;font-weight:700;margin-bottom:10px}
  p{color:var(--muted);font-size:.95rem;line-height:1.5;margin-bottom:22px}
  button{font:inherit;font-weight:700;background:var(--gold);color:#1a1611;border:0;border-radius:14px;padding:13px 26px;cursor:pointer}
  .stav{margin-top:16px;font-size:.8rem;color:var(--muted);min-height:1.2em}
</style>
</head>
<body>
  <!-- Táto stránka sa ukáže len vtedy, keď appka nemá internet. Inak sa rovno načíta
       app.fusionacademy.sk (nastavené v capacitor.config.json → server.url). -->
  <div class="box">
    <img src="logo-mark.png" alt="Fusion Academy">
    <h1>Nie si online</h1>
    <p>Appka potrebuje internet, aby ti ukázala rozvrh a tvoje rezervácie. Skontroluj pripojenie a skús to znova.</p>
    <button id="znova">Skúsiť znova</button>
    <div class="stav" id="stav"></div>
  </div>
<script>
  const APP='https://app.fusionacademy.sk/client-dashboard';
  const stav=document.getElementById('stav');
  async function skus(){
    stav.textContent='Skúšam…';
    try{
      const r=await fetch('https://app.fusionacademy.sk/manifest.json',{cache:'no-store'});
      if(r.ok){ location.href=APP; return; }
      stav.textContent='Server neodpovedá, skús o chvíľu.';
    }catch(e){ stav.textContent='Stále bez internetu.'; }
  }
  document.getElementById('znova').onclick=skus;
  window.addEventListener('online', skus);
  skus();
</script>
</body>
</html>
