<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vstupenky sú tvoje – Fusion Academy</title>
<link rel="icon" type="image/png" href="/logo-mark.png">
<style>
:root{--gold:#C9A84C;--cream:#EAE3D5;--muted:#9d9788;--card:#1a1712;--line:#2e2a20}
*{box-sizing:border-box}
body{background:#12100a;color:var(--cream);font-family:'Inter',system-ui,sans-serif;margin:0;padding:24px 16px 60px}
.wrap{max-width:560px;margin:0 auto;text-align:center}
.tick{font-size:3rem}
h1{font-size:1.45rem;margin:10px 0 6px}
p{color:#cfc7b6;line-height:1.7}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:14px 0;text-align:left}
.t{border-top:1px solid var(--line);padding:16px 0 6px}
.t:first-child{border:none}
.t b{color:var(--gold);display:block}
.t small{color:var(--muted)}
.t img{display:block;margin:10px auto 0;background:#fff;padding:8px;border-radius:10px;width:210px;height:210px}
.btn{display:inline-block;background:linear-gradient(135deg,#e0be5c,#b8912f);color:#191408;text-decoration:none;
  border-radius:12px;padding:13px 24px;font-weight:800;margin-top:16px}
.muted{color:var(--muted);font-size:.85rem}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="muted">Overujem platbu…</p></div>
<script>
const num = new URLSearchParams(location.search).get('order');
const SLUG = location.pathname.split('/')[2] || '';
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

async function go(tries){
  try{
    const r = await fetch('/api/events/order/'+encodeURIComponent(num));
    const j = await r.json();
    if(!j.ok) throw new Error(j.error||'Objednávka sa nenašla');
    if(j.status!=='paid'){
      // Webhook môže meškať pár sekúnd — skúsime ešte.
      if(tries<6) return setTimeout(()=>go(tries+1), 1500);
      document.getElementById('app').innerHTML =
        '<h1>Platbu ešte spracúvame</h1><p>Potvrdenie ti príde e-mailom, hneď ako banka platbu potvrdí. '
        +'Ak by neprišlo do pár minút, zavolaj na <a href="tel:+421904315151" style="color:#C9A84C">0904 31 51 51</a>.</p>';
      return;
    }
    let h = '<div class="tick">🎟️</div><h1>Hotovo — vstupenky sú tvoje!</h1>'
      + '<p>Poslali sme ich aj na <b>'+esc(j.buyer_email)+'</b>. QR kód ukáž pri vstupe priamo z telefónu.</p>'
      + '<p class="muted">Objednávka '+esc(j.order_number)+' · zaplatené '+String(j.total).replace('.',',')+' €</p>'
      + '<div class="card">'
      + j.tickets.map((t,i)=>'<div class="t"><b>'+esc(t.type_name)+'</b>'
          +'<small>'+esc(t.holder_name)+' · vstupenka '+(i+1)+' z '+j.tickets.length+'</small>'
          +'<img src="/api/tickets/'+esc(t.code)+'/qr.png" alt="QR kód vstupenky"></div>').join('')
      + '</div>'
      + '<a class="btn" href="/client-dashboard">Späť do aplikácie</a>'
      + '<div style="margin-top:12px"><a href="/event/'+esc(SLUG)+'" style="color:#C9A84C;font-size:.9rem">Detail eventu a program</a></div>';
    document.getElementById('app').innerHTML = h;
  }catch(e){
    document.getElementById('app').innerHTML='<p class="muted">'+esc(e.message)+'</p>';
  }
}
if(num) go(0); else document.getElementById('app').innerHTML='<p class="muted">Chýba číslo objednávky.</p>';
</script>
</body>
</html>
