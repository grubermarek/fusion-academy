<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>História konta – Fusion Academy</title>
<link rel="icon" type="image/png" href="/logo-mark.png">
<link rel="stylesheet" href="/fa-theme.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--gold:#C9A24C;--cream:#EAE3D5;--muted:#8a8272;--bg:#141210;--card:#1b1916;--border:#2e2a20;--plus:#5fbf7f;--minus:#d98c8c}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Manrope',system-ui,sans-serif;background:var(--bg);color:var(--cream);min-height:100vh;padding:20px 16px 70px}
  .wrap{max-width:720px;margin:0 auto}
  .back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;font-size:.85rem;margin-bottom:14px}
  .back:hover{color:var(--gold)}
  h1{font-family:'Cormorant Garamond',serif;font-size:1.9rem;font-weight:600;margin-bottom:4px}
  .podnadpis{color:var(--muted);font-size:.88rem;margin-bottom:18px}
  .stavy{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:18px}
  .stav{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px}
  .stav .cislo{font-size:1.5rem;font-weight:800;color:var(--gold);line-height:1.1}
  .stav .popis{color:var(--muted);font-size:.78rem;margin-top:3px}
  .filtre{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .chip{background:var(--card);border:1px solid var(--border);color:var(--cream);border-radius:999px;padding:7px 14px;font-size:.82rem;cursor:pointer;font-family:inherit}
  .chip.on{background:var(--gold);border-color:var(--gold);color:#1a1611;font-weight:700}
  .mesiac{color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;margin:18px 0 8px}
  .riadok{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:8px}
  .ikona{width:34px;height:34px;flex:0 0 34px;border-radius:10px;display:grid;place-items:center;background:#231f19;color:var(--gold);font-size:1rem}
  .telo{flex:1;min-width:0}
  .text{font-size:.92rem;line-height:1.35}
  .detail{color:var(--muted);font-size:.78rem;margin-top:3px}
  .zmena{font-weight:800;font-size:.95rem;white-space:nowrap}
  .zmena.plus{color:var(--plus)}
  .zmena.minus{color:var(--minus)}
  .zostatok{color:var(--muted);font-size:.72rem;text-align:right;margin-top:2px;white-space:nowrap}
  .prazdne{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:28px 18px;text-align:center;color:var(--muted)}
  .pozn{color:var(--muted);font-size:.78rem;margin-top:18px;line-height:1.5;border-top:1px solid var(--border);padding-top:14px}
</style>
<script src="/nativ.js" defer></script>
</head>
<body>
<div class="wrap">
  <a class="back" id="spat" href="/client-dashboard"><i class="bi bi-arrow-left"></i> <span>Späť na nástenku</span></a>
  <h1 id="nadpis">História konta</h1>
  <div class="podnadpis" id="podnadpis">Načítavam…</div>
  <div class="stavy" id="stavy"></div>
  <div class="filtre" id="filtre"></div>
  <div id="zoznam"></div>
  <div class="pozn">Každý pohyb vstupov, hodín zdarma a členstva sa zapisuje automaticky. Keď hodinu zruší štúdio, vstup sa vracia späť a mesačné členstvo sa predlžuje — uvidíš to tu ako samostatný riadok. Keby ti niečo nesedelo, napíš nám a pozrieme sa na to spolu.</div>
</div>
<script>
const MESIACE=['január','február','marec','apríl','máj','jún','júl','august','september','október','november','december'];
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const IKONY={hodina:'bi-music-note-beamed', vstupy:'bi-ticket-perforated', hodiny_zdarma:'bi-gift', clenstvo:'bi-calendar-heart', platba:'bi-credit-card-2-front', kredit:'bi-wallet2'};
const FILTRE=[['vsetko','Všetko'],['hodina','Hodiny'],['vstupy','Vstupy'],['clenstvo','Členstvo'],['platba','Platby']];
const idZUrl=(location.pathname.match(/^\/historia\/([\w-]+)/)||[])[1]||null;
let DATA=null, filter='vsetko';

const denSk=d=>{ const [r,m,x]=String(d||'').split('-'); return x? (+x)+'. '+(+m)+'. '+r : (d||''); };

function render(){
  const z=document.getElementById('zoznam');
  const riadky=(DATA.riadky||[]).filter(r=>filter==='vsetko' || r.typ===filter || (filter==='vstupy'&&r.typ==='hodiny_zdarma'));
  if(!riadky.length){ z.innerHTML='<div class="prazdne">Zatiaľ tu nič nie je.</div>'; return; }
  let html='', poslednyMesiac='';
  for(const r of riadky){
    const mes=String(r.den||'').slice(0,7);
    if(mes!==poslednyMesiac){
      poslednyMesiac=mes;
      const [rok,m]=mes.split('-');
      if(rok) html+='<div class="mesiac">'+esc(MESIACE[(+m||1)-1]+' '+rok)+'</div>';
    }
    const zmena=+r.zmena||0;
    const jednotka=r.typ==='clenstvo' ? (Math.abs(zmena)===1?' deň':(Math.abs(zmena)<5?' dni':' dní')) : '';
    const zmenaHtml = zmena ? '<div class="zmena '+(zmena>0?'plus':'minus')+'">'+(zmena>0?'+':'−')+Math.abs(zmena)+jednotka+'</div>' : '';
    const zostatokHtml = (r.zostatok!==null && r.zostatok!==undefined && (r.typ==='vstupy'||r.typ==='hodiny_zdarma'))
      ? '<div class="zostatok">zostatok '+r.zostatok+'</div>' : '';
    const sumaHtml = r.suma ? '<div class="zmena">'+(+r.suma).toFixed(2).replace('.',',')+' €</div>' : '';
    const detaily=[r.hodina?esc(r.hodina):'', r.do_kedy?('platí do '+denSk(r.do_kedy)):''].filter(Boolean).join(' · ');
    html+='<div class="riadok">'
      +'<div class="ikona"><i class="bi '+(IKONY[r.typ]||'bi-dot')+'"></i></div>'
      +'<div class="telo"><div class="text">'+esc(r.text||'')+'</div>'
      +'<div class="detail">'+denSk(r.den)+(detaily?' · '+detaily:'')+'</div></div>'
      +'<div>'+(zmenaHtml||sumaHtml)+zostatokHtml+'</div></div>';
  }
  z.innerHTML=html;
}

function renderHlavicka(){
  document.getElementById('podnadpis').textContent = idZUrl && DATA.klientka ? DATA.klientka : 'Kedy si bola na hodine, kedy ti pribudol alebo ubudol vstup a dokedy ti platí členstvo.';
  if(idZUrl && DATA.klientka){ document.getElementById('nadpis').textContent='História konta – '+DATA.klientka; }
  const s=[['vstupy', DATA.vstupy, 'vstupov z permanentky'], ['hodiny', DATA.hodiny_zdarma, 'hodín zdarma']];
  let html='';
  for(const [k,v,popis] of s) html+='<div class="stav"><div class="cislo">'+(v||0)+'</div><div class="popis">'+popis+'</div></div>';
  if(DATA.clenstvo) html+='<div class="stav"><div class="cislo" style="font-size:1.05rem;padding-top:6px">'+esc(DATA.clenstvo.plan)+'</div><div class="popis">platí do '+denSk(DATA.clenstvo.do)+(DATA.clenstvo.trial?' · týždeň zadarmo':'')+'</div></div>';
  if(DATA.kredit>0) html+='<div class="stav"><div class="cislo">'+(+DATA.kredit).toFixed(2).replace('.',',')+' €</div><div class="popis">Fusion kredit</div></div>';
  document.getElementById('stavy').innerHTML=html;
  document.getElementById('filtre').innerHTML=FILTRE.map(([k,n])=>'<button class="chip'+(k===filter?' on':'')+'" data-f="'+k+'">'+n+'</button>').join('');
  document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{ filter=b.dataset.f; renderHlavicka(); render(); });
}

(async()=>{
  try{
    const cesta = idZUrl ? '/api/historia-konta/'+encodeURIComponent(idZUrl) : '/api/me/historia-konta';
    const r = await fetch(cesta,{credentials:'include'});
    if(r.status===401){ location.href='/?next='+encodeURIComponent(location.pathname); return; }
    if(!r.ok){ document.getElementById('podnadpis').textContent='Históriu sa nepodarilo načítať ('+r.status+').'; return; }
    DATA = await r.json();
    renderHlavicka(); render();
    // späť tam, odkiaľ som prišla
    try{
      const ref=document.referrer ? new URL(document.referrer) : null;
      const odkial = ref && ref.origin===location.origin ? ref.pathname : null;
      const b=document.getElementById('spat');
      if(odkial && /^\/(admin|trainer|u\/)/.test(odkial.slice(1)===''?'':odkial)){
        b.href=odkial; b.querySelector('span').textContent='Späť';
      }
    }catch(e){}
  }catch(e){ document.getElementById('podnadpis').textContent='Históriu sa nepodarilo načítať.'; }
})();
</script>
</body>
</html>
