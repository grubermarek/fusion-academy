<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Fusion Academy — Kiosk</title>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root{ --gold:#C9A84C; --gold2:#E7C878; --cream:#EFE6D0; --muted:#9B9078; --ground:#0B0A07; --card:#161310; }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
  html,body{height:100%;overflow:hidden;background:var(--ground);color:var(--cream);font-family:'Helvetica Neue',system-ui,sans-serif;cursor:none}
  /* ── vrstvy ── */
  .layer{position:fixed;inset:0;display:none}
  .layer.on{display:flex}
  /* ── SLIDESHOW ── */
  #stage{align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:5vmin;
    background:radial-gradient(120% 90% at 50% -20%, rgba(201,168,76,.14), transparent 55%), var(--ground)}
  .slide{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6vmin;text-align:center;opacity:0;transform:scale(1.04);transition:opacity 1.1s ease, transform 8s linear;pointer-events:none}
  .slide.show{opacity:1;transform:scale(1)}
  .kicker{font-size:2.2vmin;letter-spacing:.35em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:2.5vmin}
  .big{font-family:Georgia,serif;font-size:8vmin;line-height:1.05;max-width:82vw;text-wrap:balance}
  .big .g{color:var(--gold2)}
  .sub{font-size:2.8vmin;color:var(--muted);margin-top:2.5vmin;max-width:70vw;line-height:1.5}
  .huge{font-family:Georgia,serif;font-size:16vmin;color:var(--gold2);line-height:1}
  .chiprow{display:flex;gap:1.6vmin;flex-wrap:wrap;justify-content:center;margin-top:3vmin}
  .chip{background:rgba(201,168,76,.1);border:1px solid rgba(201,168,76,.35);border-radius:999px;padding:1.4vmin 3vmin;font-size:2.4vmin}
  .progrow{display:flex;justify-content:space-between;align-items:center;gap:2vmin;width:min(80vw,900px);background:var(--card);border:1px solid rgba(201,168,76,.25);border-radius:2vmin;padding:2.4vmin 3vmin;margin-top:1.6vmin;font-size:2.8vmin;text-align:left}
  .cap{font-variant-numeric:tabular-nums;color:var(--gold2);font-weight:800}
  /* logo + hodiny hore */
  #topbar{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:2.2vmin 3.2vmin;z-index:5}
  #topbar .brand{font-size:2.4vmin;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);font-weight:800}
  #clock{font-variant-numeric:tabular-nums;font-size:2.6vmin;color:var(--muted)}
  /* ── CHECK-IN CTA ── */
  #cta{position:fixed;left:50%;bottom:4vmin;transform:translateX(-50%);z-index:6;
    background:linear-gradient(135deg,var(--gold),#a07830);color:#141310;border:none;border-radius:999px;
    padding:3vmin 7vmin;font-size:3.4vmin;font-weight:900;letter-spacing:.04em;cursor:pointer;
    box-shadow:0 0 0 0 rgba(201,168,76,.5);animation:pulse 2.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(201,168,76,.45)}70%{box-shadow:0 0 0 3.2vmin rgba(201,168,76,0)}100%{box-shadow:0 0 0 0 rgba(201,168,76,0)}}
  /* ── SCANNER ── */
  #scan{background:rgba(6,5,3,.97);flex-direction:column;align-items:center;justify-content:center;gap:3vmin;z-index:20}
  #qrbox{width:min(70vmin,520px);border-radius:2.4vmin;overflow:hidden;border:2px solid rgba(201,168,76,.5)}
  #scanMsg{font-size:2.8vmin;color:var(--muted)}
  #scanClose{background:none;border:1px solid rgba(201,168,76,.4);color:var(--gold);border-radius:999px;padding:1.8vmin 5vmin;font-size:2.6vmin;cursor:pointer}
  /* ── WELCOME ── */
  #welcome{background:radial-gradient(100% 100% at 50% 0%, rgba(201,168,76,.22), transparent 60%), var(--ground);
    flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2.4vmin;z-index:30}
  #wAvatar{width:22vmin;height:22vmin;border-radius:50%;border:4px solid var(--gold);object-fit:cover;background:var(--card);
    display:flex;align-items:center;justify-content:center;font-size:9vmin;font-family:Georgia,serif;color:var(--gold2)}
  #wName{font-family:Georgia,serif;font-size:8vmin}
  #wRows{display:flex;flex-direction:column;gap:1.4vmin;font-size:3.4vmin}
  #wRows .r{opacity:0;transform:translateY(2vmin);animation:up .5s forwards}
  @keyframes up{to{opacity:1;transform:none}}
  /* ── NOC ── */
  #night{background:#050503;flex-direction:column;align-items:center;justify-content:center;gap:2vmin;z-index:40}
  #night .z{font-family:Georgia,serif;font-size:6vmin;color:rgba(201,168,76,.5)}
  canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
  #err{position:fixed;bottom:1vmin;left:1vmin;font-size:1.6vmin;color:#553}
  /* Druhé tlačidlo: prihlásenie na dnešné hodiny. Zámerne tichšie než check-in —
     ten je častejší a musí ostať tým, čo padne do oka ako prvé. */
  /* Prihlásenie na ďalšie hodiny má vlastné tlačidlo až na uvítacej obrazovke —
     dve výzvy na skenovanie vedľa seba mýlili (Marek 31. 8.). */
  #wMore{margin-top:2.4vmin;background:rgba(201,168,76,.14);border:1px solid rgba(201,168,76,.5);
    color:var(--gold);border-radius:999px;padding:1.6vmin 5vmin;font-size:2.2vmin;font-weight:800;cursor:pointer}
  /* výber hodín */
  #pick{background:rgba(6,5,3,.97);flex-direction:column;align-items:center;justify-content:center;gap:2vmin;z-index:22;padding:4vmin}
  #pickHead{font-size:3.2vmin;font-weight:800;color:var(--cream)}
  #pickSub{font-size:2.1vmin;color:var(--muted);margin-top:-1vmin;text-align:center;max-width:74vmin}
  #pickList{display:flex;flex-direction:column;gap:1.4vmin;width:min(74vmin,92vw);max-height:52vmin;overflow-y:auto}
  .pk{display:flex;align-items:center;gap:2vmin;background:rgba(20,16,8,.8);border:2px solid rgba(201,168,76,.28);
    border-radius:2vmin;padding:2vmin 2.4vmin;cursor:pointer;text-align:left}
  .pk.sel{border-color:var(--gold);background:linear-gradient(135deg,rgba(201,168,76,.22),rgba(201,168,76,.06))}
  .pk.off{opacity:.45;cursor:default}
  .pk .box{width:4.2vmin;height:4.2vmin;border-radius:1vmin;border:2px solid rgba(201,168,76,.5);flex:none;
    display:grid;place-items:center;font-size:2.6vmin;color:var(--gold2)}
  .pk.sel .box{background:var(--gold);border-color:var(--gold);color:#141008}
  .pk .txt{flex:1;min-width:0}
  .pk .nm{font-size:2.6vmin;font-weight:800;color:var(--cream)}
  .pk .mt{font-size:1.9vmin;color:var(--muted);margin-top:.4vmin}
  .pk .tm{font-size:2.6vmin;font-weight:800;color:var(--gold2);font-variant-numeric:tabular-nums;flex:none}
  #pickInfo{font-size:2vmin;color:var(--muted);text-align:center;min-height:2.6vmin}
  #pickBtns{display:flex;gap:2vmin;margin-top:1vmin}
  #pickOk{background:linear-gradient(135deg,var(--gold),#a07030);border:0;color:#141008;border-radius:999px;
    padding:1.9vmin 6vmin;font-size:2.6vmin;font-weight:900;cursor:pointer}
  #pickOk:disabled{opacity:.4;cursor:default}
  #pickCancel{background:none;border:1px solid rgba(201,168,76,.4);color:var(--gold);border-radius:999px;
    padding:1.9vmin 4vmin;font-size:2.4vmin;cursor:pointer}
</style>
</head>
<body>
<div id="topbar"><span class="brand">Fusion Academy · <span id="cityName"></span></span><span id="clock">--:--</span></div>

<div class="layer on" id="stage"></div>
<button id="cta" onclick="openScan()">✋ ŤUKNI A CHECKNI SA</button>

<div class="layer" id="scan">
  <div class="kicker">QR Check-in</div>
  <div id="qrbox"></div>
  <div id="scanMsg">Ukáž kamere svoj QR kód z appky 📱</div>
  <button id="scanClose" onclick="closeScan()">Zavrieť</button>
</div>

<div class="layer" id="pick">
  <div id="pickHead">Na ktoré tréningy sa prihlasuješ?</div>
  <div id="pickSub"></div>
  <div id="pickList"></div>
  <div id="pickInfo"></div>
  <div id="pickBtns">
    <button id="pickCancel" onclick="zavriVyber()">Späť</button>
    <button id="pickOk" onclick="odosliVyber()">Prihlásiť sa</button>
  </div>
</div>

<div class="layer" id="welcome"></div>

<div class="layer" id="night">
  <div class="brand" style="font-size:3vmin;letter-spacing:.3em;color:var(--gold)">FUSION ACADEMY</div>
  <div class="z">Dobrú noc 🌙</div>
  <div id="nightClock" style="font-size:5vmin;color:var(--muted);font-variant-numeric:tabular-nums"></div>
</div>

<canvas id="fx"></canvas>
<div id="err"></div>

<script>
'use strict';
/* ── Kontext: /kiosk/:studio?k=token ── */
const SLUG = location.pathname.split('/').filter(Boolean)[1] || '';
const KEY  = new URLSearchParams(location.search).get('k') || '';
let CFG=null, DATA=null, slides=[], slideIdx=0, slideTimer=null, idleTimer=null, paused=false, qrReader=null, scanBusy=false;
// 'checkin' = doterajší zápis účasti, 'signup' = výber dnešných hodín cez checkboxy
let skenRezim='checkin', poslednyQr='', welcomeTimer=null, vyberQr='', vyberHodiny=[], vyberVybrane=new Set();

const $=id=>document.getElementById(id);
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* ── Statické obsahy ── */
const HEALTH=[
 ['🫀','Tanec podporuje srdce','Pravidelný tanec zlepšuje kondíciu srdca a ciev — už 2 hodiny týždenne robia rozdiel.'],
 ['🔥','400–800 kcal za hodinu','Jedna hodina Zumby spáli toľko, čo hodina behu — a je pri tom zábava.'],
 ['🧠','Posilňuje mozog','Učenie choreografií tvorí nové nervové spojenia a zlepšuje pamäť.'],
 ['🧘','Menej stresu','Tanec preukázateľne znižuje hladinu kortizolu a zlepšuje náladu.'],
 ['💧','Pi vodu!','Počas hodiny vypi aspoň pol litra — telo ti poďakuje.'],
 ['🤸','Strečing po hodine','5 minút strečingu po tanci = menej svalovice a lepšia mobilita.'],
 ['🛌','Regenerácia je tréning','Kvalitný spánok po tréningu je polovica výsledku.'],
 ['🥗','Jedlo po hodine','Do 60 minút po tréningu si daj bielkoviny — svaly sa ti poďakujú.'],
 ['🦴','Lepšie držanie tela','Tanec prirodzene narovnáva chrbát a posilňuje stred tela.'],
 ['😊','Sebavedomie rastie','Každá zvládnutá choreografia = malé víťazstvo, ktoré si odnášaš zo sály.']];
const APP_PROMO=[
 ['📱','Rezervuj si hodiny v appke','Dva kliky a máš miesto. Žiadne volanie, žiadne čakanie.'],
 ['⭐','Zbieraj body a odznaky','Každá hodina sa počíta — súťaž o Klientku mesiaca beží stále.'],
 ['👯','Komunita','Fotky, výzvy, ankety a kamarátky — všetko v appke.'],
 ['🤝','Priveď kamarátku','Ona má prvú hodinu zadarmo, ty odmenu z referral programu.'],
 ['✨','Súkromné hodiny','Tréner len pre teba — vyber si termín z kalendára v appke.'],
 ['🍽️','Jedálničky na mieru','Gold členky majú týždenné jedálničky na jeden klik.']];
const UPSELL=[
 ['🥇','GOLD členstvo','Neobmedzené hodiny + jedálniček + −30 % na súkromné hodiny.'],
 ['🥈','SILVER členstvo','Neobmedzené hodiny + online prístup + −20 % na súkromky.'],
 ['🎟️','Permanentka 10 vstupov','80 € · bez záväzku · platí 3 mesiace.'],
 ['✨','Súkromná hodina od 25 €/h','1:1 s trénerom — svadobný tanec, technika, čokoľvek.'],
 ['🎽','Fusion merch','Tričká, tielka a tašky — spýtaj sa trénera alebo pozri e-shop v appke.']];
const QUOTES=[
 'Nikto sa na teba nepozerá.\nKaždý rieši samého seba. 😊',
 'Nemusíš byť dokonalá.\nStačí prísť.',
 'Tancuj, ako keby sa nikto nedíval.',
 'Najťažší krok je ten\ncez prah dverí. Ten už máš za sebou.',
 'Energia, ktorú dnes dáš parketu,\nsa ti vráti dvojnásobne.'];
const CHALLENGES=[
 '💪 Výzva týždňa: príď 3× tento týždeň!',
 '👯 Výzva: priveď kamarátku — má prvú hodinu zadarmo!',
 '📸 Výzva: zdieľaj fotku z hodiny do komunity!',
 '⭐ Výzva: nazbieraj tento mesiac 50 bodov!'];

/* ── Slide builder ── */
function buildSlides(){
  const W=(CFG.widgets)||{}; const S=[];
  const add=(html)=>S.push(html);
  if(CFG.announcement) add(sl('Oznam','📢','<div class="big">'+esc(CFG.announcement)+'</div>'));
  if(W.events!==false) (DATA.events||[]).forEach(ev=>{
    const mc=/masterclass|workshop|master class/i.test(ev.name+' '+(ev.subtitle||''));
    add(sl(mc?'Masterclass':'Pozvánka', mc?'🎓':'🎉',
      '<div class="big">'+esc(ev.name)+(ev.subtitle?'<br><span class="g" style="font-size:5vmin">'+esc(ev.subtitle)+'</span>':'')+'</div>'+
      '<div class="chiprow">'+
        (ev.date_label||ev.date?'<span class="chip">📅 '+esc(ev.date_label||fmtDate(ev.date))+'</span>':'')+
        (ev.venue?'<span class="chip">📍 '+esc(ev.venue)+'</span>':'')+
      '</div>'+
      '<div class="sub">Vstupenky a program nájdeš tu — naskenuj kód alebo sa spýtaj trénera 💛</div>'+
      qrUrl(ev.url)));
    // Samostatný slide pre každý typ vstupenky (masterclass / párty)
    (ev.types||[]).filter(t=>!t.sold_out).forEach(t=>{
      const tmc=/masterclass|workshop/i.test(t.name+' '+(t.includes||[]).join(' '));
      add(sl(tmc?'Masterclass':'Vstupenka', tmc?'🎓':'🎟️',
        '<div class="big" style="font-size:6.5vmin">'+esc(t.name)+'</div>'+
        ((t.includes||[]).length?'<div class="chiprow">'+t.includes.map(x=>'<span class="chip">'+esc(x)+'</span>').join('')+'</div>':'')+
        '<div class="sub">'+esc(priceLine(t))+'<br>'+esc(ev.date_label||fmtDate(ev.date))+' · '+esc(ev.venue||'')+
        (t.left!=null&&t.left<=10?'<br><b style="color:var(--gold2)">Zostáva '+t.left+' miest</b>':'')+'</div>'+
        qrUrl(ev.url)));
    });
  });
  if(DATA.running) add(sl('Práve prebieha','🤫',
    '<div class="big">Hodina práve prebieha<br><span class="g">'+esc(DATA.running.emoji+' '+DATA.running.name)+'</span></div>'+
    (DATA.next?'<div class="sub">Ďalšia hodina: <b style="color:var(--cream)">'+esc(DATA.next.time_start)+' '+esc(DATA.next.name)+'</b></div>':'')+
    '<div class="sub">Ak si prišla skôr, počkaj prosím v šatni — nerušme tie, čo práve tancujú 💛</div>'));
  if(W.program!==false && DATA.program.length){
    add(sl('Dnešný program','🗓️','<div class="big">Dnes v štúdiu <span class="g">'+esc(DATA.city)+'</span></div>'+
      DATA.program.map(p=>'<div class="progrow"><span>'+esc(p.emoji)+' <b>'+esc(p.name)+'</b> · '+esc(p.instructor)+'</span><span>'+esc(p.time_start)+'–'+esc(p.time_end||'')+' · <span class="cap">'+p.booked+'/'+p.capacity+'</span></span></div>').join('')));
  }
  if(W.stats!==false) add(sl('Naša komunita','🔥',
    '<div class="big">Dnes už odtancovalo</div><div class="huge">'+DATA.stats.today+'</div><div class="sub">členiek · tento týždeň '+DATA.stats.week+' návštev · celkovo '+DATA.stats.total.toLocaleString('sk')+' hodín spolu</div>'));
  if(W.klient_mesiaca!==false && DATA.spotlight && DATA.spotlight.length){
    add(sl('Klientka mesiaca','🏆','<div class="big">Najaktívnejšie tento mesiac</div><div class="chiprow">'+
      DATA.spotlight.map((s,i)=>'<span class="chip">'+['🥇','🥈','🥉'][i]+' <b>'+esc(s.name)+'</b> · '+s.visits+' hodín</span>').join('')+'</div>'));
  }
  if(W.birthdays!==false && DATA.birthdays.length){
    add(sl('Dnes oslavuje','🎂','<div class="big">Všetko najlepšie, <span class="g">'+DATA.birthdays.map(b=>esc(b.name.split(' ')[0])).join(' & ')+'</span>! 🎉</div><div class="sub">Zaželaj im na hodine 💛</div>'));
  }
  if(DATA.promo_class && DATA.promo_class.booked < DATA.promo_class.capacity*0.6){
    add(sl('Ešte je miesto','👟','<div class="big">'+esc(DATA.promo_class.emoji+' '+DATA.promo_class.name)+' o <span class="g">'+esc(DATA.promo_class.time_start)+'</span></div><div class="sub">Voľných ešte '+(DATA.promo_class.capacity-DATA.promo_class.booked)+' miest — rezervuj v appke alebo príď rovno!</div>'));
  }
  if(W.upsell!==false) UPSELL.forEach(u=>add(sl('Pre teba','🛍️',card(u))));
  if(W.health!==false) HEALTH.forEach(h=>add(sl('Vedela si, že…','💡',card(h))));
  if(W.app_promo!==false) APP_PROMO.forEach(p=>add(sl('Fusion appka','📲',card(p)+qrApp())));
  if(W.referral!==false) add(sl('Referral program','🤝','<div class="big">Priveď kamarátku —<br><span class="g">obe získate</span></div><div class="sub">Ona prvú hodinu zadarmo, ty odmenu do kreditu. Zdieľaj svoj link z appky!</div>'));
  if(W.challenge!==false) add(sl('Výzva','🎯','<div class="big">'+esc(CHALLENGES[new Date().getDate()%CHALLENGES.length])+'</div>'));
  QUOTES.forEach(qt=>add(sl('Fusion Academy','💛','<div class="big">'+esc(qt).replace(/\n/g,'<br>')+'</div>')));
  if(W.custom!==false) (CFG.custom_slides||[]).forEach(c=>add(sl('Oznam',''+(c.emoji||'✨'),'<div class="big">'+esc(c.title)+'</div>'+(c.text?'<div class="sub">'+esc(c.text)+'</div>':''))));
  return S;
}
function sl(kick, emoji, inner){ return '<div class="kicker">'+esc(emoji)+' '+esc(kick)+'</div>'+inner; }
function card([e,t,d]){ return '<div style="font-size:10vmin">'+e+'</div><div class="big" style="font-size:6.5vmin">'+esc(t)+'</div><div class="sub">'+esc(d)+'</div>'; }
function priceLine(t){
  const p=[];
  if(t.presale_on && t.presale!=null) p.push('v predpredaji '+t.presale+' €');
  if(t.door!=null) p.push('na mieste '+t.door+' €');
  if(t.member!=null) p.push('členky '+t.member+' €');
  return p.join(' · ');
}
function qrUrl(u){ var p=String(u||'/').replace(/^https?:\/\/[^/]+/,'')||'/'; return '<img src="/api/qr.png?size=440&dark=C9A84C&light=0B0A07&path='+encodeURIComponent(p)+'" style="margin-top:3vmin;border-radius:1.6vmin;border:1px solid rgba(201,168,76,.4);width:18vmin;height:18vmin" alt="QR">'; }
function fmtDate(d){ try{ return new Date(d+'T00:00:00').toLocaleDateString('sk-SK',{day:'numeric',month:'long',year:'numeric'}); }catch(e){ return d||''; } }
function qrApp(){ return '<img src="/api/qr.png?size=440&dark=C9A84C&light=0B0A07&path=%2F" style="margin-top:3vmin;border-radius:1.6vmin;border:1px solid rgba(201,168,76,.4);width:18vmin;height:18vmin" alt="QR">'; }

/* ── Slideshow engine ── */
function showSlide(i){
  const stage=$('stage');
  const old=stage.querySelector('.slide.show');
  const div=document.createElement('div'); div.className='slide'; div.innerHTML=slides[i];
  stage.appendChild(div);
  requestAnimationFrame(()=>requestAnimationFrame(()=>div.classList.add('show')));
  if(old){ old.classList.remove('show'); setTimeout(()=>old.remove(), 1300); }
}
function nextSlide(){ if(!slides.length) return; slideIdx=(slideIdx+1)%slides.length; showSlide(slideIdx); }
function startShow(){ stopShow(); if(!slides.length) return; showSlide(slideIdx%slides.length); slideTimer=setInterval(nextSlide, (CFG.interval_s||12)*1000); }
function stopShow(){ if(slideTimer){ clearInterval(slideTimer); slideTimer=null; } }

/* ── Idle / touch ── */
function poke(){
  if(paused){ /* už pozastavené */ } else { stopShow(); paused=true; }
  clearTimeout(idleTimer);
  idleTimer=setTimeout(()=>{ paused=false; startShow(); }, (CFG?CFG.idle_s:15)*1000);
}
['pointerdown','touchstart'].forEach(ev=>document.addEventListener(ev, e=>{
  if(e.target.closest('#cta')||e.target.closest('#wMore')||e.target.closest('#scan')
    ||e.target.closest('#scanClose')||e.target.closest('#pick')) return;
  poke();
  if(document.fullscreenElement==null && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(()=>{});
},{passive:true}));

/* ── Scanner ── */
async function openScan(rezim){
  skenRezim = rezim === 'signup' ? 'signup' : 'checkin';
  stopShow(); clearTimeout(idleTimer);
  $('scan').classList.add('on');
  $('scan').querySelector('.kicker').textContent = skenRezim==='signup' ? 'Prihlásenie na tréningy' : 'QR Check-in';
  $('scanMsg').textContent='Ukáž kamere svoj QR kód z appky 📱';
  try{
    qrReader=new Html5Qrcode('qrbox');
    await qrReader.start({facingMode:'user'}, {fps:10, qrbox:260}, onScan, ()=>{});
  }catch(e){
    try{ qrReader=new Html5Qrcode('qrbox'); await qrReader.start({facingMode:'environment'}, {fps:10, qrbox:260}, onScan, ()=>{}); }
    catch(e2){ $('scanMsg').textContent='❌ Kamera sa nedá spustiť — povoľ prístup ku kamere.'; }
  }
}
async function closeScan(){
  if(qrReader){ try{ await qrReader.stop(); qrReader.clear(); }catch(e){} qrReader=null; }
  $('scan').classList.remove('on'); scanBusy=false;
  paused=false; startShow();
}
async function onScan(txt){
  // Vstupenka na event? QR vedie na /t/KOD — rozpoznáme a spravíme check-in vstupenky.
  const m=String(txt||'').match(/\/t\/([A-Z0-9]{6,})/i);
  if(m){
    if(scanBusy) return; scanBusy=true;
    $('scanMsg').textContent='⏳ Overujem vstupenku…';
    try{
      const r=await fetch('/api/tickets/'+m[1].toUpperCase()+'/checkin?k='+encodeURIComponent(KEY),
        {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({place:SLUG})});
      const d=await r.json();
      const t=d.ticket||{};
      $('scanMsg').innerHTML='<div style="font-weight:900;font-size:1.4em;color:'+(d.ok?'#8bc34a':'#ff8a80')+'">'+(d.message||'')+'</div>'
        +(t.holder_name?'<div style="margin-top:6px">'+t.holder_name+' · '+(t.type_name||'')+'</div>':'')
        +(t.checked_in_at?'<div style="opacity:.7;font-size:.9em">Prvý vstup: '+String(t.checked_in_at).slice(11,16)+'</div>':'');
      setTimeout(()=>{scanBusy=false; $('scanMsg').textContent='Ukáž kamere svoj QR kód z appky 📱';}, 4500);
    }catch(e){ $('scanMsg').textContent='⚠️ Chyba spojenia — skús znova.'; scanBusy=false; }
    return;
  }

  if(scanBusy) return; scanBusy=true;
  poslednyQr=txt;                       // uvítacia obrazovka ho ponúkne znova použiť
  if(skenRezim==='signup'){ await nacitajHodiny(txt); return; }
  $('scanMsg').textContent='⏳ Overujem…';
  try{
    const r=await fetch('/api/kiosk/checkin',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({studio:SLUG, k:KEY, qr_data:txt})});
    const d=await r.json();
    if(r.ok && d.ok && d.choose){ showClassChoice(d, txt); return; }
    if(r.ok && d.ok){ await closeScan(); showWelcome(d); }
    else { $('scanMsg').textContent='⚠️ '+(d.error||'Skús to znova'); setTimeout(()=>{scanBusy=false; $('scanMsg').textContent='Ukáž kamere svoj QR kód z appky 📱';}, 3500); }
  }catch(e){ $('scanMsg').textContent='⚠️ Chyba spojenia — skús znova.'; scanBusy=false; }
}

/* ── Prihlásenie na dnešné tréningy: sken QR → checkboxy ─────────────────────
   Hodiny, ktoré práve bežia, zaškrtneme vopred — kto prišiel na hodinu, má tak
   len jeden ťuk. Ostatné si doklikne sama. */
async function nacitajHodiny(qrTxt){
  $('scanMsg').textContent='⏳ Načítavam dnešný rozvrh…';
  try{
    const r=await fetch('/api/kiosk/day-classes',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({studio:SLUG, k:KEY, qr_data:qrTxt})});
    const d=await r.json();
    if(!r.ok || !d.ok){
      $('scanMsg').textContent='⚠️ '+(d.error||'Skús to znova');
      setTimeout(()=>{scanBusy=false; $('scanMsg').textContent='Ukáž kamere svoj QR kód z appky 📱';}, 3500);
      return;
    }
    if(!d.classes.length){
      $('scanMsg').textContent='Dnes tu už nie je na čo sa prihlásiť. 💛';
      setTimeout(()=>{ closeScan(); }, 3000);
      return;
    }
    vyberQr=qrTxt; vyberHodiny=d.classes; vyberVybrane=new Set();
    vyberHodiny.forEach(c=>{ if(c.teraz && !c.moja && c.volnych>0) vyberVybrane.add(c.id); });
    await closeScan(); stopShow();
    $('pick').classList.add('on');
    $('pickHead').textContent='Ahoj '+(d.first||'')+', na čo sa prihlasuješ?';
    $('pickSub').innerHTML = d.krytie.clenstvo
      ? 'Máš aktívne členstvo — hodiny ťa nič nestoja. 💛'
      : 'K dispozícii máš '+kusy((d.krytie.prva_zdarma?1:0)+d.krytie.kredity+d.krytie.vstupy)
        +'. Za každú hodinu sa odpočíta jeden.';
    vykresliVyber();
  }catch(e){ $('scanMsg').textContent='⚠️ Chyba spojenia — skús znova.'; scanBusy=false; }
}
function kusy(n){ return n+' '+(n===1?'vstup':(n>=2&&n<=4?'vstupy':'vstupov')); }
function hodiny(n){ return n+' '+(n===1?'hodinu':(n>=2&&n<=4?'hodiny':'hodín')); }

function vykresliVyber(){
  $('pickList').innerHTML=vyberHodiny.map(c=>{
    const mam=!!c.moja, plna=c.volnych<=0 && !mam, vyp=mam||plna;
    const sel=vyberVybrane.has(c.id);
    const stav = c.moja==='attended' ? '✅ dnes si tu už bola'
      : c.moja==='booked' ? '✅ už si prihlásená'
      : plna ? 'obsadené'
      : c.teraz ? 'práve začína — zapíšeme ti účasť'
      : 'voľných miest: '+c.volnych;
    return '<div class="pk'+(sel?' sel':'')+(vyp?' off':'')+'"'+(vyp?'':' onclick="prepniHodinu(\''+c.id+'\')"')+'>'
      +'<div class="box">'+(sel?'✓':(mam?'✓':''))+'</div>'
      +'<div class="txt"><div class="nm">'+esc(c.emoji)+' '+esc(c.name)+'</div>'
      +'<div class="mt">'+esc(stav)+(c.instructor?' · '+esc(c.instructor):'')+'</div></div>'
      +'<div class="tm">'+esc(c.time_start)+'</div></div>';
  }).join('');
  const n=vyberVybrane.size;
  // 'Vybrané: …' je nominatív, tlačidlo 'Prihlásiť sa na …' akuzatív — preto dva tvary
  $('pickInfo').textContent = n ? 'Vybrané: '+n+' '+(n===1?'hodina':(n<5?'hodiny':'hodín')) : 'Zaškrtni aspoň jednu hodinu.';
  $('pickOk').disabled = !n;
  $('pickOk').textContent = n>1 ? 'Prihlásiť sa na '+hodiny(n) : 'Prihlásiť sa';
}
function prepniHodinu(id){
  if(vyberVybrane.has(id)) vyberVybrane.delete(id); else vyberVybrane.add(id);
  vykresliVyber();
}
function zavriVyber(){
  $('pick').classList.remove('on');
  vyberQr=''; vyberHodiny=[]; vyberVybrane=new Set();
  scanBusy=false; paused=false; startShow();
}
async function odosliVyber(){
  if(!vyberVybrane.size) return;
  const btn=$('pickOk'); btn.disabled=true; btn.textContent='Prihlasujem…';
  try{
    const r=await fetch('/api/kiosk/signup',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({studio:SLUG, k:KEY, qr_data:vyberQr, class_ids:[...vyberVybrane]})});
    const d=await r.json();
    if(!r.ok || !d.ok){
      $('pickInfo').textContent='⚠️ '+(d.error||'Skús to znova');
      btn.disabled=false; vykresliVyber();
      return;
    }
    $('pick').classList.remove('on');
    const zoz=(d.zapisane||[]).map(z=>z.emoji+' '+z.name+' '+z.time_start).join(' · ');
    showWelcome({ ok:true, user:d.user, class_name:zoz,
      already:false, prihlasenie:{ pocet:(d.zapisane||[]).length, uz_mala:d.uz_mala||0, krytie:d.krytie } });
  }catch(e){ $('pickInfo').textContent='⚠️ Chyba spojenia — skús znova.'; btn.disabled=false; vykresliVyber(); }
}

/* ── Výber hodiny, keď v okne bežia/nasledujú dve (technika + Zumba) ── */
function showClassChoice(d, qrTxt){
  const m=$('scanMsg');
  m.innerHTML='<div style="font-size:1.05rem;margin-bottom:10px">👋 Ahoj <b style="color:var(--gold2)">'+esc(d.first||'')+'</b> — na ktorú hodinu si prišla?</div>'+
    d.options.map(o=>'<button class="chooseBtn" data-cid="'+o.id+'" style="display:block;width:100%;margin:8px 0;padding:16px;font-size:1.15rem;font-weight:800;border-radius:14px;border:1px solid rgba(201,168,76,.5);background:linear-gradient(135deg,rgba(201,168,76,.2),rgba(201,168,76,.06));color:var(--cream)">'+esc(o.emoji)+' '+esc(o.name)+' <span style="color:var(--gold2)">'+esc(o.time_start)+'</span></button>').join('');
  m.querySelectorAll('.chooseBtn').forEach(b=>b.onclick=async()=>{
    m.textContent='⏳ Zapisujem...';
    try{
      const r=await fetch('/api/kiosk/checkin',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({studio:SLUG, k:KEY, qr_data:qrTxt, class_id:b.dataset.cid})});
      const d2=await r.json();
      if(r.ok && d2.ok && !d2.choose){ await closeScan(); showWelcome(d2); }
      else { m.textContent='⚠️ '+(d2.error||'Skús znova'); setTimeout(()=>{scanBusy=false; m.textContent='Ukáž kamere svoj QR kód z appky 📱';}, 3500); }
    }catch(e){ m.textContent='⚠️ Chyba spojenia — skús znova.'; scanBusy=false; }
  });
}

/* ── Welcome ── */
function showWelcome(d){
  const u=d.user; const w=$('welcome');
  const av=u.av ? '<img id="wAvatar" src="/api/avatar/'+u.id+'">' : '<div id="wAvatar">'+esc((u.first||'?')[0])+'</div>';
  const rows=[];
  if(u.birthday) rows.push('🎂 Všetko najlepšie k narodeninám!');
  if(d.prihlasenie){
    const p=d.prihlasenie;
    rows.push('✅ Prihlásená na '+(p.pocet===1?'1 hodinu':(p.pocet<5?p.pocet+' hodiny':p.pocet+' hodín'))
      + (p.uz_mala?' (+'+p.uz_mala+' už si mala)':''));
    if(p.krytie && !p.krytie.clenstvo){
      const zost=(p.krytie.prva_zdarma?1:0)+p.krytie.kredity+p.krytie.vstupy;
      rows.push('🎟️ Zostáva ti '+zost+' '+(zost===1?'vstup':(zost>=2&&zost<=4?'vstupy':'vstupov')));
    }
  }
  else rows.push(d.already ? '✅ Dnes si už checknutá — vidíme sa na parkete!' : '⭐ +'+u.points_gain+' bodov do mesačnej súťaže');
  if(u.streak_weeks>1) rows.push('🔥 Séria '+u.streak_weeks+' týždňov po sebe!');
  rows.push('👣 Celkovo '+u.visit_count+' hodín · '+esc(d.class_name));
  rows.push('❤️ Ďakujeme, že si prišla.');
  w.innerHTML=av+'<div id="wName">'+(u.birthday?'🎉':'👋')+' Vitaj, <span style="color:var(--gold2)">'+esc(u.first)+'</span>!</div>'+
    '<div id="wRows">'+rows.map((r,i)=>'<div class="r" style="animation-delay:'+(0.3+i*0.35)+'s">'+r+'</div>').join('')+'</div>'+'<button id="wMore" onclick="prihlasNaDalsie()">📋 Prihlásiť sa aj na ďalšie hodiny</button>';
  w.classList.add('on');
  burstFx(u.birthday?'birthday':(u.streak_weeks>3?'fire':'confetti'));
  welcomeTimer=setTimeout(()=>{ w.classList.remove('on'); paused=false; startShow(); }, 9000);
}
// Z uvítacej obrazovky sa dá pokračovať na prihlásenie na ďalšie dnešné hodiny —
// QR už máme z check-inu, takže sa neskenuje druhýkrát.
function prihlasNaDalsie(){
  clearTimeout(welcomeTimer);
  $('welcome').classList.remove('on');
  scanBusy=true;
  nacitajHodiny(poslednyQr);
}

/* ── Efekty (konfety/oheň/srdcia) ── */
const fx=$('fx'), ctx=fx.getContext('2d'); let parts=[];
function sizeFx(){ fx.width=innerWidth; fx.height=innerHeight; } sizeFx(); addEventListener('resize', sizeFx);
function burstFx(kind){
  const COLORS=kind==='fire'?['#ff6b35','#f7c548','#ff3b30']:kind==='birthday'?['#C9A84C','#E7C878','#ff6fa5','#7ec8ff']:['#C9A84C','#E7C878','#EFE6D0','#a07830'];
  const glyph=kind==='hearts'?'❤':null;
  for(let i=0;i<160;i++) parts.push({x:Math.random()*fx.width, y:-20-Math.random()*fx.height*0.5, vx:(Math.random()-0.5)*2.2, vy:2+Math.random()*3.4, r:4+Math.random()*7, c:COLORS[i%COLORS.length], a:1, g:glyph, rot:Math.random()*6.28, vr:(Math.random()-0.5)*0.2});
  animFx();
}
let fxRun=false;
function animFx(){
  if(fxRun) return; fxRun=true;
  const step=()=>{
    ctx.clearRect(0,0,fx.width,fx.height);
    parts.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; p.a-=0.004;
      ctx.save(); ctx.globalAlpha=Math.max(p.a,0); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle=p.c;
      if(p.g){ ctx.font=p.r*3+'px serif'; ctx.fillText(p.g,0,0); } else ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*0.6);
      ctx.restore(); });
    parts=parts.filter(p=>p.a>0 && p.y<fx.height+30);
    if(parts.length){ requestAnimationFrame(step); } else { fxRun=false; ctx.clearRect(0,0,fx.width,fx.height); }
  };
  requestAnimationFrame(step);
}

/* ── Noc ── */
const PREVIEW = new URLSearchParams(location.search).has('preview');
function inNight(){
  if(PREVIEW) return false; // admin náhľad — nočný režim vypnutý
  if(!CFG) return false;
  const now=new Date().toTimeString().slice(0,5);
  const off=CFG.night_off||'21:30', on=CFG.night_on||'07:30';
  return off>on ? (now>=off || now<on) : (now>=off && now<on);
}
function tickNight(){
  const n=inNight();
  $('night').classList.toggle('on', n);
  $('cta').style.display = n?'none':'block';
  const c2=$('cta2'); if(c2) c2.style.display = n?'none':'block';
  if(n){ stopShow(); $('nightClock').textContent=new Date().toTimeString().slice(0,5); }
  else if(!slideTimer && !paused && !$('scan').classList.contains('on') && !$('welcome').classList.contains('on')) startShow();
}

/* ── Hodiny + refresh ── */
setInterval(()=>{ $('clock').textContent=new Date().toTimeString().slice(0,5); tickNight(); }, 1000*15);
$('clock').textContent=new Date().toTimeString().slice(0,5);

let kioskLocked=false;
async function loadContent(first){
  try{
    const r=await fetch('/api/kiosk/content?studio='+encodeURIComponent(SLUG)+'&k='+encodeURIComponent(KEY));
    const d=await r.json();
    if(!r.ok||!d.ok){
      // Zámok musí ZASTAVIŤ slideshow, inak sa slidy prekresľujú cez hlášku.
      kioskLocked=true; stopShow(); slides=[];
      $('cta').style.display='none';
      { const c2=$('cta2'); if(c2) c2.style.display='none'; }
      $('stage').innerHTML='<div class="big" style="align-self:center;text-align:center">🔒 '+esc(d.error||'Kiosk nie je aktivovaný')+'<br><small style="font-size:.45em;opacity:.6">skúšam znova každú minútu…</small></div>';
      return;
    }
    const wasLocked=kioskLocked; kioskLocked=false; $('err').textContent='';
    DATA=d; CFG=d.config; $('cityName').textContent=d.city;
    slides=buildSlides();
    if(first||wasLocked){ slideIdx=0; $('cta').style.display=inNight()?'none':'block';
      { const c2=$('cta2'); if(c2) c2.style.display=inNight()?'none':'block'; }
      startShow(); tickNight(); }
  }catch(e){ $('err').textContent='offline — skúsim znova'; }
}
loadContent(true);
setInterval(()=>loadContent(false), 60*1000); // sync zmien z adminu

/* Wake Lock — nech tablet nezhasína */
async function wakeLock(){ try{ if('wakeLock' in navigator) await navigator.wakeLock.request('screen'); }catch(e){} }
wakeLock(); document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) wakeLock(); });
