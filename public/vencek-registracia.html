<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Venček – Fusion Academy</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/logo-mark.png">
<style>
  :root{
    --bg:#0E0C08; --bg2:#151109; --card:#1A160E; --line:#2E2718;
    --gold:#C9A84C; --gold-svetla:#EBD79A; --cream:#F2ECDC; --muted:#9B9078;
    --ok:#8BC34A;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--cream);
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    line-height:1.6; -webkit-text-size-adjust:100%;
    overflow-x:hidden;
  }
  .wrap{max-width:560px;margin:0 auto;padding:0 18px 64px}

  /* ── hlavička ── */
  .hero{position:relative;text-align:center;padding:38px 0 26px}
  .hero::before{
    content:'';position:absolute;inset:-120px -50% auto;height:340px;
    background:radial-gradient(60% 60% at 50% 40%, rgba(201,168,76,.20), transparent 70%);
    pointer-events:none;
  }
  .znak{position:relative;font-size:.7rem;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);font-weight:700}
  .hero h1{
    position:relative;margin:12px 0 6px;font-size:clamp(2.3rem,11vw,3.2rem);
    font-weight:800;letter-spacing:-.02em;line-height:1;
    background:linear-gradient(135deg,#F6E6B4,var(--gold) 55%,#9A7A2C);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .hero .skola{position:relative;font-size:1.02rem;font-weight:700;color:var(--cream)}
  .hero .rok{position:relative;color:var(--muted);font-size:.88rem;margin-top:2px}

  /* ── karty ── */
  .karta{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
  .karta h2{margin:0 0 12px;font-size:1rem;font-weight:800;color:var(--gold-svetla);display:flex;align-items:center;gap:8px}

  .kroky{display:flex;flex-direction:column;gap:12px}
  .krok{display:flex;gap:12px;align-items:flex-start}
  .krok .n{
    flex:0 0 30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;
    background:rgba(201,168,76,.14);border:1px solid rgba(201,168,76,.35);
    color:var(--gold);font-weight:800;font-size:.88rem;
  }
  .krok .t{flex:1;font-size:.92rem}
  .krok .t b{color:#fff}
  .krok .t span{color:var(--muted);display:block;font-size:.85rem;margin-top:1px}

  .tance{display:flex;flex-wrap:wrap;gap:7px}
  .tanec{background:rgba(201,168,76,.1);border:1px solid rgba(201,168,76,.28);border-radius:999px;
    padding:5px 12px;font-size:.83rem;color:var(--gold-svetla);font-weight:600}

  .darcek{background:linear-gradient(135deg,rgba(139,195,74,.14),rgba(139,195,74,.05));
    border-color:rgba(139,195,74,.4)}
  .darcek h2{color:#B7DE8A}
  .darcek ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:.92rem}
  .darcek b{color:#fff}

  .cena{display:flex;align-items:baseline;justify-content:center;gap:8px;padding:4px 0 2px}
  .cena b{font-size:2rem;font-weight:800;color:var(--gold)}
  .cena span{color:var(--muted);font-size:.88rem}

  /* ── formulár ── */
  form{display:flex;flex-direction:column;gap:12px}
  label{display:block;font-size:.82rem;color:var(--muted);margin-bottom:5px;font-weight:600}
  input,select{
    width:100%;background:#12100A;border:1px solid var(--line);color:var(--cream);
    border-radius:11px;padding:13px 14px;font-size:1rem;outline:none;
    font-family:inherit;transition:border-color .15s;
  }
  input:focus,select:focus{border-color:var(--gold)}
  input::placeholder{color:#6A6250}
  select{color-scheme:dark;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--gold) 50%),linear-gradient(135deg,var(--gold) 50%,transparent 50%);
    background-position:calc(100% - 20px) center,calc(100% - 15px) center;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:40px}
  .suhlas{display:flex;gap:10px;align-items:flex-start;font-size:.82rem;color:var(--muted);line-height:1.5}
  .suhlas input{width:19px;height:19px;flex:none;margin-top:2px;accent-color:var(--gold)}
  .suhlas a{color:var(--gold)}
  button.hlavne{
    background:linear-gradient(135deg,var(--gold),#A5842F);color:#14110A;border:none;border-radius:12px;
    padding:16px;font-size:1.03rem;font-weight:800;cursor:pointer;font-family:inherit;
    transition:transform .12s, filter .15s;
  }
  button.hlavne:hover{filter:brightness(1.06)}
  button.hlavne:active{transform:scale(.99)}
  button.hlavne:disabled{opacity:.55;cursor:default;transform:none}
  .chyba{background:rgba(224,86,86,.14);border:1px solid rgba(224,86,86,.45);color:#FF9B9B;
    border-radius:11px;padding:11px 13px;font-size:.88rem;display:none}
  .pod{text-align:center;font-size:.82rem;color:var(--muted);margin-top:2px}
  .pod a{color:var(--gold);text-decoration:none;font-weight:700}

  .stav{text-align:center;padding:70px 20px;color:var(--muted)}
  .hotovo{text-align:center;padding:46px 16px}
  .hotovo .ikona{font-size:3.4rem;line-height:1}
  .hotovo h2{margin:14px 0 8px;font-size:1.5rem;color:var(--gold-svetla)}
  .hotovo p{color:var(--muted);margin:0 auto 22px;max-width:340px}

  footer{text-align:center;color:#5F5847;font-size:.76rem;padding-top:22px}
  @media (prefers-reduced-motion:no-preference){
    .karta{animation:zdola .5s ease both}
    .karta:nth-of-type(2){animation-delay:.06s}
    .karta:nth-of-type(3){animation-delay:.12s}
    .karta:nth-of-type(4){animation-delay:.18s}
    @keyframes zdola{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  }
</style>
</head>
<body>
<div class="wrap" id="host"><div class="stav">Načítavam…</div></div>
<script>
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KOD=(new URLSearchParams(location.search).get('kod')
  || location.pathname.split('/').filter(Boolean).pop() || '').toUpperCase();
const ROLE_LBL={student:'🧑‍🎓 Som žiak / žiačka', parent:'👨‍👩‍👧 Som rodič', teacher:'👩‍🏫 Som učiteľ / učiteľka', director:'🏫 Som riaditeľ / riaditeľka'};

(async()=>{
  const host=document.getElementById('host');
  if(!/^VEN-[A-Z0-9]{3,}$/.test(KOD)){
    host.innerHTML='<div class="stav">🎓 Chýba kód skupiny.<br><br>Naskenuj QR kód od školy, alebo si over kód na papieri.</div>'; return;
  }
  let d;
  try{ d=await (await fetch('/api/vencek/info?code='+encodeURIComponent(KOD))).json(); }catch(e){}
  if(!d || !d.ok){
    host.innerHTML='<div class="stav">🎓 Kód <b>'+esc(KOD)+'</b> nepoznáme.<br><br>Skontroluj ho prosím na papieri od školy — alebo naskenuj QR znova.</div>'; return;
  }

  const doVencka=d.lessons_before||10, bonus=Math.max(0,(d.lessons_total||13)-doVencka);
  const tance=(d.dances||[]).filter(Boolean);
  const role=(d.roles||['student']).filter(r=>ROLE_LBL[r]);

  host.innerHTML=`
    <div class="hero">
      <div class="znak">Fusion Academy</div>
      <h1>Venček</h1>
      <div class="skola">${esc(d.school||'')}</div>
      <div class="rok">${esc(d.year||'')}${d.city?' · '+esc(d.city):''}</div>
    </div>

    <div class="karta">
      <h2>💃 Čo ťa čaká</h2>
      <div class="kroky">
        <div class="krok"><div class="n">${doVencka}</div><div class="t"><b>lekcií do venčeka</b>
          <span>Naučíme ťa tancovať od nuly. Netreba partnera ani skúsenosti.</span></div></div>
        <div class="krok"><div class="n">✨</div><div class="t"><b>Venčekový večer</b>
          <span>${d.event_date ? esc(d.event_date.split('-').reverse().join('. ')) : 'Termín upresníme'} — deň, keď to celé ukážete rodičom.</span></div></div>
        ${bonus?`<div class="krok"><div class="n">+${bonus}</div><div class="t"><b>bonusové lekcie po venčeku</b>
          <span>Náš darček, aby ste mohli pokračovať, keď vás to chytí.</span></div></div>`:''}
      </div>
      ${tance.length?`<div style="margin-top:14px"><div style="font-size:.82rem;color:var(--muted);margin-bottom:8px">Tance, ktoré zvládneš:</div>
        <div class="tance">${tance.map(t=>`<span class="tanec">${esc(t)}</span>`).join('')}</div></div>`:''}
      ${d.lecturer?`<div style="margin-top:14px;font-size:.86rem;color:var(--muted)">🎓 Učí <b style="color:var(--cream)">${esc(d.lecturer)}</b></div>`:''}
    </div>

    <div class="karta darcek">
      <h2>🎁 Čo dostaneš navyše</h2>
      <ul>
        <li><b>1× Zumba zadarmo</b> — príď si k nám zatancovať aj mimo venčeka</li>
        <li><b>Prvý mesiac Zumby zadarmo</b> — kupón dostaneš hneď po registrácii (platí aj pre rodičov)</li>
        <li><b>Appka</b>, kde vidíš progres v tancoch, dochádzku aj platbu</li>
      </ul>
    </div>

    <div class="karta">
      <h2>💳 Cena kurzu</h2>
      <div class="cena"><b>${(+d.price).toFixed(2).replace('.',',')} €</b><span>za celý kurz</span></div>
      <div style="text-align:center;color:var(--muted);font-size:.85rem;margin-top:6px">
        Platí sa až potom — kartou priamo v appke, alebo v hotovosti u lektora.
        <br>Registrácia ťa teraz k ničomu nezaväzuje.
      </div>
    </div>

    <div class="karta">
      <h2>✍️ Zaregistruj sa</h2>
      <div class="chyba" id="chyba"></div>
      <form id="f" autocomplete="on">
        ${role.length>1?`<div>
          <label for="rola">Kto sa registruje?</label>
          <select id="rola">${role.map(r=>`<option value="${r}">${ROLE_LBL[r]}</option>`).join('')}</select>
        </div>`:`<input type="hidden" id="rola" value="${role[0]||'student'}">`}
        <div id="dietaBox" style="display:none">
          <label for="dieta">Meno vášho dieťaťa</label>
          <input id="dieta" placeholder="napr. Ema Nováková" autocomplete="off">
        </div>
        <div><label for="meno">Meno a priezvisko</label>
          <input id="meno" required placeholder="Ema Nováková" autocomplete="name"></div>
        <div><label for="email">E-mail</label>
          <input id="email" type="email" required placeholder="ema@email.sk" autocomplete="email" inputmode="email"></div>
        <div><label for="tel">Telefón <span style="font-weight:400">(nepovinné)</span></label>
          <input id="tel" type="tel" placeholder="0900 123 456" autocomplete="tel" inputmode="tel"></div>
        <div><label for="heslo">Heslo <span style="font-weight:400">(aspoň 6 znakov)</span></label>
          <input id="heslo" type="password" required minlength="6" placeholder="••••••" autocomplete="new-password"></div>
        <label class="suhlas"><input type="checkbox" id="suhlas" required>
          <span>Súhlasím so spracovaním údajov pre potreby venčekového kurzu a účtu v appke.</span></label>
        <button class="hlavne" type="submit" id="odoslat">Vytvoriť účet a pridať sa 💃</button>
        <div class="pod">Už máš účet? <a href="/?login=1">Prihlás sa</a></div>
      </form>
    </div>

    <footer>Fusion Academy · Venčeky ${esc(d.year||'')}<br>Kód skupiny: <b>${esc(KOD)}</b></footer>`;

  const rola=document.getElementById('rola'), dietaBox=document.getElementById('dietaBox');
  if(rola && rola.tagName==='SELECT') rola.onchange=()=>{ dietaBox.style.display = rola.value==='parent' ? 'block' : 'none'; };

  document.getElementById('f').onsubmit=async e=>{
    e.preventDefault();
    const btn=document.getElementById('odoslat'), chyba=document.getElementById('chyba');
    chyba.style.display='none';
    btn.disabled=true; btn.textContent='Zakladám účet…';
    try{
      const r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',
        body:JSON.stringify({
          name:document.getElementById('meno').value.trim(),
          email:document.getElementById('email').value.trim(),
          phone:document.getElementById('tel').value.trim(),
          password:document.getElementById('heslo').value,
          city:d.city||'',
          consent:true,
          user_type:'client',
          lead_source:'vencek',
          vencek_code:KOD,
          vencek_role:rola?rola.value:'student',
          vencek_child_name:(document.getElementById('dieta')||{}).value||undefined,
          attribution: window.faGetAttribution?window.faGetAttribution():{}
        })});
      const dd=await r.json().catch(()=>({}));
      if(r.ok && dd.ok){
        if(window.faTrack) try{ window.faTrack('CompleteRegistration'); }catch(e){}
        document.getElementById('host').innerHTML=`<div class="hotovo">
          <div class="ikona">🎉</div>
          <h2>Vitaj vo venčekoch!</h2>
          <p>Si v skupine <b style="color:var(--cream)">${esc(d.school||'')}</b>. V appke nájdeš progres v tancoch, dochádzku aj platbu — a čaká ťa tam darček.</p>
          <button class="hlavne" style="max-width:280px;width:100%" onclick="location.href='/vencek'">Otvoriť môj venček →</button>
        </div>`;
        window.scrollTo(0,0);
        return;
      }
      chyba.textContent = dd.error || 'Registráciu sa nepodarilo dokončiť. Skús to prosím znova.';
      chyba.style.display='block';
      chyba.scrollIntoView({behavior:'smooth',block:'center'});
    }catch(err){
      chyba.textContent='Nepodarilo sa spojiť so serverom. Skontroluj internet a skús znova.';
      chyba.style.display='block';
    }
    btn.disabled=false; btn.textContent='Vytvoriť účet a pridať sa 💃';
  };
})();
</script>
<script src="/fa-track.js"></script>
</body>
</html>
