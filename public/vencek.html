<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Venčeky – Fusion Academy</title>
<link rel="stylesheet" href="/fa-theme.css">
<link rel="icon" type="image/png" href="/logo-mark.png">
<style>
:root{--gold:#C9A84C;--cream:#e8e2d4;--muted:#b9b3a6}
body{background:#12100a;color:var(--cream);font-family:'Inter',system-ui,sans-serif;margin:0;min-height:100vh}
.wrap{max-width:760px;margin:0 auto;padding:16px 14px 90px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 0}
.brand{font-weight:900;color:var(--gold);letter-spacing:.06em}
.switch{background:#1d1a15;border:1px solid rgba(201,168,76,.45);color:var(--gold);border-radius:999px;padding:8px 16px;font-weight:800;font-size:.82rem;text-decoration:none}
.hero{background:linear-gradient(160deg,#241d10,#171310);border:1px solid rgba(201,168,76,.4);border-radius:18px;padding:22px;text-align:center;margin-bottom:14px}
.hero .badge{display:inline-block;background:rgba(201,168,76,.15);border:1px solid rgba(201,168,76,.45);border-radius:999px;padding:4px 14px;font-size:.72rem;font-weight:800;letter-spacing:.12em;color:var(--gold)}
.hero h1{margin:10px 0 2px;font-size:1.5rem}
.hero .sub{color:var(--muted);font-size:.9rem}
.bigbar{height:16px;background:#26221a;border-radius:10px;overflow:hidden;border:1px solid #3a3428;margin:16px 0 6px}
.bigbar i{display:block;height:100%;background:linear-gradient(90deg,#8bc34a,#C9A84C);border-radius:10px;transition:width 1s}
.card{background:#1a1712;border:1px solid #2e2a20;border-radius:14px;padding:16px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:1rem;color:#fff}
.dance{margin-bottom:10px}
.dance .row{display:flex;justify-content:space-between;font-size:.88rem;margin-bottom:4px}
.dance .lvl{color:var(--muted);font-size:.78rem}
.dance .bar{height:9px;background:#26221a;border-radius:6px;overflow:hidden}
.dance .bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#C9A84C,#e8d18a)}
.dance.done .bar i{background:linear-gradient(90deg,#7cb342,#aed581)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:#1d1a15;border:1px solid #2e2a20;border-radius:12px;padding:12px;text-align:center}
.stat b{display:block;font-size:1.3rem;color:#fff}
.stat span{font-size:.75rem;color:var(--muted)}
.pay-ok{background:rgba(124,179,66,.12);border:1px solid rgba(124,179,66,.45);border-radius:12px;padding:12px 14px;font-size:.88rem}
.pay-no{background:rgba(255,152,0,.1);border:1px solid rgba(255,152,0,.4);border-radius:12px;padding:12px 14px;font-size:.88rem;color:#ffcc80}
.cls{border:1px solid #2e2a20;border-radius:12px;padding:12px;margin-bottom:10px;background:#1d1a15}
.cls .head{display:flex;justify-content:space-between;align-items:center;font-weight:800}
.muted{color:var(--muted);font-size:.82rem}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
/* chat skupiny — žiaci, učitelia aj lektor na jednom mieste */
.chat-zoznam{display:flex;flex-direction:column;gap:9px;max-height:340px;overflow-y:auto;padding-right:4px;margin-bottom:10px}
.sprava{background:#1d1a15;border:1px solid #2e2a20;border-radius:12px;padding:9px 12px}
.sprava.ja{background:rgba(201,168,76,.12);border-color:rgba(201,168,76,.35)}
.sprava .hlava{display:flex;align-items:center;gap:7px;font-size:.76rem;margin-bottom:3px;flex-wrap:wrap}
.sprava .kto{font-weight:800;color:var(--cream);text-decoration:none}
a.kto:hover{color:var(--gold);text-decoration:underline}
.ch-av{width:24px;height:24px;border-radius:50%;object-fit:cover;flex:none;display:inline-flex;
  align-items:center;justify-content:center;border:1px solid #3a3428;background:#26221a}
.ch-ini{font-size:.66rem;font-weight:800;color:var(--gold)}
.sprava .rola{font-size:.65rem;padding:1px 7px;border-radius:999px;background:rgba(201,168,76,.16);color:var(--gold);font-weight:700}
.sprava .rola.uc{background:rgba(126,200,227,.16);color:#7ec8e3}
.sprava .kedy{color:#6d6656;margin-left:auto;font-size:.7rem}
.sprava .telo{font-size:.9rem;white-space:pre-wrap;word-break:break-word}
.sprava .zmaz{background:none;border:none;color:#6d6656;cursor:pointer;font-size:.72rem;padding:0}
.sprava .zmaz:hover{color:#f87171}
.chat-pisanie{display:flex;gap:8px;align-items:flex-end}
.chat-pisanie textarea{flex:1;background:#12100a;border:1px solid #2e2a20;color:var(--cream);border-radius:11px;
  padding:10px 12px;font-size:.92rem;font-family:inherit;resize:none;outline:none;min-height:44px;max-height:120px}
.chat-pisanie textarea:focus{border-color:var(--gold)}
.chat-pisanie button{background:linear-gradient(135deg,var(--gold),#a5842f);color:#161310;border:none;
  border-radius:11px;padding:11px 16px;font-weight:800;cursor:pointer;font-family:inherit;white-space:nowrap}
.chat-pisanie button:disabled{opacity:.5;cursor:default}
/* rozvrh lekcií */
.rozvrh{display:flex;flex-direction:column;gap:5px;max-height:320px;overflow-y:auto;padding-right:4px}
.rterm{display:flex;align-items:center;gap:10px;padding:7px 10px;background:#1d1a15;border:1px solid #2e2a20;border-radius:10px;font-size:.87rem}
.rterm .rc{width:22px;height:22px;border-radius:7px;display:flex;align-items:center;justify-content:center;
  background:rgba(201,168,76,.16);color:var(--gold);font-weight:800;font-size:.72rem;flex:none}
.rterm .rd{flex:1}
.rterm .rp{font-size:.68rem;padding:2px 8px;border-radius:999px;background:rgba(201,168,76,.14);color:var(--gold)}
.rterm .rp.bon{background:rgba(124,179,66,.16);color:#aed581}
.rterm .rp.zmena{background:rgba(255,152,0,.16);color:#ffcc80}
.rterm.bolo{opacity:.5}
.rterm.bolo .rc{background:rgba(124,179,66,.16);color:#aed581}
.rterm.zrus{opacity:.45}
.rterm.zrus .rd{text-decoration:line-through}
.rterm.zrus .rc{background:rgba(224,86,86,.16);color:#ff8a8a}
.rterm.zrus .rp{background:rgba(224,86,86,.16);color:#ff8a8a}
/* rozklikávací detail lekcie */
.rterm{flex-direction:column;align-items:stretch;gap:0}
.rterm .rhl{display:flex;align-items:center;gap:10px}
.rterm.klik{cursor:pointer}
.rterm.klik:hover{border-color:rgba(201,168,76,.45)}
.rterm .rsip{color:var(--muted);font-size:.8rem;margin-left:4px}
.rdet{margin-top:8px;padding-top:8px;border-top:1px solid #2e2a20;display:flex;flex-direction:column;gap:5px;font-size:.84rem;color:var(--muted)}
.rdet-r b{color:var(--cream)}
.rdet-r.ja-chybal{color:#ffcc80}
/* učiteľský zoznam žiakov */
.uz{display:flex;flex-direction:column;gap:5px}
.uz .r{display:flex;align-items:center;gap:10px;padding:8px 10px;background:#1d1a15;border:1px solid #2e2a20;border-radius:10px;font-size:.88rem}
.uz .r .n{flex:1}
.uz .r .p{font-size:.7rem;padding:2px 8px;border-radius:999px;font-weight:700}
.uz .r .p.ok{background:rgba(124,179,66,.16);color:#aed581}
.uz .r .p.ne{background:rgba(255,152,0,.16);color:#ffcc80}
.uz .r .a{font-size:.72rem;color:var(--muted)}
.tance-cakaju{display:flex;flex-wrap:wrap;gap:7px}
.tance-cakaju .caka{background:#1d1a15;border:1px solid #2e2a20;border-radius:999px;
  padding:5px 12px;font-size:.83rem;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">🎓 FUSION VENČEKY</div>
    <a class="switch" href="/client-dashboard">↔ Bežná appka</a>
  </div>
  <div id="host"><div class="empty">Načítavam…</div></div>
</div>
<script>
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtD=d=>d?d.split('-').reverse().join('.'):null;
const DNI=['nedeľa','pondelok','utorok','streda','štvrtok','piatok','sobota'];
function termin(iso){
  try{
    const d=new Date(iso);
    return DNI[d.getDay()]+' '+d.getDate()+'. '+(d.getMonth()+1)+'. · '
      +String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  }catch(e){ return String(iso||''); }
}
// Celý rozvrh — čo už bolo, je stlmené, zrušené prečiarknuté.
// Každá lekcia sa dá rozkliknúť — kto chýbal a čo sa učilo (Marek 2. 9.).
// Detail sa ukáže len tam, kde už niečo je: zapísaná dochádzka alebo tanec.
function rozvrhKarta(c, lessons){
  const t=(c.terminy||[]).filter(x=>x.at);
  if(!t.length) return '';
  const teraz=new Date();
  const podla=Object.fromEntries((lessons||[]).map(l=>[l.lesson,l]));
  return `<div class="card"><h3>🗓️ Rozvrh lekcií <small style="color:var(--muted);font-weight:400">· klikni na lekciu</small></h3>
    <div class="rozvrh">${t.map(x=>{
      const bolo=new Date(x.at)<teraz;
      const l=x.lesson ? podla[x.lesson] : null;
      const maDetail=!!(l && (l.recorded || (l.dances||[]).length || l.note));
      const detail=!maDetail ? '' : `<div class="rdet" hidden>
          ${(l.dances||[]).length?`<div class="rdet-r">💃 <b>Učilo sa:</b> ${l.dances.map(esc).join(', ')}</div>`:''}
          ${l.note?`<div class="rdet-r">📝 ${esc(l.note)}</div>`:''}
          ${l.recorded ? (l.absent.length
              ? `<div class="rdet-r">🚫 <b>Chýbali:</b> ${l.absent.map(esc).join(', ')}</div>`
              : `<div class="rdet-r">✅ Prišli všetci</div>`) : ''}
          ${l.me_absent===true?`<div class="rdet-r ja-chybal">Ty si chýbal/a — dobehni si to na ďalšej lekcii.</div>`:''}
        </div>`;
      return `<div class="rterm${x.cancelled?' zrus':(bolo?' bolo':'')}${maDetail?' klik':''}"${maDetail?' onclick="this.querySelector(\'.rdet\').hidden=!this.querySelector(\'.rdet\').hidden"':''}>
        <div class="rhl">
          <span class="rc">${x.cancelled?'✕':(bolo?'✓':(x.lesson||''))}</span>
          <span class="rd">${esc(termin(x.at))}</span>
          ${x.cancelled?'<span class="rp">zrušená</span>':(x.moved?'<span class="rp zmena">presunutá</span>':(x.bonus?'<span class="rp bon">bonus</span>':''))}
          ${maDetail?'<span class="rsip">▾</span>':''}
        </div>${detail}
      </div>`;
    }).join('')}</div></div>`;
}
function danceHtml(d){
  return `<div class="dance ${d.level>=4?'done':''}">
    <div class="row"><span>${d.level>=4?'✅':'💃'} <b>${esc(d.name)}</b></span><span class="lvl">${d.level>=4?'ZVLÁDNUTÉ':esc(d.level_label)} · ${d.pct} %</span></div>
    <div class="bar"><i style="width:${d.pct}%"></i></div>
  </div>`;
}
function classCard(c, extra=''){
  // Venčekový večer je po 10. lekcii, zvyšné 3 sú bonus po ňom — tie sa nepočítajú
  // do odpočtu, inak by to vyzeralo, že venček je ďalej, než naozaj je.
  const doVencka=+c.lessons_before||10;
  const zostava=Math.max(0, doVencka-(c.lessons_done||0));
  const poVencku=Math.max(0, (c.lessons_done||0)-doVencka);
  const bonusSpolu=Math.max(0, (c.lessons_total||13)-doVencka);
  const vBonuse=zostava===0 && bonusSpolu>0;
  return `<div class="hero">
    <span class="badge">${esc(c.year)} · ${esc(c.name).toUpperCase()}</span>
    <h1>Naša cesta k venčeku</h1>
    <div class="sub">${vBonuse
      ? `Venček máte za sebou · bonusová lekcia ${Math.min(poVencku||1,bonusSpolu)} z ${bonusSpolu}`
      : `Lekcia ${c.lessons_done} z ${doVencka}`}${c.event_date?` · ✨ Venčekový večer: <b style="color:var(--gold)">${esc(fmtD(c.event_date))}</b>${c.event_venue?` · 📍 ${esc(c.event_venue)}`:''}`:''}</div>
    <div class="bigbar"><i style="width:${c.progress}%"></i></div>
    <div style="font-weight:900;color:var(--gold)">${c.progress} %</div>
    ${(() => {
      // Najbližšia lekcia patrí navrch — je to prvá vec, na ktorú sa pozrú.
      const b=(c.terminy||[]).filter(t=>!t.cancelled && t.at && new Date(t.at)>=new Date())[0];
      if(!b) return c.schedule?`<div class="sub" style="margin-top:8px">📍 ${esc(c.schedule)}</div>`:'';
      return `<div class="sub" style="margin-top:10px">⏭️ Najbližšia lekcia: <b style="color:var(--gold)">${esc(termin(b.at))}</b>${c.schedule?`<br>📍 ${esc(c.schedule)}`:''}</div>`;
    })()}
  </div>
  ${extra}
  ${(() => {
    // Marek označuje po hodine, čo už vieme — nech to žiaci vidia oddelene od
    // toho, čo ich ešte čaká. Jeden dlhý zoznam 14 tancov by to zahmlil.
    const vieme=c.dances.filter(x=>x.level>=4), ucime=c.dances.filter(x=>x.level>0&&x.level<4), cakaju=c.dances.filter(x=>!x.level);
    return `${vieme.length?`<div class="card" style="border-color:rgba(124,179,66,.4)">
        <h3>✅ Toto už vieme <span style="color:var(--muted);font-weight:400">· ${vieme.length} z ${c.dances.length}</span></h3>
        ${vieme.map(danceHtml).join('')}</div>`:''}
      ${ucime.length?`<div class="card"><h3>💃 Práve sa učíme</h3>${ucime.map(danceHtml).join('')}</div>`:''}
      ${cakaju.length?`<div class="card"><h3>⏳ Ešte nás čaká <span style="color:var(--muted);font-weight:400">· ${cakaju.length}</span></h3>
        <div class="tance-cakaju">${cakaju.map(x=>`<span class="caka">${esc(x.name)}</span>`).join('')}</div></div>`:''}
      ${rozvrhKarta(c, window._LEKCIE)}
      ${c.note?`<div class="card"><div class="muted">📝 ${esc(c.note)}</div></div>`:''}`;
  })()}
  <div class="grid">
    <div class="stat"><b>${c.members}</b><span>žiakov v skupine</span></div>
    ${vBonuse
      ? `<div class="stat"><b>${Math.max(0,bonusSpolu-poVencku)}</b><span>bonusových lekcií ešte máte</span></div>`
      : `<div class="stat"><b>${zostava}</b><span>${zostava===1?'lekcia':(zostava>=2&&zostava<=4?'lekcie':'lekcií')} do venčeka</span></div>`}
  </div>
  ${bonusSpolu>0?`<div class="card" style="border-color:rgba(201,168,76,.4)">
    <h3>🎁 ${vBonuse?'Bonusové lekcie bežia':`Po venčeku máte ${bonusSpolu} bonusové lekcie`}</h3>
    <div class="muted">${vBonuse
      ? 'Venček skončil, ale tancovať nemusíte prestať — tieto lekcie sú navyše a zadarmo. Ak vás to chytilo, ozvite sa nám a ukážeme vám, kam sa dá ísť ďalej. 💛'
      : 'Kurz má ' + (c.lessons_total||13) + ' lekcií: ' + doVencka + ' do venčekového večera a ' + bonusSpolu + ' navyše po ňom. Tie posledné sú náš darček — aby ste v tanci mohli pokračovať. 💛'}</div>
  </div>`:''}`;
}
function attCard(d){
  if(d.my_attendance) return `<div class="card"><h3>🙋 Moja dochádzka</h3>
    <div class="row" style="display:flex;justify-content:space-between;font-size:.9rem"><span>Bol/a som na <b>${d.my_attendance.attended}</b> z ${d.my_attendance.recorded} zapísaných lekcií</span><span style="color:var(--gold);font-weight:900">${Math.round(d.my_attendance.attended/d.my_attendance.recorded*100)} %</span></div></div>`;
  if(d.class?.attendance) return `<div class="card"><h3>🙋 Dochádzka triedy</h3>
    <div class="muted">Priemerná účasť <b style="color:var(--gold)">${d.class.attendance.avg_pct} %</b> · zapísaných ${d.class.attendance.lessons_recorded} lekcií</div></div>`;
  return '';
}
// ── Chat skupiny ───────────────────────────────────────────────────────────
// Spoločný pre žiakov, učiteľov aj lektora. Skupina sa berie z účtu na serveri,
// tu sa posiela class_id len pri admin náhľade.
let _chatId=null, _chatJa=null;
const ROLA_LBL={student:'žiak', parent:'rodič', teacher:'učiteľ', director:'riaditeľ', lektor:'lektor'};
function chatCas(iso){
  try{
    const d=new Date(iso), dnes=new Date();
    const cas=d.toLocaleTimeString('sk',{hour:'2-digit',minute:'2-digit'});
    return d.toDateString()===dnes.toDateString() ? cas : d.toLocaleDateString('sk',{day:'numeric',month:'numeric'})+' '+cas;
  }catch(e){ return ''; }
}
function chatKarta(){
  return `<div class="card" id="chatKarta">
    <h3>💬 Chat skupiny <small style="color:var(--muted);font-weight:400">· píšu sem žiaci aj učitelia</small></h3>
    <div class="chat-zoznam" id="chatZoznam"><div class="muted">Načítavam…</div></div>
    <div class="chat-pisanie">
      <textarea id="chatText" rows="1" maxlength="600" placeholder="Napíš správu skupine…"
        oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,120)+'px'"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();chatPosli();}"></textarea>
      <button id="chatBtn" onclick="chatPosli()">Poslať</button>
    </div>
  </div>`;
}
async function chatNacitaj(){
  const el=document.getElementById('chatZoznam'); if(!el) return;
  try{
    const d=await (await fetch('/api/vencek/chat'+(_chatId?('?class_id='+encodeURIComponent(_chatId)):''),{credentials:'include'})).json();
    if(!d.ok){ el.innerHTML='<div class="muted">Chat sa nepodarilo načítať.</div>'; return; }
    _chatJa=d.me;
    el.innerHTML = d.messages.length ? d.messages.map(m=>{
      const ja=m.user_id===d.me, uc=['teacher','director','lektor'].includes(m.role);
      const ini=(m.name||'?').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
      // Meno aj fotka vedú na profil — tam sa dá komentovať a lajkovať.
      const av=m.avatar
        ? `<img class="ch-av" src="${esc(m.avatar)}" alt="">`
        : `<span class="ch-av ch-ini">${esc(ini)}</span>`;
      const kto=m.user_id
        ? `<a class="kto" href="/u/${esc(m.user_id)}">${esc(m.name||'—')}</a>`
        : `<span class="kto">${esc(m.name||'—')}</span>`;
      return `<div class="sprava${ja?' ja':''}">
        <div class="hlava">${m.user_id?`<a href="/u/${esc(m.user_id)}">${av}</a>`:av}${kto}
          <span class="rola${uc?' uc':''}">${esc(ROLA_LBL[m.role]||m.role||'')}</span>
          <span class="kedy">${chatCas(m.at)}</span></div>
        <div class="telo">${esc(m.text)}</div>
        ${ja?`<button class="zmaz" onclick="chatZmaz('${m.id}')">zmazať</button>`:''}
      </div>`;
    }).join('') : '<div class="muted">Zatiaľ nikto nepísal. Buď prvý/prvá 💬</div>';
    el.scrollTop=el.scrollHeight;
  }catch(e){ el.innerHTML='<div class="muted">Chat sa nepodarilo načítať.</div>'; }
}
async function chatPosli(){
  const t=document.getElementById('chatText'), b=document.getElementById('chatBtn');
  const text=(t.value||'').trim(); if(!text) return;
  b.disabled=true;
  try{
    const r=await (await fetch('/api/vencek/chat',{method:'POST',headers:{'Content-Type':'application/json'},
      credentials:'include',body:JSON.stringify({text, class_id:_chatId||undefined})})).json();
    if(r&&r.ok){ t.value=''; t.style.height='auto'; await chatNacitaj(); }
    else alert((r&&r.error)||'Správu sa nepodarilo odoslať.');
  }catch(e){ alert('Správu sa nepodarilo odoslať.'); }
  b.disabled=false;
}
async function chatZmaz(id){
  if(!confirm('Zmazať túto správu?')) return;
  try{ await fetch('/api/vencek/chat/'+encodeURIComponent(id),{method:'DELETE',credentials:'include'}); }catch(e){}
  chatNacitaj();
}
async function platitKartou(btn){
  const pov=btn.textContent;
  btn.disabled=true; btn.textContent='Otváram platbu…';
  try{
    const r=await (await fetch('/api/vencek/checkout',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:'{}'})).json();
    if(r&&r.url){ location.href=r.url; return; }
    alert(r&&r.error ? r.error : 'Platbu sa nepodarilo otvoriť. Skús to znova alebo zaplať u lektora.');
  }catch(e){ alert('Platbu sa nepodarilo otvoriť. Skús to znova alebo zaplať u lektora.'); }
  btn.disabled=false; btn.textContent=pov;
}
// Návrat zo Stripe — platbu potvrdí až server dotazom na Stripe, nie táto adresa.
// Musí dobehnúť PRED načítaním prehľadu, inak by stránka ešte ukázala „neuhradené".
async function overPlatbu(){
  const p=new URLSearchParams(location.search);
  if(p.get('stripe')!=='ok' || !p.get('session_id')) return null;
  let hotovo=false;
  try{
    const r=await (await fetch('/api/vencek/verify',{method:'POST',headers:{'Content-Type':'application/json'},
      credentials:'include',body:JSON.stringify({session_id:p.get('session_id')})})).json();
    hotovo = !!(r && r.ok);
  }catch(e){}
  history.replaceState({},'', '/vencek');
  return hotovo;
}
(async()=>{
  const host=document.getElementById('host');
  const zaplatene=await overPlatbu();
  if(zaplatene){
    const b=document.createElement('div');
    b.style.cssText='background:rgba(124,179,66,.16);border:1px solid rgba(124,179,66,.5);border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:.9rem';
    b.innerHTML='✅ <b>Ďakujeme, kurz je uhradený.</b> Potvrdenie ti prišlo na email aj do notifikácií.';
    host.parentNode.insertBefore(b, host);
  }
  // ?ako=student&class_id=… — admin si pozrie skupinu očami žiaka, aby vedel
  // na nábore ukázať, čo deti v appke uvidia.
  const qp=new URLSearchParams(location.search);
  const nahladUrl = (qp.get('ako')==='student' && qp.get('class_id'))
    ? '/api/vencek/mine?ako=student&class_id='+encodeURIComponent(qp.get('class_id')) : '/api/vencek/mine';
  let d; try{ d=await (await fetch(nahladUrl,{credentials:'include'})).json(); }
  catch(e){ host.innerHTML='<div class="empty">Nepodarilo sa načítať. Skús to znova.</div>'; return; }
  // Detail lekcií (kto chýbal, čo sa učilo) číta rozvrh cez globál — classCard
  // dostáva len skupinu, nie celú odpoveď.
  window._LEKCIE = d.lessons || [];
  if(d.preview){
    // V admin náhľade chat nepozná skupinu z účtu — musí ju dostať z adresy.
    _chatId=qp.get('class_id');
    const p=document.createElement('div');
    p.style.cssText='background:rgba(201,168,76,.14);border:1px solid rgba(201,168,76,.45);border-radius:12px;padding:11px 14px;margin-bottom:14px;font-size:.88rem;display:flex;align-items:center;gap:10px;flex-wrap:wrap';
    // Odkaz musí niesť ?prehlad=1, inak by presmerovanie pri jedinej skupine
    // hodilo naspäť sem a vzniklo by koleso.
    p.innerHTML='<span>👁️</span><span style="flex:1">Toto vidí <b>žiak</b> tejto skupiny. Platba ani dochádzka tu nie sú tvoje.</span>'
      +'<a href="/vencek?prehlad=1" style="color:var(--gold);text-decoration:none;font-weight:700;white-space:nowrap">📊 čísla skupiny</a>';
    host.parentNode.insertBefore(p, host);
  }
  if(!d.ok || !d.role){
    host.innerHTML=`<div class="empty">🎓 Tvoj účet zatiaľ nie je priradený k venčekovej skupine.<br><br>
      Ak máš QR kód od školy, naskenuj ho znova — alebo napíš svojmu lektorovi.<br><br>
      <a class="switch" href="/client-dashboard">Prejsť do appky</a></div>`; return;
  }
  if(d.role==='director' || d.role==='admin'){
    // Pri jedinej skupine je zoznam zbytočný medzikrok — otvor ju rovno tak,
    // ako ju vidia žiaci. Zoznam sa oplatí až keď je z čoho vyberať.
    const vsetky=(d.schools||[]).flatMap(s=>(s.classes||[]).map(c=>({id:c.id||c._id})));
    if(vsetky.length===1 && !qp.get('prehlad')){
      location.replace('/vencek?ako=student&class_id='+encodeURIComponent(vsetky[0].id));
      return;
    }
    host.innerHTML=(d.schools||[]).map(s=>`
      <div class="card"><h3>🏫 ${esc(s.school)} · ${esc(s.year)}</h3>
      ${s.classes.map(c=>`<div class="cls">
        <div class="head"><span>${esc(c.name)}</span><span style="color:var(--gold)">${c.progress} %</span></div>
        <div class="bigbar" style="margin:8px 0 4px"><i style="width:${c.progress}%"></i></div>
        <div class="muted">Lekcia ${c.lessons_done}/${c.lessons_before||10} do venčeka${(c.lessons_total||13)>(c.lessons_before||10)?` (+${(c.lessons_total||13)-(c.lessons_before||10)} bonus)`:''} · ${c.members} žiakov · uhradené ${c.paid_count}/${c.members}${c.event_date?` · večer ${esc(fmtD(c.event_date))}`:''}</div>
        <a href="/vencek?ako=student&class_id=${c.id||c._id}" style="display:inline-block;margin-top:8px;background:rgba(201,168,76,.16);border:1px solid rgba(201,168,76,.45);color:var(--gold);border-radius:9px;padding:5px 11px;font-size:.78rem;font-weight:700;text-decoration:none">👁️ Pozrieť ako žiak</a>
      </div>`).join('')||'<div class="muted">Zatiaľ žiadne skupiny.</div>'}</div>`).join('')
      ||'<div class="empty">Žiadne školy.</div>';
    return;
  }
  if(d.role==='teacher'){
    // Učiteľ vidí menný zoznam žiakov aj s tým, kto zaplatil (Marek 2. 9.).
    const ziaci=(d.students||[]);
    const zoznam=ziaci.length ? `<div class="card"><h3>🧾 Žiaci <small style="color:var(--muted);font-weight:400">· uhradené ${ziaci.filter(z=>z.paid).length}/${ziaci.length}</small></h3>
      <div class="uz">${ziaci.map(z=>`<div class="r">
        <span class="n">${esc(z.name)}</span>
        ${z.absences?`<span class="a">chýbal/a ${z.absences}×</span>`:''}
        <span class="p ${z.paid?'ok':'ne'}">${z.paid?'zaplatené':'nezaplatené'}</span>
      </div>`).join('')}</div>
      <div class="muted" style="margin-top:10px">Platby vyberá Fusion Academy — nemusíte vyberať nič, len viete, komu pripomenúť.</div></div>`
      : `<div class="card"><div class="muted">Zatiaľ žiadni žiaci.</div></div>`;
    host.innerHTML=`<div class="card"><h3>👩‍🏫 Vaša skupina — ${esc(d.class.name)} · ${esc(d.school)}</h3></div>`
      +classCard(d.class, zoznam+attCard(d));
    // Chat je úplne dole — spoločný pre celú skupinu.
    host.insertAdjacentHTML('beforeend', chatKarta()); chatNacitaj();
    return;
  }
  // žiak / rodič
  const done = d.class.completed
    ? `<div class="hero" style="border-color:rgba(124,179,66,.6)"><span class="badge" style="color:#aed581;border-color:rgba(124,179,66,.5);background:rgba(124,179,66,.12)">🏅 ABSOLVENT</span><h1>Venček máte za sebou!</h1><div class="sub">Odznak absolventa svieti na tvojom profile. Kupón <b style="color:var(--gold)">VENCEKABS</b> = 1. mesiac členstva zdarma. 💛</div></div>` : '';
  const pay = d.is_parent
    ? `<div class="pay-ok" style="background:rgba(201,168,76,.1);border-color:rgba(201,168,76,.4);color:var(--cream)">👨‍👩‍👧 Sledujete triedu${d.child_name?` — dieťa <b>${esc(d.child_name)}</b>`:''}. Kurz (${(+d.price).toFixed(2)} €) sa uhrádza cez účet žiaka — po platbe príde potvrdenie na email.</div>`
    : d.my_payment
    ? `<div class="pay-ok">🧾 <b>Zaplatené</b> — ${(+d.my_payment.amount).toFixed(2)} € (${d.my_payment.method==='transfer'?'prevodom':'v hotovosti'}, ${new Date(d.my_payment.paid_at).toLocaleDateString('sk')}). Potvrdenie máš v notifikáciách a na emaili.</div>`
    : `<div class="pay-no">💳 Kurz ešte nie je uhradený — <b>${(+d.price).toFixed(2)} €</b>.
        <div style="margin-top:10px">
          <button onclick="platitKartou(this)"${d.preview?' disabled title="V náhľade sa platiť nedá"':''}
            style="background:linear-gradient(135deg,#C9A84C,#a5842f);color:#161310;border:none;border-radius:10px;padding:11px 20px;font-weight:800;font-size:.92rem;cursor:pointer;width:100%;max-width:280px">
            💳 Zaplatiť kartou
          </button>
        </div>
        <div class="muted" style="margin-top:8px">Karta, Apple Pay aj Google Pay. Alebo v hotovosti na hodine či prevodom — info u lektora.</div>
      </div>`;
  host.innerHTML=done+`<div class="muted" style="margin-bottom:8px">🏫 ${esc(d.school)}</div>`+classCard(d.class, `<div class="card">${pay}</div>`+attCard(d));
  // Chat je úplne dole — spoločný pre celú skupinu.
  host.insertAdjacentHTML('beforeend', chatKarta());
  chatNacitaj();
})();
</script>
</body>
</html>
