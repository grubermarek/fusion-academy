<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Venčeky – Fusion Academy</title>
<link rel="stylesheet" href="/fa-theme.css">
<link rel="icon" type="image/png" href="/logo-mark.png">
<style>
:root{--gold:#C9A84C;--cream:#e8e2d4;--muted:#b9b3a6}
body{background:#12100a;color:var(--cream);font-family:'Inter',system-ui,sans-serif;margin:0;min-height:100vh}
.wrap{max-width:760px;margin:0 auto;padding:16px 14px 90px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 0}
.brand{font-weight:900;color:var(--gold);letter-spacing:.06em}
.switch{background:#1d1a15;border:1px solid rgba(201,168,76,.45);color:var(--gold);border-radius:999px;padding:8px 16px;font-weight:800;font-size:.82rem;text-decoration:none}
.hero{background:linear-gradient(160deg,#241d10,#171310);border:1px solid rgba(201,168,76,.4);border-radius:18px;padding:22px;text-align:center;margin-bottom:14px}
.hero .badge{display:inline-block;background:rgba(201,168,76,.15);border:1px solid rgba(201,168,76,.45);border-radius:999px;padding:4px 14px;font-size:.72rem;font-weight:800;letter-spacing:.12em;color:var(--gold)}
.hero h1{margin:10px 0 2px;font-size:1.5rem}
.hero .sub{color:var(--muted);font-size:.9rem}
.bigbar{height:16px;background:#26221a;border-radius:10px;overflow:hidden;border:1px solid #3a3428;margin:16px 0 6px}
.bigbar i{display:block;height:100%;background:linear-gradient(90deg,#8bc34a,#C9A84C);border-radius:10px;transition:width 1s}
.card{background:#1a1712;border:1px solid #2e2a20;border-radius:14px;padding:16px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:1rem;color:#fff}
.dance{margin-bottom:10px}
.dance .row{display:flex;justify-content:space-between;font-size:.88rem;margin-bottom:4px}
.dance .lvl{color:var(--muted);font-size:.78rem}
.dance .bar{height:9px;background:#26221a;border-radius:6px;overflow:hidden}
.dance .bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#C9A84C,#e8d18a)}
.dance.done .bar i{background:linear-gradient(90deg,#7cb342,#aed581)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:#1d1a15;border:1px solid #2e2a20;border-radius:12px;padding:12px;text-align:center}
.stat b{display:block;font-size:1.3rem;color:#fff}
.stat span{font-size:.75rem;color:var(--muted)}
.pay-ok{background:rgba(124,179,66,.12);border:1px solid rgba(124,179,66,.45);border-radius:12px;padding:12px 14px;font-size:.88rem}
.pay-no{background:rgba(255,152,0,.1);border:1px solid rgba(255,152,0,.4);border-radius:12px;padding:12px 14px;font-size:.88rem;color:#ffcc80}
.cls{border:1px solid #2e2a20;border-radius:12px;padding:12px;margin-bottom:10px;background:#1d1a15}
.cls .head{display:flex;justify-content:space-between;align-items:center;font-weight:800}
.muted{color:var(--muted);font-size:.82rem}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">🎓 FUSION VENČEKY</div>
    <a class="switch" href="/client-dashboard">↔ Bežná appka</a>
  </div>
  <div id="host"><div class="empty">Načítavam…</div></div>
</div>
<script>
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtD=d=>d?d.split('-').reverse().join('.'):null;
function danceHtml(d){
  return `<div class="dance ${d.level>=4?'done':''}">
    <div class="row"><span>${d.level>=4?'✅':'💃'} <b>${esc(d.name)}</b></span><span class="lvl">${d.level>=4?'ZVLÁDNUTÉ':esc(d.level_label)} · ${d.pct} %</span></div>
    <div class="bar"><i style="width:${d.pct}%"></i></div>
  </div>`;
}
function classCard(c, extra=''){
  return `<div class="hero">
    <span class="badge">${esc(c.year)} · ${esc(c.name).toUpperCase()}</span>
    <h1>Naša cesta k venčeku</h1>
    <div class="sub">Lekcia ${c.lessons_done} z ${c.lessons_total}${c.event_date?` · ✨ Venčekový večer: <b style="color:var(--gold)">${esc(fmtD(c.event_date))}</b>`:''}</div>
    <div class="bigbar"><i style="width:${c.progress}%"></i></div>
    <div style="font-weight:900;color:var(--gold)">${c.progress} %</div>
  </div>
  ${extra}
  <div class="card"><h3>💃 Naše tance</h3>${c.dances.map(danceHtml).join('')}
    ${c.note?`<div class="muted" style="margin-top:8px">📝 ${esc(c.note)}</div>`:''}</div>
  <div class="grid">
    <div class="stat"><b>${c.members}</b><span>žiakov v skupine</span></div>
    <div class="stat"><b>${c.lessons_total-c.lessons_done}</b><span>lekcií do venčeka</span></div>
  </div>`;
}
function attCard(d){
  if(d.my_attendance) return `<div class="card"><h3>🙋 Moja dochádzka</h3>
    <div class="row" style="display:flex;justify-content:space-between;font-size:.9rem"><span>Bol/a som na <b>${d.my_attendance.attended}</b> z ${d.my_attendance.recorded} zapísaných lekcií</span><span style="color:var(--gold);font-weight:900">${Math.round(d.my_attendance.attended/d.my_attendance.recorded*100)} %</span></div></div>`;
  if(d.class?.attendance) return `<div class="card"><h3>🙋 Dochádzka triedy</h3>
    <div class="muted">Priemerná účasť <b style="color:var(--gold)">${d.class.attendance.avg_pct} %</b> · zapísaných ${d.class.attendance.lessons_recorded} lekcií</div></div>`;
  return '';
}
async function platitKartou(btn){
  const pov=btn.textContent;
  btn.disabled=true; btn.textContent='Otváram platbu…';
  try{
    const r=await (await fetch('/api/vencek/checkout',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:'{}'})).json();
    if(r&&r.url){ location.href=r.url; return; }
    alert(r&&r.error ? r.error : 'Platbu sa nepodarilo otvoriť. Skús to znova alebo zaplať u lektora.');
  }catch(e){ alert('Platbu sa nepodarilo otvoriť. Skús to znova alebo zaplať u lektora.'); }
  btn.disabled=false; btn.textContent=pov;
}
// Návrat zo Stripe — platbu potvrdí až server dotazom na Stripe, nie táto adresa.
// Musí dobehnúť PRED načítaním prehľadu, inak by stránka ešte ukázala „neuhradené".
async function overPlatbu(){
  const p=new URLSearchParams(location.search);
  if(p.get('stripe')!=='ok' || !p.get('session_id')) return null;
  let hotovo=false;
  try{
    const r=await (await fetch('/api/vencek/verify',{method:'POST',headers:{'Content-Type':'application/json'},
      credentials:'include',body:JSON.stringify({session_id:p.get('session_id')})})).json();
    hotovo = !!(r && r.ok);
  }catch(e){}
  history.replaceState({},'', '/vencek');
  return hotovo;
}
(async()=>{
  const host=document.getElementById('host');
  const zaplatene=await overPlatbu();
  if(zaplatene){
    const b=document.createElement('div');
    b.style.cssText='background:rgba(124,179,66,.16);border:1px solid rgba(124,179,66,.5);border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:.9rem';
    b.innerHTML='✅ <b>Ďakujeme, kurz je uhradený.</b> Potvrdenie ti prišlo na email aj do notifikácií.';
    host.parentNode.insertBefore(b, host);
  }
  // ?ako=student&class_id=… — admin si pozrie skupinu očami žiaka, aby vedel
  // na nábore ukázať, čo deti v appke uvidia.
  const qp=new URLSearchParams(location.search);
  const nahladUrl = (qp.get('ako')==='student' && qp.get('class_id'))
    ? '/api/vencek/mine?ako=student&class_id='+encodeURIComponent(qp.get('class_id')) : '/api/vencek/mine';
  let d; try{ d=await (await fetch(nahladUrl,{credentials:'include'})).json(); }
  catch(e){ host.innerHTML='<div class="empty">Nepodarilo sa načítať. Skús to znova.</div>'; return; }
  if(d.preview){
    const p=document.createElement('div');
    p.style.cssText='background:rgba(201,168,76,.14);border:1px solid rgba(201,168,76,.45);border-radius:12px;padding:11px 14px;margin-bottom:14px;font-size:.88rem;display:flex;align-items:center;gap:10px;flex-wrap:wrap';
    p.innerHTML='<span>👁️</span><span style="flex:1">Toto vidí <b>žiak</b> tejto skupiny. Platba ani dochádzka tu nie sú tvoje.</span>'
      +'<a href="/vencek" style="color:var(--gold);text-decoration:none;font-weight:700;white-space:nowrap">← späť na prehľad</a>';
    host.parentNode.insertBefore(p, host);
  }
  if(!d.ok || !d.role){
    host.innerHTML=`<div class="empty">🎓 Tvoj účet zatiaľ nie je priradený k venčekovej skupine.<br><br>
      Ak máš QR kód od školy, naskenuj ho znova — alebo napíš svojmu lektorovi.<br><br>
      <a class="switch" href="/client-dashboard">Prejsť do appky</a></div>`; return;
  }
  if(d.role==='director' || d.role==='admin'){
    host.innerHTML=(d.schools||[]).map(s=>`
      <div class="card"><h3>🏫 ${esc(s.school)} · ${esc(s.year)}</h3>
      ${s.classes.map(c=>`<div class="cls">
        <div class="head"><span>${esc(c.name)}</span><span style="color:var(--gold)">${c.progress} %</span></div>
        <div class="bigbar" style="margin:8px 0 4px"><i style="width:${c.progress}%"></i></div>
        <div class="muted">Lekcia ${c.lessons_done}/${c.lessons_total} · ${c.members} žiakov · uhradené ${c.paid_count}/${c.members}${c.event_date?` · večer ${esc(fmtD(c.event_date))}`:''}</div>
        <a href="/vencek?ako=student&class_id=${c.id||c._id}" style="display:inline-block;margin-top:8px;background:rgba(201,168,76,.16);border:1px solid rgba(201,168,76,.45);color:var(--gold);border-radius:9px;padding:5px 11px;font-size:.78rem;font-weight:700;text-decoration:none">👁️ Pozrieť ako žiak</a>
      </div>`).join('')||'<div class="muted">Zatiaľ žiadne skupiny.</div>'}</div>`).join('')
      ||'<div class="empty">Žiadne školy.</div>';
    return;
  }
  if(d.role==='teacher'){
    host.innerHTML=`<div class="card"><h3>👩‍🏫 Vaša skupina — ${esc(d.class.name)} · ${esc(d.school)}</h3></div>`
      +classCard(d.class, `<div class="card"><div class="muted">Uhradené: <b style="color:#aed581">${d.class.paid_count}/${d.class.members}</b> žiakov (menný zoznam spravuje Fusion Academy — nemusíte vyberať nič).</div></div>`+attCard(d));
    return;
  }
  // žiak / rodič
  const done = d.class.completed
    ? `<div class="hero" style="border-color:rgba(124,179,66,.6)"><span class="badge" style="color:#aed581;border-color:rgba(124,179,66,.5);background:rgba(124,179,66,.12)">🏅 ABSOLVENT</span><h1>Venček máte za sebou!</h1><div class="sub">Odznak absolventa svieti na tvojom profile. Kupón <b style="color:var(--gold)">VENCEKABS</b> = 1. mesiac členstva zdarma. 💛</div></div>` : '';
  const pay = d.is_parent
    ? `<div class="pay-ok" style="background:rgba(201,168,76,.1);border-color:rgba(201,168,76,.4);color:var(--cream)">👨‍👩‍👧 Sledujete triedu${d.child_name?` — dieťa <b>${esc(d.child_name)}</b>`:''}. Kurz (${(+d.price).toFixed(2)} €) sa uhrádza cez účet žiaka — po platbe príde potvrdenie na email.</div>`
    : d.my_payment
    ? `<div class="pay-ok">🧾 <b>Zaplatené</b> — ${(+d.my_payment.amount).toFixed(2)} € (${d.my_payment.method==='transfer'?'prevodom':'v hotovosti'}, ${new Date(d.my_payment.paid_at).toLocaleDateString('sk')}). Potvrdenie máš v notifikáciách a na emaili.</div>`
    : `<div class="pay-no">💳 Kurz ešte nie je uhradený — <b>${(+d.price).toFixed(2)} €</b>.
        <div style="margin-top:10px">
          <button onclick="platitKartou(this)"${d.preview?' disabled title="V náhľade sa platiť nedá"':''}
            style="background:linear-gradient(135deg,#C9A84C,#a5842f);color:#161310;border:none;border-radius:10px;padding:11px 20px;font-weight:800;font-size:.92rem;cursor:pointer;width:100%;max-width:280px">
            💳 Zaplatiť kartou
          </button>
        </div>
        <div class="muted" style="margin-top:8px">Karta, Apple Pay aj Google Pay. Alebo v hotovosti na hodine či prevodom — info u lektora.</div>
      </div>`;
  host.innerHTML=done+`<div class="muted" style="margin-bottom:8px">🏫 ${esc(d.school)}</div>`+classCard(d.class, `<div class="card">${pay}</div>`+attCard(d));
})();
</script>
</body>
</html>
