<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<link rel="icon" type="image/png" href="/logo-mark.png">
<title>Denný hlavolam – Fusion Academy</title>
<script>try{if(localStorage.getItem('fa_theme')==='aurora')document.documentElement.dataset.theme='aurora'}catch(e){}</script>
<link rel="stylesheet" href="/fa-theme.css">
<link rel="stylesheet" href="/aurora.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<style>
:root{
  --gold:#C9A24C;--gold2:#E7C878;--cream:#EAE3D5;--muted:rgba(234,227,213,.55);
  --bg:#0A0908;--card:#141210;--line:rgba(201,162,76,.22);
  --pz-line:#C9A24C;--pz-cell:#1a1714;--pz-fill:rgba(201,162,76,.16);
}
html[data-theme="aurora"]{
  --bg:#0B0714;--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.14);
  --cream:#F1EDF7;--muted:#B4ACC6;--gold:#E9B8FF;--gold2:#F3D27E;
  --pz-line:#EC4899;--pz-cell:rgba(255,255,255,.05);--pz-fill:rgba(168,85,247,.22);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--cream);font-family:'Manrope',system-ui,sans-serif;
  min-height:100dvh;padding-bottom:110px}
.wrap{max-width:520px;margin:0 auto;padding:16px 16px 0}
.top{display:flex;align-items:center;gap:10px;padding:6px 0 14px}
.top a{color:var(--muted);text-decoration:none;font-size:1.3rem;display:flex}
.top h1{font-size:1.15rem;font-weight:800;flex:1}
.top .date{font-size:.72rem;color:var(--muted)}
.bar{display:flex;gap:8px;margin-bottom:14px}
.pill{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px;text-align:center}
.pill b{display:block;font-size:1.15rem;font-weight:800;font-variant-numeric:tabular-nums}
.pill span{font-size:.66rem;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.board-wrap{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;
  touch-action:none;user-select:none}
#board{display:block;width:100%;height:auto;border-radius:12px}
.hint{font-size:.84rem;color:var(--muted);text-align:center;margin:12px 0 0;line-height:1.5}
.actions{display:flex;gap:8px;margin-top:14px}
button{font-family:inherit;cursor:pointer;border:none;border-radius:12px;font-weight:800;font-size:.88rem;padding:12px}
.btn-main{flex:1;background:linear-gradient(102deg,#B98F3E,#E7C878);color:#231A08}
html[data-theme="aurora"] .btn-main{background:linear-gradient(90deg,#A855F7,#EC4899);color:#fff}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--muted);padding:12px 18px}
.msg{margin-top:12px;padding:12px 14px;border-radius:12px;font-size:.88rem;display:none;line-height:1.5}
.msg.err{display:block;background:rgba(229,115,115,.12);border:1px solid rgba(229,115,115,.4);color:#f0a9a9}
.msg.ok{display:block;background:rgba(76,175,80,.12);border:1px solid rgba(76,175,80,.4);color:#9fd894}
.done{text-align:center;padding:22px 16px;background:var(--card);border:1px solid var(--line);
  border-radius:20px;margin-bottom:14px}
.done .e{font-size:2.6rem}
.done h2{font-size:1.2rem;margin:6px 0 4px;font-weight:800}
.done p{font-size:.88rem;color:var(--muted)}
.lb{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.lb h3{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  padding:12px 16px 8px;font-weight:700}
.lb .row{display:flex;align-items:center;gap:10px;padding:9px 16px;border-top:1px solid var(--line);font-size:.86rem}
.lb .row.me{background:var(--pz-fill)}
.lb .pos{width:22px;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums}
.lb .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb .t{font-variant-numeric:tabular-nums;color:var(--muted)}
.rr{display:flex;flex-direction:column;gap:10px;margin:4px 0 2px}
.rk{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.rk.hotovo{border-color:rgba(201,168,76,.45)}
.rk .hl{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.rk .cislo{width:24px;height:24px;border-radius:50%;background:var(--pz-fill);color:var(--gold);
  font-size:.74rem;font-weight:800;display:grid;place-items:center;flex:none}
.rk .play{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--pz-fill);
  border:1px solid var(--line);border-radius:10px;color:var(--cream,#EAE3D5);font:inherit;font-size:.82rem;
  padding:9px 12px;cursor:pointer}
.rk .play:hover{border-color:var(--gold)}
.rk .play.hraje{border-color:var(--gold);color:var(--gold)}
.rk .opts{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.rk .opts button{background:none;border:1px solid var(--line);border-radius:10px;color:var(--cream,#EAE3D5);
  font:inherit;font-size:.8rem;padding:9px 6px;cursor:pointer}
.rk .opts button:hover{border-color:var(--gold)}
.rk .opts button.vyb{background:var(--pz-fill);border-color:var(--gold);color:var(--gold);font-weight:700}
.rvys{margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.rvys .r{display:flex;gap:10px;padding:9px 14px;border-top:1px solid var(--line);font-size:.82rem;align-items:baseline}
.rvys .r:first-child{border-top:0}
.rvys .n{color:var(--gold);font-weight:700;min-width:104px}
.rvys .tp{color:var(--muted);font-size:.76rem}
.hist{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.hist>button{width:100%;background:none;border:0;color:var(--cream,#EAE3D5);font:inherit;font-size:.82rem;
  padding:13px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer}
.hist>button:hover{background:var(--pz-fill)}
.hist .chev{color:var(--muted);transition:transform .18s}
.hist.open .chev{transform:rotate(180deg)}
.hist .body{display:none;border-top:1px solid var(--line)}
.hist.open .body{display:block}
.hday{border-top:1px solid var(--line)}
.hday:first-child{border-top:0}
.hday>button{width:100%;background:none;border:0;color:inherit;font:inherit;text-align:left;
  padding:11px 16px;display:flex;align-items:center;gap:10px;cursor:pointer}
.hday>button:hover{background:var(--pz-fill)}
.hday .dt{font-size:.8rem;min-width:104px;color:var(--cream,#EAE3D5)}
.hday .wn{flex:1;font-size:.8rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hday .cnt{font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.hday .det{display:none;padding:2px 0 10px}
.hday.open .det{display:block}
.hday .det .row{display:flex;align-items:center;gap:10px;padding:6px 16px;font-size:.82rem}
.hday .det .row.me{background:var(--pz-fill)}
.hday .det .pos{width:26px;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums}
.hday .det .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hday .det .t{font-variant-numeric:tabular-nums;color:var(--muted)}
.hday .det .b{font-variant-numeric:tabular-nums;color:var(--gold);font-weight:700;min-width:34px;text-align:right}
.loading{text-align:center;padding:40px;color:var(--muted)}
/* osemsmerovka */
.wordlist{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.wchip{font-size:.76rem;font-weight:700;padding:5px 11px;border-radius:99px;border:1px solid var(--line);
  color:var(--muted);background:var(--card);transition:.2s}
.wchip.done{color:#9fd894;border-color:rgba(76,175,80,.45);background:rgba(76,175,80,.12);
  text-decoration:line-through;text-decoration-thickness:2px}
</style>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#C9A84C">
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("/sw.js");</script>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a href="/client-dashboard" aria-label="Späť"><i class="bi bi-chevron-left"></i></a>
    <div style="flex:1">
      <h1>🧩 Denný hlavolam</h1>
      <div class="date" id="dateLbl">—</div>
    </div>
  </div>

  <div id="app"><div class="loading">Načítavam hádanku…</div></div>
</div>
<script src="/dock.js"></script>
<script>
let P=null, path=[], drawing=false, startedAt=null, timer=null, solvedToday=false;
const $=id=>document.getElementById(id);
const api=async(url,opts)=>{ const r=await fetch(url,{credentials:'include',headers:{'Content-Type':'application/json'},...opts}); return r.json(); };
const fmtSec=s=>{ s=Math.max(0,Math.round(s)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };

async function init(){
  const d=await api('/api/puzzle/today').catch(()=>null);
  if(!d||!d.ok){ $('app').innerHTML='<div class="loading">Hlavolam sa nepodarilo načítať.</div>'; return; }
  if(!d.enabled){ $('app').innerHTML='<div class="loading">Hlavolam je momentálne vypnutý.</div>'; return; }
  P=d; solvedToday=d.solved;
  const dd=new Date(d.date+'T12:00:00');
  $('dateLbl').textContent=dd.toLocaleDateString('sk-SK',{weekday:'long',day:'numeric',month:'long'});
  render();
  // Čas beží od otvorenia hádanky — server povie, koľko už uplynulo
  if(!solvedToday){
    const st=await api('/api/puzzle/start',{method:'POST'}).catch(()=>null);
    startedAt=Date.now()-((st&&st.elapsed||0)*1000);
    tick(); timer=setInterval(tick,1000);
  }
}

function render(){
  const maxBody=P.points+P.fast_bonus;
  $('app').innerHTML=`
    ${solvedToday?`<div class="done"><div class="e">🎉</div><h2>Dnešnú hádanku máš vyriešenú!</h2>
      <p>Zvládla si ju za <b>${fmtSec(P.my_seconds||0)}</b> a získala <b>${P.my_points} ${P.my_points===1?'bod':'body'}</b>.
      Nová hádanka je zajtra ráno.</p></div>`:''}
    <div class="bar">
      <div class="pill"><b id="clock">0:00</b><span>čas</span></div>
      <div class="pill"><b id="filled">${P.type==='words'?'0/'+P.words.length:P.type==='rhythm'?'0/'+P.rounds.length:'0/'+(P.size*P.size)}</b><span>${P.type==='words'?'slov':P.type==='rhythm'?'rytmov':'políčok'}</span></div>
      <div class="pill"><b>${P.month_points}/${P.monthly_cap}</b><span>bodov v mesiaci</span></div>
    </div>
    ${P.type==='rhythm' ? '<div class="rr" id="rr"></div>' : '<div class="board-wrap"><canvas id="board"></canvas></div>'}
    ${P.type==='words' ? '<div class="wordlist" id="wordList"></div>' : ''}
    <div class="hint">${P.type==='words'
      ? 'Ťahaj prstom po písmenách a označ <b>všetkých '+P.words.length+' slov</b>. Slová sú vodorovne, zvisle aj šikmo — aj odzadu.'
      : P.type==='rhythm'
      ? 'Vypočuj si ukážku a hádaj, <b>na ktorý tanec</b> je. Pustiť si ju môžeš koľkokrát chceš — čas ale beží.'
      : 'Ťahaj prstom od <b>1</b> a spájaj čísla v poradí tak, aby si prešla <b>všetky políčka</b>.'}
<br><b style="color:var(--gold)">Za vyriešenie ${P.points} ${P.points===1?'bod':P.points<5?'body':'bodov'}</b> · najrýchlejšie časy dňa navyše 🥇 +${(P.podium_bonus||[5,3,1])[0]} · 🥈 +${(P.podium_bonus||[5,3,1])[1]} · 🥉 +${(P.podium_bonus||[5,3,1])[2]} — čas beží od otvorenia, poradie sa uzatvára o polnoci.</div>
    <div class="actions">
      <button class="btn-ghost" onclick="resetPath()">Vymazať</button>
      <button class="btn-main" id="sendBtn" onclick="submit()">Odovzdať riešenie</button>
    </div>
    <div class="msg" id="msg"></div>
    <div class="lb" id="lb"></div>
    <div class="hist" id="hist"></div>`;
  if(P.type==='rhythm'){ renderRytmus(); }
  else {
    setupCanvas();
    if(P.type==='words'){ found=(solvedToday&&P.solution)||[]; renderWordList(); draw(); }
    else { path=(solvedToday&&P.solution_path)||[]; draw(); }
  }
  loadLb();
}

/* ── Kreslenie ── */
let cv, ctx, cell, dpr;
function setupCanvas(){
  cv=$('board'); ctx=cv.getContext('2d');
  const size=Math.min(cv.parentElement.clientWidth, 460);
  dpr=window.devicePixelRatio||1;
  cv.style.width=size+'px'; cv.style.height=size+'px';
  cv.width=size*dpr; cv.height=size*dpr; ctx.scale(dpr,dpr);
  cell=size/P.size;
  if(!cv.dataset.bound){
    cv.dataset.bound='1';
    cv.addEventListener('pointerdown',onDown);
    cv.addEventListener('pointermove',onMove);
    window.addEventListener('pointerup',onUp);
  }
}
// otočenie telefónu / zmena okna — mriežku prepočítaj, inak by ťah mieril vedľa
let rzT=null;
// Rytmus nemá mriežku ani canvas — prepočítavať netreba a setupCanvas by spadol.
window.addEventListener('resize',()=>{ if(!P||P.type==='rhythm') return; clearTimeout(rzT); rzT=setTimeout(()=>{ setupCanvas(); draw(); },150); });
const cellOf=(x,y)=>{ const c=Math.floor(x/cell), r=Math.floor(y/cell);
  if(r<0||c<0||r>=P.size||c>=P.size) return -1; return r*P.size+c; };
const centre=i=>({x:(i%P.size)*cell+cell/2, y:Math.floor(i/P.size)*cell+cell/2});
const adjacent=(a,b)=>{ const ra=Math.floor(a/P.size),ca=a%P.size,rb=Math.floor(b/P.size),cb=b%P.size;
  return Math.abs(ra-rb)+Math.abs(ca-cb)===1; };
const dotAt=i=>P.dots.find(d=>d.cell===i);

let found=[], dragFrom=null, dragTo=null;
function renderWordList(){
  const el=$('wordList'); if(!el) return;
  const done=new Set(found.map(f=>f.word));
  el.innerHTML=P.words.map(w=>'<span class="wchip'+(done.has(w)?' done':'')+'">'+w+'</span>').join('');
  const f=$('filled'); if(f) f.textContent=done.size+'/'+P.words.length;
}
// bunky medzi dvoma bodmi, ak ležia na priamke v niektorom z 8 smerov
function lineCells(a,b){
  const r1=Math.floor(a/P.size), c1=a%P.size, r2=Math.floor(b/P.size), c2=b%P.size;
  const dr=Math.sign(r2-r1), dc=Math.sign(c2-c1);
  const len=Math.max(Math.abs(r2-r1), Math.abs(c2-c1));
  if(Math.abs(r2-r1)!==Math.abs(c2-c1) && r1!==r2 && c1!==c2) return null;   // nie je priamka
  const out=[];
  for(let i=0;i<=len;i++) out.push((r1+dr*i)*P.size+(c1+dc*i));
  return out;
}
function drawWords(){
  const S=P.size*cell;
  ctx.clearRect(0,0,S,S);
  const css=getComputedStyle(document.documentElement);
  const line=css.getPropertyValue('--pz-line').trim()||'#C9A24C';
  const cellBg=css.getPropertyValue('--pz-cell').trim()||'#1a1714';
  const cream=css.getPropertyValue('--cream').trim()||'#EAE3D5';
  // podklad
  for(let i=0;i<P.size*P.size;i++){
    const r=Math.floor(i/P.size), c=i%P.size;
    ctx.fillStyle=cellBg;
    ctx.beginPath(); ctx.roundRect(c*cell+1.5, r*cell+1.5, cell-3, cell-3, 6); ctx.fill();
  }
  // už nájdené slová – zelený pruh
  const stroke=(cells,color,alpha)=>{
    if(!cells||!cells.length) return;
    const a=centre(cells[0]), b=centre(cells[cells.length-1]);
    ctx.strokeStyle=color; ctx.globalAlpha=alpha; ctx.lineWidth=cell*0.72; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); ctx.globalAlpha=1;
  };
  found.forEach(f=>stroke(f.cells,'#4caf50',.30));
  if(dragFrom!=null && dragTo!=null) stroke(lineCells(dragFrom,dragTo), line, .35);
  // písmená
  ctx.font='700 '+Math.round(cell*0.46)+'px Manrope, sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for(let r=0;r<P.size;r++) for(let c=0;c<P.size;c++){
    ctx.fillStyle=cream;
    ctx.fillText(P.grid[r][c], c*cell+cell/2, r*cell+cell/2+1);
  }
}
function draw(){
  if(P.type==='words') return drawWords();
  const S=P.size*cell;
  ctx.clearRect(0,0,S,S);
  const css=getComputedStyle(document.documentElement);
  const line=css.getPropertyValue('--pz-line').trim()||'#C9A24C';
  const cellBg=css.getPropertyValue('--pz-cell').trim()||'#1a1714';
  const fill=css.getPropertyValue('--pz-fill').trim()||'rgba(201,162,76,.16)';
  const cream=css.getPropertyValue('--cream').trim()||'#EAE3D5';
  // políčka
  for(let i=0;i<P.size*P.size;i++){
    const r=Math.floor(i/P.size), c=i%P.size;
    ctx.fillStyle=path.includes(i)?fill:cellBg;
    ctx.beginPath(); ctx.roundRect(c*cell+2, r*cell+2, cell-4, cell-4, 8); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.06)'; ctx.lineWidth=1; ctx.stroke();
  }
  // cesta
  if(path.length>1){
    ctx.strokeStyle=line; ctx.lineWidth=Math.max(8,cell*0.34);
    ctx.lineCap='round'; ctx.lineJoin='round'; ctx.globalAlpha=.85;
    ctx.beginPath();
    path.forEach((i,k)=>{ const p=centre(i); k?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y); });
    ctx.stroke(); ctx.globalAlpha=1;
  }
  // čísla
  P.dots.forEach(d=>{
    const p=centre(d.cell), rad=cell*0.30;
    ctx.fillStyle='#111'; ctx.beginPath(); ctx.arc(p.x,p.y,rad,0,7); ctx.fill();
    ctx.strokeStyle=line; ctx.lineWidth=2.5; ctx.stroke();
    ctx.fillStyle='#fff'; ctx.font='800 '+Math.round(cell*0.33)+'px Manrope, sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(String(d.n), p.x, p.y+1);
  });
  const f=$('filled'); if(f) f.textContent=path.length+'/'+(P.size*P.size);
}

function pos(e){ const r=cv.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; }
function onDown(e){
  if(solvedToday) return;
  if(P.type==='words'){
    const i=cellOf(pos(e).x,pos(e).y); if(i<0) return;
    cv.setPointerCapture(e.pointerId);
    dragFrom=i; dragTo=i; drawing=true; draw(); return;
  }
  const {x,y}=pos(e), i=cellOf(x,y); if(i<0) return;
  cv.setPointerCapture(e.pointerId);
  // začať sa dá len na jednotke, alebo pokračovať z konca cesty
  if(!path.length){ const d=dotAt(i); if(!d||d.n!==1) { flash('Začni na čísle 1.'); return; } path=[i]; startClock(); }
  else if(path[path.length-1]!==i && !adjacent(path[path.length-1],i)) return;
  else if(!path.includes(i)) path.push(i);
  drawing=true; draw();
}
function onMove(e){
  if(!drawing||solvedToday) return;
  if(P.type==='words'){
    const i=cellOf(pos(e).x,pos(e).y); if(i<0||i===dragTo) return;
    dragTo=i; draw(); return;
  }
  const {x,y}=pos(e), i=cellOf(x,y); if(i<0) return;
  const last=path[path.length-1];
  if(i===last) return;
  if(path.length>1 && i===path[path.length-2]){ path.pop(); draw(); return; }  // krok späť
  if(!path.includes(i) && adjacent(last,i)){ path.push(i); draw(); }
}
function onUp(){
  if(P.type==='words' && drawing && dragFrom!=null && dragTo!=null){
    const cells=lineCells(dragFrom,dragTo);
    if(cells && cells.length>1){
      const txt=cells.map(i=>P.grid[Math.floor(i/P.size)][i%P.size]).join('');
      const rev=txt.split('').reverse().join('');
      const hit=P.words.find(w=>(w===txt||w===rev) && !found.some(f=>f.word===w));
      if(hit){ found.push({word:hit, cells}); renderWordList(); }
    }
    dragFrom=dragTo=null; draw();
    if(found.length===P.words.length) submit();     // všetky nájdené → odovzdaj
  }
  drawing=false;
}

const skToday=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Bratislava'}).format(new Date());
function tick(){
  const c=$('clock'); if(c&&startedAt) c.textContent=fmtSec((Date.now()-startedAt)/1000);
  // stránka otvorená cez polnoc → načítaj novú hádanku (ako koleso šťastia)
  if(P && skToday()!==P.date){ if(timer) clearInterval(timer); location.reload(); }
}
function startClock(){ if(!timer&&startedAt) timer=setInterval(tick,1000); }
function resetPath(){
  if(P && P.type==='rhythm'){
    prehravace.forEach(a=>{ if(a){ a.pause(); a.currentTime=0; } });
    prehravace=[]; hraIndex=null;
    renderRytmus(); const f=$('filled'); if(f) f.textContent='0/'+P.rounds.length; return;
  }
  if(P && P.type==='words'){ found=[]; dragFrom=dragTo=null; renderWordList(); }
  path=[]; draw(); const m=$('msg'); if(m){m.className='msg';m.textContent='';}
}
function flash(t){ const m=$('msg'); if(!m) return; m.className='msg err'; m.textContent=t; }

async function submit(){
  if(solvedToday) return;
  const btn=$('sendBtn'); btn.disabled=true; btn.textContent='Kontrolujem…';
  const seconds=startedAt?Math.round((Date.now()-startedAt)/1000):0;
  const payload=P.type==='words' ? {found, seconds, date:P.date}
    : P.type==='rhythm' ? {answers:odpovede, seconds, date:P.date}
    : {cells:path, seconds, date:P.date};
  const d=await api('/api/puzzle/solve',{method:'POST',body:JSON.stringify(payload)}).catch(()=>null);
  btn.disabled=false; btn.textContent='Odovzdať riešenie';
  if(!d){ flash('Nepodarilo sa odoslať. Skús znova.'); return; }
  if(d.new_day){ flash('Práve nastala polnoc — načítavam novú hádanku…'); setTimeout(()=>location.reload(),1500); return; }
  if(d.error){ flash(d.error); return; }
  if(timer){ clearInterval(timer); timer=null; }
  const m=$('msg'); m.className='msg ok';
  m.innerHTML = d.already ? d.message
    : `🎉 Vyriešené za <b>${fmtSec(d.seconds)}</b>! Získala si <b>${d.points} ${d.points===1?'bod':d.points<5?'body':'bodov'}</b>.`
      + (d.capped?'<br><span style="opacity:.8">Mesačný strop bodov z hlavolamu je vyčerpaný — hrať môžeš ďalej pre radosť. 💛</span>':'')
    + '<br>🥇 Ak sa udržíš v prvej trojke, ráno ti pribudne bonus (+'+((P.podium_bonus||[5,3,1]).join(' / +'))+').';
  solvedToday=true;
  const st=await api('/api/puzzle/today').catch(()=>null); if(st&&st.ok) P=st;
  if(P.type==='rhythm') ukazRiesenie();
  loadLb();
}

async function loadLb(){
  const d=await api('/api/puzzle/leaderboard').catch(()=>null);
  vykresliHistoriu();
  const el=$('lb'); if(!el||!d||!d.ok||!d.rows.length){ if(el) el.innerHTML=''; return; }
  const MED={1:'🥇',2:'🥈',3:'🥉'};
  const BON=(P&&P.podium_bonus)||[5,3,1];
  el.innerHTML='<h3>Dnes najrýchlejšie · '+d.rows.length+(d.rows.length===1?' hráčka':d.rows.length<5?' hráčky':' hráčok')+'</h3>'
    +d.rows.map(r=>
    `<div class="row ${r.me?'me':''}"><div class="pos">${MED[r.pos]||r.pos+'.'}</div><div class="nm">${r.name}</div><div class="t">${fmtSec(r.seconds)}${r.pos<=3?` <span style="color:var(--gold);font-weight:800">+${BON[r.pos-1]}</span>`:''}</div></div>`).join('')
    +'<div style="font-size:.72rem;color:var(--muted);padding:8px 16px 12px;border-top:1px solid var(--line);line-height:1.5">Poradie sa uzatvára o polnoci — bonus 🥇 +'+BON[0]+' · 🥈 +'+BON[1]+' · 🥉 +'+BON[2]+' bod pripíšeme ráno.</div>';
}

// ── Poznáš rytmus? ──────────────────────────────────────────────────────────
// Zvuk skladáme priamo v prehliadači cez Web Audio — žiadna nahrávka, teda ani
// žiadne autorské práva. Úder je krátky tón s rýchlym dobehom, akcent má vyššiu
// frekvenciu aj hlasitosť, aby bolo počuť „pop" v bachate a chassé v cha-che.
let odpovede=[], prehravace=[], hraIndex=null;

// Skladby sú minútové ukážky, preto ich netreba načítať dopredu — 11 súborov po
// 700 kB by pri otvorení stránky zbytočne zaťažilo dáta. Načítajú sa na klik.
function prehravac(i){
  if(prehravace[i]) return prehravace[i];
  const r=P.rounds&&P.rounds[i]; if(!r) return null;
  const a=new Audio(r.src);
  a.preload='none';
  a.addEventListener('ended',()=>oznacHranie(i,false));
  a.addEventListener('error',()=>{
    const b=$('play'+i); if(b) b.textContent='⚠️ Ukážku sa nepodarilo načítať';
  });
  prehravace[i]=a;
  return a;
}
function oznacHranie(i,hra){
  const b=$('play'+i); if(!b) return;
  b.classList.toggle('hraje',hra);
  b.textContent = hra ? '⏸ Zastaviť' : '▶ Pustiť ukážku';
}
function prehrajRytmus(i){
  const a=prehravac(i); if(!a) return;
  // Hrá vždy len jedna ukážka — dve naraz by sa nedali rozoznať.
  if(hraIndex!=null && hraIndex!==i){
    const p=prehravace[hraIndex];
    if(p){ p.pause(); p.currentTime=0; }
    oznacHranie(hraIndex,false);
  }
  if(!a.paused){ a.pause(); a.currentTime=0; oznacHranie(i,false); hraIndex=null; return; }
  hraIndex=i;
  oznacHranie(i,true);
  a.play().catch(()=>{
    oznacHranie(i,false); hraIndex=null;
    const b=$('play'+i); if(b) b.textContent='🔇 Prehliadač zvuk zablokoval — ťukni ešte raz';
  });
}
function vyberTanec(i,key){
  if(solvedToday) return;
  odpovede[i]=key;
  const k=$('rk'+i); if(k){
    k.classList.add('hotovo');
    k.querySelectorAll('.opts button').forEach(b=>b.classList.toggle('vyb', b.dataset.k===key));
  }
  const f=$('filled'); if(f) f.textContent=odpovede.filter(Boolean).length+'/'+P.rounds.length;
}
function renderRytmus(){
  const el=$('rr'); if(!el||!P.rounds) return;
  odpovede=new Array(P.rounds.length).fill(null);
  el.innerHTML=P.rounds.map((r,i)=>
    '<div class="rk" id="rk'+i+'">'
    +'<div class="hl"><div class="cislo">'+(i+1)+'</div>'
      +'<button type="button" class="play" id="play'+i+'" onclick="prehrajRytmus('+i+')">▶ Pustiť ukážku</button></div>'
    +'<div class="opts">'+P.options.map(o=>
        '<button type="button" data-k="'+o.key+'" onclick="vyberTanec('+i+',\''+o.key+'\')">'+o.name+'</button>').join('')
    +'</div></div>').join('');
  if(solvedToday && P.reveal) ukazRiesenie();
}
function ukazRiesenie(){
  const el=$('rr'); if(!el||!P.reveal) return;
  if(document.querySelector('.rvys')) return;   // už je vypísané, nevkladaj druhýkrát
  el.insertAdjacentHTML('afterend',
    '<div class="rvys">'+P.reveal.map((x,i)=>
      '<div class="r"><div class="n">'+(i+1)+'. '+x.name+'</div><div class="tp">'+x.tip
      +(x.skladba?'<br><span style="opacity:.7">'+x.skladba+(x.autor?' · '+x.autor:'')+'</span>':'')+'</div></div>').join('')
    +'</div>');
}

// ── História víťazov ────────────────────────────────────────────────────────
// Načítava sa až po kliknutí, nie pri otvorení stránky — hráčku zaujíma dnešok,
// história je doplnok a nemá jej spomaľovať prvé zobrazenie.
let HIST=null, histNacitava=false;
const MEDAILA={1:'🥇',2:'🥈',3:'🥉'};
const TYP={zip:'🧩 Spoj čísla', words:'🔤 Osemsmerovka'};
const SK_MES=['januára','februára','marca','apríla','mája','júna','júla','augusta','septembra','októbra','novembra','decembra'];
const SK_DEN=['nedeľa','pondelok','utorok','streda','štvrtok','piatok','sobota'];

function datumSK(iso){
  const [r,m,d]=String(iso).split('-').map(Number);
  const dt=new Date(Date.UTC(r,m-1,d));
  return SK_DEN[dt.getUTCDay()]+' '+d+'. '+SK_MES[m-1];
}
function hracky(n){ return n===1?'hráčka':(n>=2&&n<=4?'hráčky':'hráčok'); }

function vykresliHistoriu(){
  const el=$('hist'); if(!el) return;
  if(!el.dataset.init){
    el.dataset.init='1';
    el.innerHTML='<button type="button" onclick="prepniHistoriu()">'
      +'<span>📜 História — kto vyhral v predošlé dni</span><span class="chev">▾</span></button>'
      +'<div class="body" id="histBody"></div>';
  }
}

async function prepniHistoriu(){
  const el=$('hist'); if(!el) return;
  const otvorene=el.classList.toggle('open');
  if(!otvorene || HIST || histNacitava) return;
  histNacitava=true;
  const b=$('histBody'); if(b) b.innerHTML='<div style="padding:14px 16px;color:var(--muted);font-size:.82rem">Načítavam…</div>';
  const d=await api('/api/puzzle/history?days=30').catch(()=>null);
  histNacitava=false;
  if(!d||!d.ok){ if(b) b.innerHTML='<div style="padding:14px 16px;color:var(--muted);font-size:.82rem">Históriu sa nepodarilo načítať.</div>'; return; }
  HIST=d.days||[];
  if(!b) return;
  if(!HIST.length){ b.innerHTML='<div style="padding:14px 16px;color:var(--muted);font-size:.82rem">Zatiaľ tu nič nie je — prvé kolo sa práve píše. 💛</div>'; return; }
  b.innerHTML=HIST.map((den,i)=>{
    const v=den.winner;
    return '<div class="hday" id="hd'+i+'">'
      +'<button type="button" onclick="prepniDen('+i+')">'
        +'<span class="dt">'+datumSK(den.date)+'</span>'
        +'<span class="wn">'+(v?MEDAILA[1]+' '+v.name+' · '+fmtSec(v.seconds):'nikto nevyriešil')+'</span>'
        +'<span class="cnt">'+den.players+'</span>'
      +'</button>'
      +'<div class="det">'
        +'<div style="padding:2px 16px 8px;font-size:.72rem;color:var(--muted)">'
          +(TYP[den.type]||'hádanka')+' · '+den.players+' '+hracky(den.players)+' · spolu '+den.points+' b</div>'
        +den.rows.map(r=>
          '<div class="row '+(r.me?'me':'')+'">'
          +'<div class="pos">'+(MEDAILA[r.pos]||r.pos+'.')+'</div>'
          +'<div class="nm">'+r.name+'</div>'
          +'<div class="t">'+fmtSec(r.seconds)+'</div>'
          +'<div class="b">'+r.points+' b</div></div>').join('')
      +'</div></div>';
  }).join('');
}

function prepniDen(i){
  const el=$('hd'+i); if(el) el.classList.toggle('open');
}

init();
</script>
</body>
</html>
