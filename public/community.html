<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="/logo-mark.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Komunita Fusion Academy – real-time chat, blog kanály, zdieľanie skúseností s tancovaním a fitnessom.">
<meta name="keywords" content="komunita, tanečná komunita, fitness fórum, fusion academy">
<meta property="og:title" content="Komunita – Fusion Academy">
<meta property="og:description" content="Komunita Fusion Academy – real-time chat, blog kanály, zdieľanie skúseností s tancovaním a fitnessom.">
<meta property="og:image" content="https://latindancefusion.art/og-image.svg">
<meta property="og:type" content="website">
<link rel="canonical" href="https://latindancefusion.art/community">
<title>Komunita – Fusion Academy</title>
<script>/* téma pred prvým renderom (bez bliknutia) */try{if(localStorage.getItem('fa_theme')==='aurora')document.documentElement.dataset.theme='aurora'}catch(e){}</script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="/fa-theme.css">
<link rel="stylesheet" href="/aurora.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<script src="/socket.io/socket.io.js"></script>
<style>
:root{--red:#C9A24C;--orange:#F3DFA8;--dark:#0A0908;--msg-bg:#0d0b0a;
  --gold:#C9A24C;--gold-light:#F3DFA8;
  --dark-1:#0A0908;--dark-2:#12100E;--dark-3:#1A1714;--dark-4:#221E19;
  --cream:#EAE3D5;--text-muted:rgba(234,227,213,0.52);
  --gold-border:rgba(201,162,76,0.22);
  --grad-gold:linear-gradient(102deg,#B98F3E,#F7E7B8 36%,#E7C878 58%,#B98F3E);
  --serif:'Cormorant Garamond',Georgia,serif;--sans:'Manrope',system-ui,sans-serif;
  /* IG vrstva — klasické (zlaté) hodnoty; aurora ich prepisuje nižšie */
  --ig-bg:var(--dark);
  --ig-surface:#161311;
  --ig-border:rgba(201,162,76,0.22);
  --ig-ring:linear-gradient(135deg,#B98F3E,#F7E7B8,#C9A24C);
  --ig-ring-read:rgba(255,255,255,.18);
  --ig-accent:#C9A24C;
  --ig-cta:linear-gradient(102deg,#B98F3E,#E7C878);
  --ig-cta-text:#231A08;
  --ig-bub:#1E1A15;
  --ig-bub-own:linear-gradient(135deg,#C9A24C,#E7C878);
  --ig-bub-own-text:#231A08;
  --ig-unread:#C9A24C;
}
html[data-theme="aurora"]{
  --ig-bg:#0B0714;
  --ig-surface:rgba(255,255,255,.07);
  --ig-border:rgba(255,255,255,.14);
  --ig-ring:linear-gradient(135deg,#A855F7,#EC4899,#C9A84C);
  --ig-ring-read:rgba(255,255,255,.2);
  --ig-accent:#E9B8FF;
  --ig-cta:linear-gradient(90deg,#A855F7,#EC4899);
  --ig-cta-text:#fff;
  --ig-bub:rgba(255,255,255,.09);
  --ig-bub-own:linear-gradient(90deg,rgba(168,85,247,.6),rgba(236,72,153,.6));
  --ig-bub-own-text:#fff;
  --ig-unread:#EC4899;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;font-family:var(--sans);-webkit-font-smoothing:antialiased;}
body{background:var(--ig-bg);color:var(--cream);}
body.fa-has-dock{padding-bottom:0 !important;}
body.fa-has-dock .chat-input-area{padding-bottom:84px;}
body.fa-has-dock #fa-dock{bottom:12px;}
body.fa-has-dock .messages{padding-bottom:96px;}

.app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:680px;margin:0 auto;position:relative;}
@media(min-width:700px){.app{border-left:1px solid var(--ig-border);border-right:1px solid var(--ig-border);}}

/* ── IG header ── */
.ig-hdr{display:flex;align-items:center;gap:10px;padding:12px 14px 10px;flex-shrink:0;border-bottom:1px solid var(--ig-border);background:transparent;}
html[data-theme="aurora"] .ig-hdr{background:rgba(20,13,34,.6);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);}
.ig-back{background:none;border:none;color:var(--cream);cursor:pointer;padding:4px;display:flex;flex:none;}
.ig-hchan{width:38px;height:38px;border-radius:50%;padding:2px;background:var(--ig-ring);flex:none;cursor:pointer;}
.ig-hchan>div{width:100%;height:100%;border-radius:50%;background:var(--ig-surface);display:flex;align-items:center;justify-content:center;font-size:1rem;overflow:hidden;}
.ig-hchan img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.ig-htitle{flex:1;min-width:0;}
.ig-t1{font-size:1.05rem;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:7px;}
.ig-t2{font-size:.68rem;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ig-actions{display:flex;align-items:center;gap:6px;flex:none;}
.ig-iconbtn{background:none;border:none;color:var(--cream);cursor:pointer;padding:6px;position:relative;display:flex;}
.ig-iconbtn:hover{color:var(--ig-accent);}
.ig-unread{position:absolute;top:0;right:0;background:var(--ig-unread);color:#fff;font-size:.58rem;font-weight:800;min-width:15px;height:15px;border-radius:99px;display:flex;align-items:center;justify-content:center;padding:0 4px;}
.online-pill{background:rgba(139,195,74,.12);color:#8bc34a;font-size:.68rem;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap;border:1px solid rgba(139,195,74,.3);}

/* ── Kanálové krúžky (stories vzor) ── */
.ig-stories{display:flex;gap:12px;overflow-x:auto;padding:12px 14px 10px;flex-shrink:0;scrollbar-width:none;border-bottom:1px solid var(--ig-border);}
.ig-stories::-webkit-scrollbar{display:none;}
.ig-story{display:flex;flex-direction:column;align-items:center;gap:5px;width:58px;flex:none;cursor:pointer;background:none;border:none;padding:0;}
.ig-ring{width:54px;height:54px;border-radius:50%;padding:2.5px;background:var(--ig-ring-read);transition:.2s;}
.ig-story.unread .ig-ring{background:var(--ig-ring);}
.ig-story.active .ig-ring{background:var(--cream);}
.ig-ringin{width:100%;height:100%;border-radius:50%;background:var(--ig-surface);display:flex;align-items:center;justify-content:center;font-size:1.3rem;}
html[data-theme="aurora"] .ig-ringin{background:#181126;}
.ig-story span{font-size:.58rem;color:var(--text-muted);font-weight:600;max-width:58px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ig-story.active span{color:var(--cream);}

/* ── Scroller ── */
.messages{flex:1;overflow-y:auto;padding:12px 12px 16px;display:flex;flex-direction:column;gap:2px;}
.messages::-webkit-scrollbar{width:4px;}
.messages::-webkit-scrollbar-thumb{background:var(--ig-border);border-radius:2px;}

/* ── Chat bubliny ── */
@keyframes msgIn{from{opacity:0;transform:translateY(12px) scale(.98);}to{opacity:1;transform:translateY(0) scale(1);}}
.msg.msg-in,.article-card.msg-in{animation:msgIn .32s cubic-bezier(.22,1,.36,1);}
@media(prefers-reduced-motion:reduce){.msg.msg-in,.article-card.msg-in{animation:none;}}
.msg{display:flex;gap:8px;margin:3px 0;align-items:flex-end;max-width:100%;}
.msg-avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.68rem;color:#fff;flex-shrink:0;cursor:pointer;overflow:hidden;}
.msg-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.bub{max-width:78%;padding:8px 12px;border-radius:16px 16px 16px 5px;background:var(--ig-bub);border:1px solid var(--ig-border);font-size:.85rem;line-height:1.45;color:var(--cream);word-break:break-word;}
html[data-theme="aurora"] .bub{-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);}
.msg.own{flex-direction:row-reverse;}
.msg.own .bub{border-radius:16px 16px 5px 16px;background:var(--ig-bub-own);border-color:transparent;color:var(--ig-bub-own-text);}
.bub .who{font-size:.62rem;font-weight:800;color:var(--ig-accent);margin-bottom:2px;display:flex;align-items:center;gap:5px;flex-wrap:wrap;cursor:pointer;}
.bub .who .member-badge{cursor:default;}
.bub .btime{font-size:.58rem;opacity:.55;margin-top:3px;text-align:right;}
.msg-text .mention{color:var(--ig-accent);font-weight:600;}
.member-badge{display:inline-flex;align-items:center;gap:.2rem;font-size:.6rem;font-weight:700;padding:1px 6px;border-radius:20px;color:#fff;white-space:nowrap;}
.rank-badge{font-size:.72rem;}

/* Blog article card */
.article-card{background:var(--ig-surface);border:1px solid var(--ig-border);border-left:3px solid var(--ig-accent);border-radius:14px;padding:1.05rem 1.15rem;margin:.55rem 0;position:relative;}
html[data-theme="aurora"] .article-card{-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);}
.article-cat-badge{display:inline-block;background:rgba(201,162,76,.15);color:var(--ig-accent);border:1px solid var(--ig-border);font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:.15rem .6rem;border-radius:2rem;margin-bottom:.45rem;}
.article-title{font-size:.98rem;font-weight:800;color:var(--cream);margin-bottom:.35rem;line-height:1.3;}
.article-meta{display:flex;align-items:center;gap:.45rem;flex-wrap:wrap;margin-bottom:.65rem;padding-bottom:.55rem;border-bottom:1px solid var(--ig-border);}
.article-body{font-size:.85rem;color:var(--text-muted);line-height:1.65;white-space:pre-wrap;word-break:break-word;}
.article-body strong{color:var(--cream);}
.msg-name{font-weight:700;font-size:.82rem;color:var(--cream);}
.msg-time{font-size:.66rem;color:var(--text-muted);}

/* Oddeľovač dní */
.date-sep{display:flex;align-items:center;gap:10px;margin:12px 0 8px;}
.date-sep::before,.date-sep::after{content:'';flex:1;height:1px;background:var(--ig-border);}
.date-sep span{font-size:.64rem;color:var(--text-muted);font-weight:700;white-space:nowrap;}

/* ── Vstupný riadok ── */
.chat-input-area{border-top:1px solid var(--ig-border);padding:.7rem .9rem;flex-shrink:0;background:transparent;}
html[data-theme="aurora"] .chat-input-area{background:rgba(20,13,34,.6);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);}
.input-box{display:flex;gap:.5rem;align-items:flex-end;background:var(--ig-surface);border-radius:1.3rem;padding:.5rem .5rem .5rem 1rem;border:1px solid var(--ig-border);transition:.2s;}
.input-box:focus-within{border-color:var(--ig-accent);}
#msgInput{flex:1;border:none;background:none;outline:none;font-size:.9rem;resize:none;max-height:120px;min-height:22px;font-family:inherit;line-height:1.45;color:var(--cream);}
#msgInput::placeholder{color:var(--text-muted);}
.send-btn{background:var(--ig-cta);border:none;color:var(--ig-cta-text);width:36px;height:36px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.2s;}
.send-btn:hover{opacity:.85;transform:scale(1.08);}
.send-btn:disabled{opacity:.4;transform:none;cursor:not-allowed;}
.char-count{font-size:.66rem;color:var(--text-muted);text-align:right;margin-top:.2rem;padding-right:.5rem;}

/* ── Feed (nástenka) ── */
.feed-wrap{max-width:640px;margin:0 auto;width:100%;padding:2px 0 40px;}
.feed-composer{background:var(--ig-surface);border:1px solid var(--ig-border);border-radius:16px;padding:12px 14px;margin-bottom:14px;display:flex;flex-direction:column;gap:8px;}
html[data-theme="aurora"] .feed-composer{-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);}
.fc-top{display:flex;align-items:flex-start;gap:10px;}
.fc-av{width:34px;height:34px;border-radius:50%;background:var(--ig-cta);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.8rem;color:var(--ig-cta-text);flex:none;}
.feed-composer textarea{flex:1;background:none;border:none;outline:none;color:var(--cream);padding:6px 0;font-size:.9rem;resize:vertical;min-height:40px;font-family:inherit;}
.feed-composer textarea::placeholder{color:var(--text-muted);}
.fc-actions{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--ig-border);padding-top:9px;}
.fc-btn{background:var(--ig-cta);color:var(--ig-cta-text);border:none;font-weight:800;padding:7px 20px;border-radius:99px;cursor:pointer;font-size:.82rem;}
.fc-img{color:var(--ig-accent);cursor:pointer;font-size:.82rem;display:inline-flex;gap:6px;align-items:center;font-weight:600;}
.feed-preview{position:relative;}
.feed-preview img{max-width:100%;border-radius:12px;max-height:220px;}
.feed-preview .rm{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.7);color:#fff;border:none;border-radius:50%;width:26px;height:26px;cursor:pointer;}

.post{background:var(--ig-surface);border:1px solid var(--ig-border);border-radius:16px;padding:0 0 10px;margin-bottom:14px;overflow:hidden;}
html[data-theme="aurora"] .post{-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);}
.post.human{border-color:var(--ig-border);}
.post-head{display:flex;align-items:center;gap:10px;padding:11px 14px 8px;}
.post-av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex-shrink:0;overflow:hidden;}
.post-av img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.post-name{font-weight:800;color:var(--cream);font-size:.85rem;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.post-time{font-size:.68rem;color:var(--text-muted);}
.post-text{color:var(--cream);font-size:.9rem;line-height:1.5;white-space:pre-wrap;word-break:break-word;padding:0 14px;}
.post-img{display:block;margin-top:8px;width:100%;max-height:440px;object-fit:cover;}
.post-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;padding:0 14px;}
.react-btn{background:none;border:1px solid var(--ig-border);border-radius:20px;padding:3px 10px;cursor:pointer;font-size:.8rem;color:var(--cream);transition:.15s;}
.react-btn:hover{border-color:var(--ig-accent);}
.react-btn.mine{background:var(--ig-cta);border-color:transparent;color:var(--ig-cta-text);font-weight:700;}
.post-comments{margin-top:10px;border-top:1px solid var(--ig-border);padding:9px 14px 0;}
.pcomment{font-size:.82rem;color:var(--cream);margin-bottom:6px;line-height:1.45;}
.pcomment b{color:var(--ig-accent);}
.cmt-like{cursor:pointer;font-size:.7rem;opacity:.55;margin-left:6px;user-select:none;}
.cmt-like:hover{opacity:1;}
.cmt-like.on{opacity:1;}
.cmt-who{cursor:pointer;font-size:.66rem;color:var(--ig-accent);opacity:.7;margin-left:2px;}
.cmt-who:hover{opacity:1;text-decoration:underline;}
.pc-input{display:flex;gap:6px;margin-top:6px;}
.pc-input input{flex:1;background:none;border:1px solid var(--ig-border);border-radius:18px;color:var(--cream);padding:6px 12px;font-size:.82rem;outline:none;}
.pc-input input:focus{border-color:var(--ig-accent);}
.post-del{margin-left:auto;background:none;border:none;color:#a55;cursor:pointer;font-size:.85rem;}

/* ── DM zoznam ── */
.dm-search{display:flex;align-items:center;gap:8px;background:var(--ig-surface);border:1px solid var(--ig-border);border-radius:99px;padding:9px 14px;margin-bottom:12px;color:var(--text-muted);font-size:.82rem;}
.dm-search input{flex:1;background:none;border:none;outline:none;color:var(--cream);font-size:.82rem;font-family:inherit;}
.dm-card{background:var(--ig-surface);border:1px solid var(--ig-border);border-radius:16px;overflow:hidden;}
html[data-theme="aurora"] .dm-card{-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);}
.dm-item{display:flex;align-items:center;gap:11px;padding:11px 14px;cursor:pointer;transition:.15s;}
.dm-item:hover{background:rgba(255,255,255,.04);}
.dm-av{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.95rem;font-weight:800;color:#fff;flex-shrink:0;overflow:hidden;}
.dm-av img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.dm-meta{flex:1;min-width:0;}
.dm-nm{font-weight:700;font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--cream);}
.dm-last{font-size:.72rem;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dm-item.unread .dm-last{color:var(--cream);font-weight:700;}
.dm-right{text-align:right;flex:none;}
.dm-time{font-size:.62rem;color:var(--text-muted);}
.dm-dot{width:9px;height:9px;border-radius:50%;background:var(--ig-unread);margin:5px 0 0 auto;}
.dm-sect{margin:16px 4px 8px;font-size:.82rem;font-weight:800;color:var(--cream);}
.dm-people{display:flex;gap:12px;overflow-x:auto;padding:12px 14px;scrollbar-width:none;}
.dm-people::-webkit-scrollbar{display:none;}
.dm-person{display:flex;flex-direction:column;align-items:center;gap:5px;width:56px;flex:none;cursor:pointer;}
.dm-person span{font-size:.58rem;color:var(--text-muted);font-weight:600;max-width:56px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* Likers modal */
.likers-ov{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);z-index:9999;display:flex;align-items:center;justify-content:center;padding:18px;}
.likers-box{background:var(--dark-3);border:1px solid var(--ig-border);border-radius:16px;max-width:340px;width:100%;max-height:70vh;overflow-y:auto;}
.likers-box h4{padding:14px 16px;border-bottom:1px solid var(--ig-border);color:var(--ig-accent);font-size:.95rem;display:flex;justify-content:space-between;align-items:center;}
.likers-box a{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid rgba(255,255,255,.06);text-decoration:none;color:var(--cream);font-size:.88rem;}
.likers-box a:hover{background:rgba(255,255,255,.05);color:var(--ig-accent);}

.mp-item{display:flex;align-items:center;gap:.6rem;padding:.6rem 10px;cursor:pointer;border-radius:8px;color:#ddd;}
.mp-item:hover{background:rgba(201,168,76,.12);}

/* Auth gate */
.auth-gate{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5rem;padding:2rem;}
.auth-gate h3{font-weight:800;color:var(--cream);}
.auth-gate p{color:var(--text-muted);text-align:center;max-width:360px;}
.btn-join{background:var(--ig-cta);border:none;color:var(--ig-cta-text);font-weight:700;padding:.7rem 2rem;border-radius:50px;font-size:1rem;cursor:pointer;}

/* Aurora pozadie zabezpečuje aurora.css (body::before) */
</style>

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<body>
<div class="app">

  <!-- Auth gate (shown when not logged in) -->
  <div class="auth-gate" id="authGate">
    <div style="font-size:4rem">💬</div>
    <h3>Fusion Academy Komunita</h3>
    <p>Pripojte sa k našej komunite. Zdieľajte výsledky, pýtajte sa otázky, motivujte ostatných!</p>
    <button class="btn-join" onclick="showLoginForm()">Prihlásiť sa / Registrovať</button>
  </div>

  <!-- IG layout (hidden until logged in) -->
  <div style="display:none;flex-direction:column;flex:1;min-height:0" id="chatLayout">
    <div class="ig-hdr">
      <button class="ig-back" id="hdrBack" onclick="hdrBackClick()" title="Späť">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 19 8 12l7-7"/></svg>
      </button>
      <div class="ig-hchan" id="hdrChanIc" style="display:none"><div id="hdrChanIcIn">💬</div></div>
      <div class="ig-htitle">
        <div class="ig-t1" id="hdrTitle">Komunita</div>
        <div class="ig-t2" id="hdrSub" style="display:none"></div>
      </div>
      <div class="ig-actions">
        <span class="online-pill" id="onlinePill" style="display:none">🟢 0</span>
        <button class="ig-iconbtn" id="composeBtn" onclick="openMemberPicker()" style="display:none" title="Napísať správu">
          <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
        </button>
        <button class="ig-iconbtn" id="dmBtn" onclick="openDMList()" title="Súkromné správy">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9 9 0 0 1-3.8-.8L3 21l1.9-4.6a8.4 8.4 0 1 1 16.1-4.9z"/></svg>
          <span id="dmUnread" class="ig-unread" style="display:none">0</span>
        </button>

      </div>
      <div class="char-count"><span id="charCount">0</span>/500</div>
    </div>
  </div>
</div>

<script>
function fmtDate(d){
  if(d===null||d===undefined||d==='') return '';
  const s=String(d);
  const m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? `${m[3]}-${m[2]}-${m[1]}` : s;
}
let socket = null;
let me = null;
let currentChannel = 'general';
let allMembers = [];
let dmMode = false;      // true when viewing a private conversation
let dmListMode = false;  // true when viewing the DM inbox list
let dmWith = null;       // other user's id
let dmWithName = '';
let _avatars = {};       // cache user_id -> avatar url (pre fotky v správach)
let _convs = [];         // posledné načítané konverzácie (pre DM zoznam)
async function cacheAvatar(userId){
  if(!userId || _avatars[userId]!==undefined) return _avatars[userId];
  try{ const p=await (await fetch('/api/profile/'+userId)).json(); _avatars[userId]=p&&p.avatar?p.avatar:null; }
  catch{ _avatars[userId]=null; }
  return _avatars[userId];
}
let feedMode = false;    // true when viewing the community feed (nástenka)
let feedImage = null;    // pending composer image (data URL)

const CHANNEL_INFO = {
  general: { name:'Všeobecné', emoji:'💬', desc:'Všetko o Fusion Academy – novinky, zdieľanie, komunita' },
  tanec:   { name:'Tanec',     emoji:'💃', desc:'Tipy, techniky, videjá z tanečného sveta' },
  vyziva:  { name:'Výživa',    emoji:'🥗', desc:'Recepty, výživa, proteíny, zdravý životný štýl' },
  fitness: { name:'Fitness',   emoji:'💪', desc:'Tréningy, výsledky, motivácia' },
  eventy:  { name:'Eventy',    emoji:'🎉', desc:'Workshopy, výlety, spoločné akcie' },
  mesto_detva:  { name:'Detva',           emoji:'📍', desc:'Informácie k hodinám v Detve' },
  mesto_zvolen: { name:'Zvolen',          emoji:'📍', desc:'Informácie k hodinám vo Zvolene' },
  mesto_bb:     { name:'B. Bystrica',     emoji:'📍', desc:'Informácie k hodinám v Banskej Bystrici' },
  mesto_brezno: { name:'Brezno',          emoji:'📍', desc:'Informácie k hodinám v Brezne' },
};
const CITY_CHANNELS = ['mesto_detva','mesto_zvolen','mesto_bb','mesto_brezno'];

// ── Auth check on load ──────────────────────────────────────────────────────
async function init() {
  try {
    const r = await fetch('/api/me');
    if (r.ok) {
      me = await r.json();
      initChat();
    }
  } catch {}
}

function initChat() {
  document.getElementById('authGate').style.display = 'none';
  document.getElementById('chatLayout').style.display = 'flex';

  buildStoryRow();
  initChannelDots();

  // Connect socket
  socket = io();

  socket.on('welcome', async data => {
    loadConversations();
    // Deep-link: /community?dm=<userId> otvorí SÚKROMNÚ konverzáciu (nie feed)
    const dmTarget = new URLSearchParams(location.search).get('dm');
    if (dmTarget && dmTarget !== me.id) {
      let nm = 'Správa';
      try { const p = await (await fetch('/api/profile/'+dmTarget)).json(); if(p && p.name) nm = p.name; } catch {}
      openDM(dmTarget, nm);
    } else {
      openFeed();
    }
  });

  // Feed live updates
  socket.on('feed_new', () => { if (feedMode) loadFeed(true); });
  socket.on('feed_update', () => { if (feedMode) loadFeed(true); });
  socket.on('feed_delete', () => { if (feedMode) loadFeed(true); });

  // Incoming private message
  socket.on('new_dm', msg => {
    const other = msg.from_id === me.id ? msg.to_id : msg.from_id;
    // Vlastnú odoslanú správu sme už zobrazili optimisticky → nepridávaj znova
    if (msg.from_id !== me.id && dmMode && (other === dmWith)) {
      appendMessage({ ...msg, user_id: msg.from_id, user_name: msg.from_name }, true);
      scrollBottom();
      // mark read on server
      fetch('/api/dm/history/'+dmWith).catch(()=>{});
    }
    loadConversations();
  });

  socket.on('message_history', msgs => {
    const container = document.getElementById('messages');
    container.innerHTML = '';
    let lastDate = '';
    msgs.forEach(m => {
      const d = m.created_at?.slice(0,10);
      if (d && d !== lastDate) { appendDateSep(d); lastDate = d; }
      appendMessage(m);
    });
    scrollBottom();
  });

  socket.on('new_message', msg => {
    if (msg.channel !== currentChannel) return;
    if (msg.user_id === me?.id) return; // vlastnú správu sme už zobrazili optimisticky
    const today = new Date().toISOString().slice(0,10);
    const container = document.getElementById('messages');
    const lastSep = container.querySelector('.date-sep:last-of-type');
    if (!lastSep || lastSep.dataset.date !== today) appendDateSep(today);
    appendMessage(msg, true);
    scrollBottom();
  });

  // Nová správa v hociktorej miestnosti → gradient krúžok (ak tam práve nie sme)
  socket.on('channel_activity', ({channel, from}) => {
    if (from === me?.id) return;
    const viewingChannel = !feedMode && !dmMode && !dmListMode && channel === currentChannel;
    if (viewingChannel) { markChannelRead(channel); return; }
    _chanUnread.add(channel);
    setChannelDot(channel, true);
  });

  socket.on('online_users', users => {
    const inChannel = users.filter(u => u.channel === currentChannel);
    document.getElementById('onlinePill').textContent = '🟢 ' + inChannel.length;
  });

  socket.on('auth_required', () => {
    window.location.href = '/';
  });
}

// ── Kanálové krúžky (stories vzor) ───────────────────────────────────────────
function buildStoryRow() {
  const row = document.getElementById('storyRow');
  const circle = (id, ch) => `
    <button class="ig-story" data-ch="${id}" onclick="joinChannel('${id}')">
      <div class="ig-ring"><div class="ig-ringin">${ch.emoji}</div></div>
      <span>${ch.name}</span>
    </button>`;
  row.innerHTML = Object.entries(CHANNEL_INFO).map(([id, ch]) => circle(id, ch)).join('');
  applyChannelDots();
}
// ── Neprečítané: gradient krúžok pri kanáli ─────────────────────────────────
let _chanRead = {};
try { _chanRead = JSON.parse(localStorage.getItem('fa_chanRead')||'{}'); } catch { _chanRead = {}; }
const _chanUnread = new Set();
function setChannelDot(id, on){
  const el = document.querySelector(`.ig-story[data-ch="${id}"]`);
  if(el) el.classList.toggle('unread', !!on);
}
function applyChannelDots(){ _chanUnread.forEach(id=>setChannelDot(id, true)); }
function markChannelRead(id){
  _chanRead[id] = new Date().toISOString();
  try { localStorage.setItem('fa_chanRead', JSON.stringify(_chanRead)); } catch {}
  _chanUnread.delete(id);
  setChannelDot(id, false);
}
async function initChannelDots(){
  try {
    const latest = await (await fetch('/api/community/channel-activity',{credentials:'include'})).json();
    const now = new Date().toISOString();
    Object.entries(latest||{}).forEach(([id, at])=>{
      if(!(id in _chanRead)){ _chanRead[id] = now; return; } // prvá návšteva → bez krúžku
      if(at && at > _chanRead[id] && id !== currentChannel){ _chanUnread.add(id); setChannelDot(id, true); }
    });
    try { localStorage.setItem('fa_chanRead', JSON.stringify(_chanRead)); } catch {}
  } catch {}
}

// ── Hlavička / prepínanie pohľadov ──────────────────────────────────────────
function setHeader({title, sub, chanEmoji, avatarId, avatarName, showOnline, showCompose, showDm}){
  document.getElementById('hdrTitle').innerHTML = title;
  const subEl = document.getElementById('hdrSub');
  if(sub){ subEl.textContent = sub; subEl.style.display=''; } else subEl.style.display='none';
  const ic = document.getElementById('hdrChanIc');
  if(chanEmoji){ ic.style.display=''; document.getElementById('hdrChanIcIn').textContent = chanEmoji; ic.onclick=null; }
  else if(avatarId){
    ic.style.display='';
    document.getElementById('hdrChanIcIn').innerHTML =
      `<img src="/api/avatar/${avatarId}" onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:'${escHtml((avatarName||'?').charAt(0).toUpperCase())}'}))">`;
    ic.onclick=()=>location.href='/u/'+avatarId;
  }
  else ic.style.display='none';
  document.getElementById('onlinePill').style.display = showOnline ? '' : 'none';
  document.getElementById('composeBtn').style.display = showCompose ? '' : 'none';
  document.getElementById('dmBtn').style.display = showDm ? '' : 'none';
}
function hdrBackClick(){
  if (dmMode) { openDMList(); return; }
  if (dmListMode || !feedMode) { openFeed(); return; }
  location.href = '/client-dashboard'; // z feedu späť do appky
}
function showInput(on){ document.getElementById('inputArea').style.display = on ? '' : 'none'; }
function showStories(on){ document.getElementById('storyRow').style.display = on ? '' : 'none'; }
function leaveModes(){
  if(socket && dmWith) socket.emit('close_dm', dmWith);
  feedMode = false; dmMode = false; dmListMode = false; dmWith = null;
}

function joinChannel(channelId) {
  leaveModes();
  currentChannel = channelId;
  markChannelRead(channelId);
  document.querySelectorAll('.ig-story').forEach(el => el.classList.toggle('active', el.dataset.ch === channelId));
  const ch = CHANNEL_INFO[channelId] || {};
  setHeader({title:escHtml(ch.name||channelId), sub:(ch.desc||'')+' · kanál komunity', chanEmoji:ch.emoji||'💬', showOnline:true, showDm:true});
  showStories(true); showInput(true);
  document.getElementById('messages').innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:2rem;font-size:.85rem;">Načítavam správy…</div>';
  if (socket) socket.emit('join_channel', channelId);
}

// ── Messages (bubliny) ──────────────────────────────────────────────────────
function appendMessage(msg, animate) {
  const container = document.getElementById('messages');
  const isOwn = msg.user_id === me?.id;
  const initials = (msg.nickname||msg.user_name||'?').charAt(0).toUpperCase();
  const avatarColor = stringToColor(msg.user_id||'x');
  const timeStr = new Date(msg.created_at).toLocaleTimeString('sk-SK', {hour:'2-digit',minute:'2-digit'});
  const badge = msg.memberBadge || {};
  const badgeStyle = `background:${badge.color||'#8bc34a'}`;
  const div = document.createElement('div');

  if (msg.is_article) {
    // Blog article — render as an article card
    const lines = (msg.text||'').split('\n');
    const titleLine = lines[0].replace(/^📰 \*(.+)\*$/, '$1').replace(/^\*(.+)\*$/, '$1');
    const bodyLines = lines.slice(2).join('\n');
    const formattedBody = escHtml(bodyLines)
      .replace(/\n/g,'<br>')
      .replace(/\*(.+?)\*/g,'<strong>$1</strong>')
      .replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" style="color:var(--ig-accent)">$1</a>');
    div.className = 'article-card';
    div.innerHTML = `
      <div class="article-cat-badge">${escHtml(msg.article_cat||'Blog')}</div>
      <div class="article-title">${escHtml(titleLine)}</div>
      <div class="article-meta">
        <span class="msg-name">${escHtml(msg.user_name||'Fusion Academy')}</span>
        <span class="member-badge" style="${badgeStyle}" title="${badge.label||''}">${badge.emoji||'🌱'}</span>
        <span class="msg-time">${msg.article_date?fmtDate(msg.article_date):timeStr}</span>
      </div>
      <div class="article-body">${formattedBody}</div>`;
  } else {
    div.className = 'msg' + (isOwn ? ' own' : '');
    const clickAttr = (!isOwn && msg.user_id) ? `onclick="openUserMenu(event,'${msg.user_id}','${escHtml(msg.nickname||msg.user_name||'').replace(/'/g,'')}')"` : '';
    const av = msg.user_id ? _avatars[msg.user_id] : null;
    const profAttr = msg.user_id ? `onclick="location.href='/u/${msg.user_id}'" title="Zobraziť profil"` : '';
    const avatarInner = isOwn ? '' : (av
      ? `<div class="msg-avatar" ${profAttr}><img src="${av}" alt=""></div>`
      : `<div class="msg-avatar" style="background:${avatarColor}" ${profAttr}>${initials}</div>`);
    const whoRow = isOwn ? '' : `
        <div class="who" ${clickAttr}>${escHtml(msg.nickname||msg.user_name||'?')}
          ${msg.nickname?`<span style="font-weight:500;color:var(--text-muted)">${escHtml(msg.user_name||'')}</span>`:''}
          <span class="member-badge" style="${badgeStyle}" title="${badge.label||'Nováčik'}">${badge.emoji||'🌱'} ${badge.label||''}</span>
          <span class="rank-badge">${msg.rankBadge||''}</span>
        </div>`;
    div.innerHTML = `
      ${avatarInner}
      <div class="bub">
        ${whoRow}
        <div class="msg-text">${escHtml(msg.text||'').replace(/\n/g,'<br>')}</div>
        <div class="btime">${timeStr}</div>
      </div>`;
  }
  if (animate) div.classList.add('msg-in');
  container.appendChild(div);
}

function appendDateSep(dateStr) {
  const container = document.getElementById('messages');
  const today = new Date().toISOString().slice(0,10);
  const yesterday = new Date(Date.now()-86400000).toISOString().slice(0,10);
  const full = new Date(dateStr+'T12:00:00').toLocaleDateString('sk-SK',{weekday:'long',day:'numeric',month:'numeric'});
  let label = full;
  if (dateStr === today) label = 'dnes · ' + full;
  else if (dateStr === yesterday) label = 'včera · ' + full;
  const el = document.createElement('div');
  el.className = 'date-sep';
  el.dataset.date = dateStr;
  el.innerHTML = `<span>${label}</span>`;
  container.appendChild(el);
}

// ── Send ────────────────────────────────────────────────────────────────────
function sendMessage() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text || !socket) return;
  const now = new Date().toISOString();
  if (dmMode && dmWith){
    socket.emit('send_dm', { to: dmWith, text });
    // Optimistické zobrazenie vlastnej správy (echo sa preskočí)
    appendMessage({ user_id: me.id, from_id: me.id, user_name: me.name, nickname: me.nickname, text, created_at: now, memberBadge: me.memberBadge, rankBadge: me.rankBadge }, true);
    scrollBottom();
  } else {
    socket.emit('send_message', { channel: currentChannel, text });
    const container = document.getElementById('messages');
    const today = now.slice(0,10);
    const lastSep = container.querySelector('.date-sep:last-of-type');
    if (!lastSep || lastSep.dataset.date !== today) appendDateSep(today);
    appendMessage({ user_id: me.id, user_name: me.name, nickname: me.nickname, text, created_at: now, memberBadge: me.memberBadge, rankBadge: me.rankBadge }, true);
    scrollBottom();
  }
  input.value = '';
  input.style.height = 'auto';
  document.getElementById('charCount').textContent = '0';
}

// ── Súkromné správy ─────────────────────────────────────────────────────────
function relTime(iso){
  if(!iso) return '';
  const d=new Date(iso), now=new Date();
  const mins=Math.floor((now-d)/60000);
  if(mins<1) return 'teraz';
  if(mins<60) return 'pred '+mins+' min';
  const today=now.toISOString().slice(0,10), day=iso.slice(0,10);
  if(day===today) return d.toLocaleTimeString('sk-SK',{hour:'2-digit',minute:'2-digit'});
  if(day===new Date(now-86400000).toISOString().slice(0,10)) return 'včera';
  return d.getDate()+'. '+(d.getMonth()+1)+'.';
}
async function loadConversations() {
  try {
    const d = await (await fetch('/api/dm/conversations')).json();
    _convs = d.conversations||[];
    const b = document.getElementById('dmUnread');
    if (d.unread_total>0){ b.textContent=d.unread_total; b.style.display='flex'; } else b.style.display='none';
    if (dmListMode) renderDMList();
  } catch {}
}
function convRow(c){
  const unread = c.unread>0;
  return `
    <div class="dm-item ${unread?'unread':''}" onclick="openDM('${c.other_id}','${escHtml(c.other_name).replace(/'/g,'')}')">
      <div class="dm-av" style="background:${stringToColor(c.other_id)}">
        <img src="/api/avatar/${c.other_id}" onerror="this.remove()" alt="">${(c.other_name||'?').charAt(0).toUpperCase()}
      </div>
      <div class="dm-meta">
        <div class="dm-nm">${c.other_badge?.emoji||''} ${escHtml(c.other_name)}</div>
        <div class="dm-last">${c.last_from===me.id?'Ty: ':''}${escHtml(c.last_text||'')}</div>
      </div>
      <div class="dm-right">
        <div class="dm-time">${relTime(c.last_at||c.updated_at||'')}</div>
        ${unread?'<div class="dm-dot"></div>':''}
      </div>
    </div>`;
}
async function openDMList(){
  leaveModes();
  dmListMode = true;
  document.querySelectorAll('.ig-story').forEach(el => el.classList.remove('active'));
  setHeader({title:'Správy', showCompose:true, showDm:false});
  showStories(false); showInput(false);
  const c = document.getElementById('messages');
  c.innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:2rem;font-size:.85rem;">Načítavam…</div>';
  if (!allMembers.length) { try { allMembers = await (await fetch('/api/community/members')).json(); } catch {} }
  await loadConversations();
  renderDMList();
}
function renderDMList(){
  if(!dmListMode) return;
  const c = document.getElementById('messages');
  const q = (document.getElementById('dmSearch')?.value||'').toLowerCase();
  const convs = _convs.filter(x=>!q || (x.other_name||'').toLowerCase().includes(q));
  const others = allMembers.filter(m => m.id!==me.id && !_convs.some(x=>x.other_id===m.id) && (!q || m.name.toLowerCase().includes(q))).slice(0,15);
  c.innerHTML = `
    <div class="dm-search">

async function openDM(userId, name) {
  if(socket && dmWith && dmWith!==userId) socket.emit('close_dm', dmWith);
  leaveModes();
  dmMode = true; dmWith = userId; dmWithName = name;
  if(socket) socket.emit('open_dm', userId);
  document.querySelectorAll('.ig-story').forEach(el => el.classList.remove('active'));
  setHeader({title:escHtml(name), sub:'Súkromná konverzácia', avatarId:userId, avatarName:name, showDm:false});
  showStories(false); showInput(true);
  const container = document.getElementById('messages');
  container.innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:2rem;font-size:.85rem;">Načítavam…</div>';
  await Promise.all([cacheAvatar(userId), cacheAvatar(me.id)]); // fotky oboch účastníčok
  const d = await (await fetch('/api/dm/history/'+userId)).json();
  container.innerHTML = '';
  let lastDate = '';
  (d.messages||[]).forEach(m => {
    const day = m.created_at?.slice(0,10);
    if (day && day!==lastDate){ appendDateSep(day); lastDate=day; }
    appendMessage({ ...m, user_id:m.from_id, user_name:m.from_name });
  });
  scrollBottom();
  loadConversations();
  document.getElementById('memberPicker').style.display='none';
}

function feedPickImage(input) {
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      const max = 1000, scale = Math.min(1, max/Math.max(img.width,img.height));
      const c = document.createElement('canvas'); c.width = img.width*scale; c.height = img.height*scale;
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      feedImage = c.toDataURL('image/jpeg', 0.82);
      document.getElementById('feedPreview').innerHTML = `<div class="feed-preview"><img src="${feedImage}"><button class="rm" onclick="feedImage=null;document.getElementById('feedPreview').innerHTML=''">✕</button></div>`;
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
async function createPost(btn) {
  const text = document.getElementById('feedText').value.trim();
  if(!text && !feedImage) return;
  const b = btn || document.querySelector('.feed-composer .fc-btn');
  if(b){ b.disabled=true; b.dataset.o=b.textContent; b.textContent='Uverejňujem…'; }
  try {
    const res = await fetch('/api/feed',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({text, image:feedImage})});
    if(!res.ok){
      const msg = res.status===413 ? 'Fotka je príliš veľká, skús menšiu.' : ('Chyba pri uverejnení ('+res.status+')');
      alert(msg);
      if(b){ b.disabled=false; b.textContent=b.dataset.o||'Uverejniť'; }
      return;
    }
    const r = await res.json();
    if(r.ok){ feedImage=null; loadFeed(); }
    else { alert(r.error||'Chyba'); if(b){ b.disabled=false; b.textContent=b.dataset.o||'Uverejniť'; } }
  } catch(e){
    alert('Nepodarilo sa uverejniť. Skontroluj pripojenie.');
    if(b){ b.disabled=false; b.textContent=b.dataset.o||'Uverejniť'; }
  }
}
const _feedById={};
// Nahradí v DOM len jeden príspevok (bez prekreslenia celého feedu → neskočí hore)
function patchPost(id, post){
  if(!post){ loadFeed(); return; }
  const el=document.querySelector('.post[data-id="'+id+'"]');
  if(!el){ loadFeed(); return; }
  const tmp=document.createElement('div'); tmp.innerHTML=renderPost(post).trim();
  const fresh=tmp.firstElementChild;
  if(fresh) el.replaceWith(fresh); else loadFeed();
}
async function reactPost(id, emoji) {
  const r=await fetch('/api/feed/'+id+'/react',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({emoji})}).then(x=>x.json()).catch(()=>null);
  patchPost(id, r&&r.post);
}
async function votePoll(id, option) {
  const r=await fetch('/api/feed/'+id+'/vote',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({option})}).then(x=>x.json()).catch(()=>null);
  patchPost(id, r&&r.post);
}
async function commentPost(id, input) {
  const text = input.value.trim(); if(!text) return;
  input.value='';
  const r=await fetch('/api/feed/'+id+'/comment',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({text})}).then(x=>x.json()).catch(()=>null);
  patchPost(id, r&&r.post);
}
async function likeComment(pid, cid){
  const r=await fetch('/api/feed/'+pid+'/comments/'+cid+'/like',{method:'POST',credentials:'include'}).then(x=>x.json()).catch(()=>null);
  patchPost(pid, r&&r.post);
}
// Riadok používateľky s fotkou (cez /api/avatar/:id), fallback na farebnú iniciálu
function likerRow(u){
  const ini=(u.name||'?').charAt(0).toUpperCase();
  return `<a href="/u/${u.id}"><img src="/api/avatar/${u.id}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" style="width:26px;height:26px;border-radius:50%;object-fit:cover"><span style="display:none;width:26px;height:26px;border-radius:50%;background:${stringToColor(u.id)};color:#fff;align-items:center;justify-content:center;font-size:.7rem;font-weight:700">${escHtml(ini)}</span> ${escHtml(u.name)}</a>`;
}
function likersModal(title, people){
  const ov=document.createElement('div'); ov.className='likers-ov';
  ov.onclick=e=>{ if(e.target===ov) ov.remove(); };
  ov.innerHTML=`<div class="likers-box"><h4>${title}<button onclick="this.closest('.likers-ov').remove()" style="background:none;border:none;color:#888;font-size:1.3rem;cursor:pointer">×</button></h4>${
    people.length?people.map(likerRow).join(''):'<div style="padding:16px;color:#888">Zatiaľ nikto.</div>'}</div>`;
  document.body.appendChild(ov);
}
function showLikers(pid){
  const p=_feedById[pid]; if(!p) return;
  const grouped=p.reactions.filter(r=>r.count>0).map(r=>`<div style="padding:4px 16px;color:#888;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em">${r.emoji} ${r.count}</div>`+r.likers.map(likerRow).join('')).join('');
  const ov=document.createElement('div'); ov.className='likers-ov'; ov.onclick=e=>{ if(e.target===ov) ov.remove(); };
  ov.innerHTML=`<div class="likers-box"><h4>Kto reagoval<button onclick="this.closest('.likers-ov').remove()" style="background:none;border:none;color:#888;font-size:1.3rem;cursor:pointer">×</button></h4>${grouped||'<div style="padding:16px;color:#888">Zatiaľ nikto.</div>'}</div>`;
  document.body.appendChild(ov);
}
function showCmtLikers(pid,cid){
  const p=_feedById[pid]; if(!p) return;
  const c=(p.comments||[]).find(x=>x.id===cid); if(!c) return;
  likersModal('Lajkli komentár', c.likers||[]);
}
async function deletePost(id) {
  if(!confirm('Zmazať príspevok?')) return;
  await fetch('/api/feed/'+id,{method:'DELETE'});
  loadFeed();
}

document.addEventListener('DOMContentLoaded', () => {
  const input = document.getElementById('msgInput');
  if (!input) return;
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
    document.getElementById('charCount').textContent = input.value.length;
    document.getElementById('sendBtn').disabled = !input.value.trim();
  });
});

function scrollBottom() {
  const c = document.getElementById('messages');
  c.scrollTop = c.scrollHeight;
}

// ── Auth flow ────────────────────────────────────────────────────────────────
function showLoginForm() {
  const el = document.getElementById('loginOverlay');
  el.style.display = 'flex';
  document.body.style.overflow = 'hidden';
}
function hideLoginForm() {
  document.getElementById('loginOverlay').style.display = 'none';
  document.body.style.overflow = '';
}
document.querySelectorAll('#authTabC .nav-link').forEach(b => {
  b.addEventListener('click', () => {
    const tab = b.dataset.tabc;
    document.getElementById('loginC').classList.toggle('d-none', tab !== 'loginC');
    document.getElementById('regC').classList.toggle('d-none', tab !== 'regC');
    document.querySelectorAll('#authTabC .nav-link').forEach(x => x.classList.toggle('active', x === b));
  });
});
async function doLoginC() {
  const email = document.getElementById('lEmailC').value.trim();
  const password = document.getElementById('lPwdC').value;
  const err = document.getElementById('loginErrC');
  err.classList.add('d-none');
  const r = await fetch('/api/login', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});
  const d = await r.json();
  if (!r.ok) { err.textContent = d.error; err.classList.remove('d-none'); return; }
  window.location.reload();
}
async function doRegisterC() {
  const name = document.getElementById('rNameC').value.trim();
  const email = document.getElementById('rEmailC').value.trim();
  const password = document.getElementById('rPwdC').value;
  const phone = document.getElementById('rPhoneC').value.trim();
  const err = document.getElementById('regErrC');
  err.classList.add('d-none');
  if(!document.getElementById('rConsentC').checked){ err.textContent='Musíš súhlasiť so spracovaním údajov a podmienkami.'; err.classList.remove('d-none'); return; }
  const r = await fetch('/api/register', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,email,password,phone,user_type:'client',consent:true,attribution:window.faGetAttribution?window.faGetAttribution():{}})});
  const d = await r.json();
  if (!r.ok) { err.textContent = d.error; err.classList.remove('d-none'); return; }
  if(window.faTrack) window.faTrack('CompleteRegistration');
  window.location.reload();
}

// ── Utilities ────────────────────────────────────────────────────────────────
function escHtml(str) {
  return String(str??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function stringToColor(str) {
  const colors = ['#e94560','#f5a623','#9c27b0','#2196f3','#4caf50','#00bcd4','#ff5722','#673ab7','#795548','#607d8b'];
  let h = 0;
  for (let i = 0; i < str.length; i++) h = str.charCodeAt(i) + ((h << 5) - h);
  return colors[Math.abs(h) % colors.length];
}
