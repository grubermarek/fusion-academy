<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="/logo-mark.png">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Profil dieťaťa – Fusion Academy</title>
  <script>/* téma pred prvým renderom (bez bliknutia) */try{if(localStorage.getItem('fa_theme')==='aurora')document.documentElement.dataset.theme='aurora'}catch(e){}</script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/aurora.css">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root{--gold:#C9A24C;--gold-light:#F3DFA8;--dark:#0A0908;--card:#1A1714;--card-2:#221E19;--border:#2A241C;
      --text:#EAE3D5;--muted:rgba(234,227,213,.55);--green:#4caf50;--orange:#ffb74d;--red:#e57373;
      --serif:'Cormorant Garamond',Georgia,serif;--sans:'Manrope',system-ui,sans-serif}
    *{box-sizing:border-box}
    body{margin:0;background:var(--dark);color:var(--text);font-family:var(--sans);min-height:100dvh;padding-bottom:110px;-webkit-font-smoothing:antialiased}
    .wrap{max-width:560px;margin:0 auto;padding:16px 16px 0}
    a{color:var(--gold)}
    .top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
    .back{color:var(--muted);text-decoration:none;font-size:.86rem;display:inline-flex;align-items:center;gap:4px}
    .head{display:flex;align-items:center;gap:14px;margin-bottom:16px}
    .avatar{width:62px;height:62px;border-radius:50%;background:linear-gradient(135deg,#ff6b9d,#c9a24c);display:flex;align-items:center;justify-content:center;font-size:1.8rem;flex-shrink:0}
    .head h1{font-family:var(--serif);font-size:1.7rem;margin:0;line-height:1.1}
    .head .sub{color:var(--muted);font-size:.86rem;margin-top:3px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px;margin-bottom:14px}
    .card h2{font-family:var(--serif);font-size:1.25rem;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
    .card h2 small{font-family:var(--sans);font-size:.74rem;color:var(--muted);font-weight:500}
    .stat{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}
    .stat div{background:var(--card-2);border-radius:12px;padding:10px 8px;text-align:center}
    .stat b{display:block;font-size:1.35rem;color:var(--gold)}
    .stat span{font-size:.7rem;color:var(--muted)}
    .grp{display:grid;gap:8px;margin:10px 0}
    .grp label{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:14px;cursor:pointer;background:var(--card-2);transition:border-color .15s}
    .grp label.on{border-color:var(--gold);box-shadow:0 0 0 1px rgba(201,162,76,.35) inset}
    .grp input{accent-color:var(--gold);width:18px;height:18px;flex-shrink:0}
    .grp b{display:block;font-size:.98rem}
    .grp small{display:block;color:var(--muted);font-size:.78rem;margin-top:2px}
    .grp .rec{font-size:.68rem;color:#111;background:var(--gold);border-radius:20px;padding:2px 8px;font-weight:800;white-space:nowrap}
    .btn{display:block;width:100%;border:0;border-radius:999px;padding:14px 18px;font-weight:800;font-size:1rem;cursor:pointer;font-family:inherit;text-align:center;text-decoration:none}
    .btn.gold{background:linear-gradient(102deg,#B98F3E,#F7E7B8 40%,#E7C878 60%,#B98F3E);color:#111}
    .btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text);font-weight:600;font-size:.9rem;padding:11px}
    .btn:disabled{opacity:.5;cursor:default}
    .note{color:var(--muted);font-size:.8rem;line-height:1.5;margin:8px 0 0}
    .row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:.9rem}
    .row:last-child{border-bottom:0}
    .row .d{color:var(--muted);font-size:.78rem}
    .pill{font-size:.68rem;padding:2px 8px;border-radius:20px;background:rgba(201,162,76,.16);color:var(--gold);white-space:nowrap}
    .ok{color:var(--green)} .warn{color:var(--orange)} .bad{color:var(--red)}
    input[type=text],input[type=date]{width:100%;padding:11px 14px;background:var(--card-2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:.95rem;font-family:inherit;color-scheme:dark}
    .field{margin-bottom:10px}.field label{display:block;font-size:.74rem;color:var(--muted);margin-bottom:4px}
    .link{background:none;border:0;color:var(--muted);text-decoration:underline dotted;cursor:pointer;font-family:inherit;font-size:.8rem;padding:0}
    .toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#2a2620;color:#fff;border:1px solid var(--gold);padding:10px 16px;border-radius:12px;font-size:.88rem;z-index:99;max-width:90vw;text-align:center}
    .empty{color:var(--muted);font-size:.86rem;text-align:center;padding:14px 6px;line-height:1.5}
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
    .modal>div{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:22px;max-width:340px;width:100%;text-align:center}
  </style>
</head>
<body>
<div class="wrap" id="app">
  <div class="top"><a class="back" href="/client-dashboard"><i class="bi bi-chevron-left"></i> Môj profil</a></div>
  <div class="empty" id="loading">Načítavam…</div>
</div>
<div class="modal" id="qrM" onclick="if(event.target.id==='qrM')this.style.display='none'"><div>
  <h3 style="margin:0 0 10px;font-family:var(--serif)" id="qrName"></h3>
  <div id="qrBox" style="display:flex;justify-content:center;background:#fff;padding:12px;border-radius:12px"></div>
  <p class="note">Tento kód ukáž na recepcii alebo trénerovi — návšteva sa zapíše dieťaťu.</p>
  <button class="btn ghost" onclick="document.getElementById('qrM').style.display='none'">Zavrieť</button>
</div></div>
<script>
const ID=location.pathname.split('/').pop();
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const eur=n=>(+n).toFixed(2).replace('.',',')+' €';
const DNI=['ne','po','ut','st','št','pi','so'];
const dsk=d=>{ if(!d) return ''; const m=String(d).match(/^(\d{4})-(\d{2})-(\d{2})/); if(!m) return String(d); const dt=new Date(m[1],+m[2]-1,+m[3]); return DNI[dt.getDay()]+' '+(+m[3])+'. '+(+m[2])+'.'; };
const dniDoKonca=d=>{ if(!d) return 999; return Math.ceil((new Date(d)-Date.now())/86400000); };
const dlong=d=>{ if(!d) return ''; const m=String(d).match(/^(\d{4})-(\d{2})-(\d{2})/); return m?(+m[3])+'. '+(+m[2])+'. '+m[1]:String(d); };
const api=(p,o)=>fetch(p,{credentials:'include',...(o||{}),headers:{'Content-Type':'application/json',...(o&&o.headers||{})},body:o&&o.body?JSON.stringify(o.body):undefined}).then(r=>r.json().then(d=>({status:r.status,...d}))).catch(()=>({}));
function toast(t){ const x=document.createElement('div'); x.className='toast'; x.textContent=t; document.body.appendChild(x); setTimeout(()=>x.remove(),3800); }
let D=null, VYBER=null;

async function load(){
  D=await api('/api/family/children/'+encodeURIComponent(ID));
  if(D.status===401){ location.href='/?next='+encodeURIComponent(location.pathname); return; }
  if(!D.id){ document.getElementById('loading').textContent=D.error||'Profil dieťaťa sa nenašiel.'; return; }
  document.title=D.name+' – Fusion Academy';
  const meno=D.name.split(' ')[0];
  const akt=D.membership&&D.membership.active;
  const skup=D.skupiny||[];
  // skupina: vybraná / uložená / odporúčaná podľa veku / prvá
  VYBER=VYBER||D.skupina||D.age_group||(skup[0]&&skup[0].key)||null;
  const skInfo=k=>skup.find(s=>s.key===k);
  const aktSk=skInfo(D.skupina);
  const vekTxt=D.age!=null?D.age+' r.':'bez dátumu narodenia';

  // ── členstvo + skupina ──
  let clenstvo='';
  if(akt){
    const od=D.odber;
    clenstvo=`<div class="row"><span>🏅 <b class="ok">Zumba Kids aktívne</b></span><span class="d">do ${dlong(D.membership.expires_at)}</span></div>
      ${D.auto_renew?`<div class="row"><span>🔄 <b>Automatická platba</b>${od&&od.suma!=null?' · '+eur(od.suma)+' / mes.':''}</span><span class="d">${od&&od.vypnuty?'<span class="warn">vypnutá</span>':(od&&od.dalsia_platba?'ďalšia platba '+dlong(od.dalsia_platba):'zapnutá')} ${od&&od.vypnuty?'':`<button class="link" onclick="vypniOdber()">vypnúť</button>`}</span></div>`
        :`<div class="row"><span>💳 Platba</span><span class="d"><span class="warn">bez automatickej platby · ${eur(D.plan.price_manual)} / mes.</span><br>${dniDoKonca(D.membership.expires_at)<=7?`<button class="link" onclick="zaplatOdber()">zapnúť automatickú platbu za ${eur(D.plan.price)}</button>`:`po skončení členstva vieš zapnúť automatickú platbu za ${eur(D.plan.price)}`}</span></div>`}
      <div class="row"><span>🧒 Skupina</span><span>${aktSk?`<b>${esc(aktSk.name)}</b> <span class="d">· ${esc(aktSk.label)}</span>`:'<span class="warn">nezaradené</span>'} <button class="link" onclick="ukazSkupiny()">zmeniť</button></span></div>
      <div id="skupinyBox" style="display:${aktSk?'none':'block'}">${skupinyHtml(skup)}<button class="btn gold" style="margin-top:6px" onclick="ulozSkupinu()">Prihlásiť do skupiny</button></div>
      <p class="note">${esc(meno)} chodí na hodiny skupiny automaticky — nič netreba rezervovať. Ak nepríde, tréner to len odškrtne.</p>`;
  } else {
    const konc=D.membership&&!D.membership.active?`<p class="note warn" style="margin:0 0 8px">Členstvo skončilo ${dlong(D.membership.expires_at)}.</p>`:'';
    clenstvo=`${konc}<div style="font-size:.9rem;margin-bottom:4px">Vyber skupinu podľa veku a zaplať — dieťa bude hneď prihlásené na všetky jej hodiny.</div>
      ${skupinyHtml(skup)}
      <div class="row" style="border:0"><span>🔄 Automatická platba · mesačne</span><b style="color:var(--gold);font-size:1.1rem">${eur(D.plan.price)}</b></div>
      <a class="btn gold" id="payBtn" href="#" onclick="zaplat();return false">Zaplatiť a prihlásiť do skupiny</a>
      <div style="text-align:center;margin-top:8px"><button class="link" onclick="inePlatby()">Iné možnosti platby (hotovosť, promo kód)</button></div>
      <p class="note">Platba kartou sa obnovuje každý mesiac sama, vypnúť ju vieš kedykoľvek. Bez automatickej platby (jednorazovo alebo v hotovosti) stojí Zumba Kids <b>${eur(D.plan.price_manual)}</b>, teda o ${Math.round((D.plan.prirazka||0.1)*100)} % viac. Faktúru dostaneš ty ako rodič.</p>`;
  }

  // ── najbližšie hodiny ──
  const up=(D.upcoming||[]);
  const upHtml=up.length?up.map(b=>`<div class="row"><span><b>${esc(dsk(b.date))}</b> ${esc(b.time)} <span class="d">· ${esc(b.name)}${b.location?' · '+esc(b.location):''}</span></span>${b.auto?'<span class="pill">automaticky</span>':'<span class="pill">rezervácia</span>'}</div>`).join('')
    :`<div class="empty">${akt?(aktSk?'Najbližšie termíny sa doplnia automaticky.':'Vyber skupinu — hodiny sa doplnia samy.'):'Po zaplatení bude dieťa prihlásené na hodiny skupiny automaticky.'}</div>`;

  // ── dochádzka ──
  const h=D.history||[];
  const hHtml=h.length?h.slice(0,20).map(x=>`<div class="row"><span>${x.attended?'<span class="ok">✅</span>':'<span class="bad">✕</span>'} ${esc(dsk(x.date))} <span class="d">${esc(x.time)} · ${esc(x.name)}</span></span></div>`).join('')
    :`<div class="empty">Zatiaľ žiadna odchodená hodina.</div>`;

  document.getElementById('app').innerHTML=`
    <div class="top"><a class="back" href="/client-dashboard"><i class="bi bi-chevron-left"></i> Môj profil</a></div>
    <div class="head"><div class="avatar">🧒</div><div style="flex:1;min-width:0"><h1>${esc(D.name)}</h1><div class="sub">${esc(vekTxt)}${aktSk?' · '+esc(aktSk.name):(D.age_group?' · odporúčané: Zumba '+esc(D.age_group):'')}</div></div>
      <button class="btn ghost" style="width:auto;padding:10px 12px" title="QR kód dieťaťa" onclick="qr()"><i class="bi bi-qr-code"></i></button></div>
    <div class="card"><h2>Členstvo <small>${akt?'aktívne':'bez členstva'}</small></h2>${clenstvo}</div>
    <div class="card"><h2>Najbližšie hodiny <small>14 dní</small></h2>${upHtml}
      <a class="btn ghost" style="margin-top:10px" href="/schedule?child=${encodeURIComponent(D.id)}">Rezervovať inú hodinu</a></div>
    <div class="card"><h2>Dochádzka</h2>
      <div class="stat"><div><b>${D.attended||0}</b><span>hodín spolu</span></div><div><b>${D.mesiac_navstev||0}</b><span>za 30 dní</span></div><div><b>${h.filter(x=>!x.attended).length}</b><span>vynechané</span></div></div>
      ${hHtml}</div>
    <div class="card"><h2>Nastavenia</h2>
      <div class="field"><label>Meno dieťaťa</label><input type="text" id="fName" value="${esc(D.name)}"></div>
      <div class="field"><label>Dátum narodenia <span style="opacity:.7">(podľa veku odporúčame skupinu)</span></label><input type="date" id="fBirth" value="${esc(D.birth_date||'')}" max="${new Date().toISOString().slice(0,10)}"></div>
      <button class="btn ghost" onclick="uloz()">Uložiť</button>
      <p class="note">Dieťa nemá vlastné prihlásenie — profil, platby aj dochádzku spravuješ ty. <button class="link" onclick="zmaz()">Zmazať profil dieťaťa</button></p></div>`;
  // po platbe kartou (návrat zo Stripe)
  const qs=new URLSearchParams(location.search);
  if(qs.get('stripe')==='success'){ toast('✅ Platba prijatá — dieťa je prihlásené do skupiny'); history.replaceState(null,'','/dieta/'+ID); if(!akt) setTimeout(load,4000); }
}
function skupinyHtml(skup){
  if(!skup.length) return '<div class="empty">Detské hodiny momentálne nie sú v rozvrhu.</div>';
  return `<div class="grp">${skup.map(s=>`<label class="${VYBER===s.key?'on':''}"><input type="radio" name="sk" value="${esc(s.key)}" ${VYBER===s.key?'checked':''} onchange="VYBER=this.value;[...document.querySelectorAll('.grp label')].forEach(l=>l.classList.toggle('on',l.querySelector('input').value===VYBER))">
    <span style="flex:1"><b>${esc(s.name)} <span style="color:var(--muted);font-weight:500">(${esc(s.vek)} r.)</span></b><small>${s.classes.map(c=>c.day+' '+c.time_start).join(' a ')}${s.classes[0]&&s.classes[0].location?' · '+esc(s.classes[0].location):''}</small></span>
    ${D.age_group===s.key?'<span class="rec">pre '+D.age+' r.</span>':''}</label>`).join('')}</div>`;
}
function ukazSkupiny(){ const b=document.getElementById('skupinyBox'); b.style.display=b.style.display==='none'?'block':'none'; }
async function ulozSkupinu(){
  if(!VYBER){ toast('Vyber skupinu'); return; }
  const r=await api('/api/family/children/'+ID,{method:'PUT',body:{kids_group:VYBER}});
  if(r.ok){ toast('✅ Zaradené do Zumba '+VYBER+(r.auto_bookings?' · '+r.auto_bookings+'× najbližšie termíny':'')); load(); } else toast(r.error||'Chyba');
}
// Predvolene automatická obnova (Marek 20. 9.): tlačidlo ide rovno do Stripe odberu,
// obchod s ostatnými spôsobmi platby je až za odkazom „Iné možnosti platby".
async function zaplat(){
  if(!VYBER){ toast('Najprv vyber skupinu'); return; }
  const b=document.getElementById('payBtn'); b.textContent='Presmerúvam na platbu…'; b.style.pointerEvents='none';
  const r=await api('/api/stripe/subscribe',{method:'POST',body:{plan_id:D.plan.id, for_child_id:D.id, kids_group:VYBER}});
  if(r.ok && r.url){ location.href=r.url; return; }
  b.textContent='Zaplatiť a prihlásiť do skupiny'; b.style.pointerEvents='';
  if(r.error) toast(r.error);
  if(r.status===400 && /Stripe/.test(r.error||'')) inePlatby(); // Stripe nedostupný → obchod
}
function inePlatby(){
  location.href='/obchod?buy='+encodeURIComponent(D.plan.id)+'&child='+encodeURIComponent(D.id)+'&skupina='+encodeURIComponent(VYBER||'');
}
function zaplatOdber(){
  location.href='/obchod?buy='+encodeURIComponent(D.plan.id)+'&child='+encodeURIComponent(D.id)+(D.skupina?'&skupina='+encodeURIComponent(D.skupina):'');
}
async function vypniOdber(){
  // Marek 20. 9.: pri vypnutí upozorniť, že ručná platba je o 10 % drahšia
  const pr=Math.round((D.plan.prirazka||0.1)*100);
  if(!confirm('Vypnúť automatickú platbu pre '+D.name+'?\n\nČlenstvo platí do konca zaplateného obdobia. Bez automatickej platby stojí Zumba Kids '+eur(D.plan.price_manual)+' mesačne namiesto '+eur(D.plan.price)+' (o '+pr+' % viac) a každý mesiac ho treba zaplatiť ručne.')) return;
  const r=await api('/api/stripe/subscribe/cancel',{method:'POST',body:{member_id:D.id, reason:'other', note:'rodič vypol odber dieťaťa'}});
  if(r.ok){ toast('Odber vypnutý'); load(); } else toast(r.error||'Chyba');
}
async function uloz(){
  const name=document.getElementById('fName').value.trim(), birth_date=document.getElementById('fBirth').value;
  if(!name){ toast('Zadaj meno'); return; }
  const r=await api('/api/family/children/'+ID,{method:'PUT',body:{name, birth_date:birth_date||null}});
  if(r.ok){ toast('Uložené'); VYBER=null; load(); } else toast(r.error||'Chyba');
}
async function zmaz(){
  if(!confirm('Zmazať profil dieťaťa „'+D.name+'"? Budúce rezervácie sa zrušia.')) return;
  const r=await api('/api/family/children/'+ID,{method:'DELETE'});
  if(r.ok){ location.href='/client-dashboard'; } else toast(r.error||'Chyba');
}
async function qr(){
  const d=await api('/api/me/qr?child_id='+encodeURIComponent(ID));
  if(!d.qr_data){ toast('QR sa nepodarilo načítať'); return; }
  document.getElementById('qrName').textContent=d.name; const box=document.getElementById('qrBox'); box.innerHTML='';
  new QRCode(box,{text:d.qr_data,width:200,height:200,colorDark:'#000',colorLight:'#fff'});
  document.getElementById('qrM').style.display='flex';
}
load();
</script>
<script src="/dock.js"></script>
</body>
</html>
