<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moja rezervácia – Fusion Academy</title>
<link rel="icon" type="image/png" href="/logo-mark.png">
<meta name="robots" content="noindex">
<!-- Od 18. 10. 2026 je táto stránka UŽ LEN na zmenu rezervácie z potvrdzovacieho mailu
     (/invite/KÓD?manage=TOKEN). Registrácia sa zjednotila do sprievodcu na /prva-hodina
     a server sem bez ?manage= nikoho nepustí — pôvodné kroky (mesto, termín, meno,
     prihlásenie cez Google) sa teda nedali zobraziť a boli odstránené. -->
<style>
:root{--gold:#C9A84C;--cream:#EAE3D5;--muted:#b9b3a6}
*{box-sizing:border-box}
body{background:#12100a;color:var(--cream);font-family:'Inter',system-ui,sans-serif;margin:0;min-height:100dvh;display:flex;flex-direction:column}
.wrap{max-width:440px;margin:0 auto;padding:22px 18px 40px;width:100%;flex:1}
.brand{font-weight:900;color:var(--gold);letter-spacing:.06em;text-align:center;padding:6px 0 18px;font-size:.9rem}
h1{font-size:1.65rem;line-height:1.2;margin:0 0 8px;text-align:center}
.sub{color:var(--muted);text-align:center;margin:0 0 26px;font-size:1rem}
.cta{display:block;width:100%;background:linear-gradient(102deg,#B98F3E,#E7C878);color:#231A08;border:none;border-radius:16px;padding:17px;font-weight:900;font-size:1.05rem;cursor:pointer;margin-top:6px}
.success-card{background:#1a1712;border:1px solid rgba(201,168,76,.4);border-radius:18px;padding:22px;margin:14px 0}
.success-card .row{display:flex;gap:10px;margin-bottom:10px;font-size:1rem}
.ghost{display:block;width:100%;background:none;border:1px solid #3a3428;color:var(--muted);border-radius:14px;padding:13px;min-height:44px;font-size:.9rem;cursor:pointer;margin-top:10px}
.fade{animation:fin .35s ease-out}
@keyframes fin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand" style="display:flex;justify-content:space-between;align-items:center"><span>FUSION ACADEMY</span><span id="langSw"></span></div>
  <div id="host"><div style="text-align:center;color:var(--muted);padding:60px 0">…</div></div>
</div>
<script src="/i18n.js"></script>
<script src="/i18n-pages.js"></script>
<script>
FA_I18N.mount('langSw');
document.addEventListener('fa-lang-changed',()=>location.reload());
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CODE=location.pathname.split('/').pop();
const MANAGE=new URLSearchParams(location.search).get('manage');
const host=document.getElementById('host');

async function j(url,opts){ const r=await fetch(url,{credentials:'include',...opts,headers:{'Content-Type':'application/json',...(opts&&opts.headers||{})}}); const d=await r.json().catch(()=>({})); return {status:r.status, ...d}; }

// Nový termín sa vyberá v sprievodcovi na /prva-hodina; kód pozvánky ide so sebou,
// nech pozývajúca o svoje body nepríde.
const NOVY_TERMIN='/prva-hodina'+(CODE?'?ref='+encodeURIComponent(CODE):'');

async function manageScreen(){
  const d=await j('/api/invite-manage/'+encodeURIComponent(MANAGE));
  if(!d.ok){ host.innerHTML='<div style="text-align:center;padding:60px 0">'+FA_T('inv.manage_invalid')+'</div>'; return; }
  host.innerHTML=`<div class="fade">
    <h1>${FA_T('inv.manage_h')}</h1>
    <p class="sub">${esc(d.name)}</p>
    ${d.bookings.length? d.bookings.map(b=>`<div class="success-card">
      <div class="row">💃 <b>${esc(b.class_name)}</b></div>
      <div class="row">📍 ${esc(b.city)} · 📅 ${esc(b.date.split('-').reverse().join('.'))} · 🕐 ${esc(b.time)}</div>
      <button class="ghost" onclick="mCancel('${b.id}')">${FA_T('inv.manage_cancel')}</button>
    </div>`).join('') : `<p class="sub">${FA_T('inv.manage_none')}</p><button class="cta" onclick="mRestart()">${FA_T('inv.manage_pick')}</button>`}
  </div>`;
}
function mRestart(){ location.href=NOVY_TERMIN; }
async function mCancel(id){
  if(!confirm(FA_T('inv.cancel_q'))) return;
  const d=await j('/api/invite-manage/'+encodeURIComponent(MANAGE)+'/cancel',{method:'POST',body:JSON.stringify({booking_id:id})});
  if(d.ok) location.href=NOVY_TERMIN;
  else alert(d.error||FA_T('inv.err_retry'));
}
// Bez ?manage= sem server nikoho nepustí (presmeruje na /prva-hodina) — toto je poistka
// pre prípad, že by niekto otvoril stránku priamo zo súboru alebo z cache.
if(MANAGE) manageScreen();
else location.replace(NOVY_TERMIN);
</script>
</body>
</html>
